<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psychedelic VJ Visuals - Spider Web</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.8);
            pointer-events: none;
            text-shadow: 0 0 8px rgba(255,0,255,0.8);
            font-size: 14px;
            letter-spacing: 2px;
            z-index: 10;
        }
        #ui h1 {
            margin: 0 0 5px 0;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>Pulsing Spider Web Mandalas</h1>
        <p>マウス/タッチで視点シフト | フルスクリーン推奨</p>
    </div>

    <!-- Three.jsとポストプロセッシングの読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <script>
        // ----------------------------------------------------
        // 初期設定
        // ----------------------------------------------------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        scene.fog = new THREE.FogExp2(0x000000, 0.0025); // 奥を暗闇に沈める

        const camera = new THREE.PerspectiveCamera(85, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 20;

        const renderer = new THREE.WebGLRenderer({ antialias: false }); // VJ特有の荒さを出すためオフでも可、重さ対策
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.toneMapping = THREE.ReinhardToneMapping;
        document.body.appendChild(renderer.domElement);

        // ----------------------------------------------------
        // ポストプロセッシング (強烈なBloomエフェクト)
        // ----------------------------------------------------
        const renderScene = new THREE.RenderPass(scene, camera);
        const bloomPass = new THREE.UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.5,  // 強さ：白飛びを防ぐためベースを下げる
            1.2,  // 広がり：少し広げてふんわりさせる
            0.3   // 閾値：少し上げて色の濃い部分を残す
        );

        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // ----------------------------------------------------
        // 蜘蛛の巣曼荼羅の生成ロジック
        // ----------------------------------------------------
        function createSpiderWeb(radius, segments, rings) {
            const group = new THREE.Group();
            const points = [];
            
            // 放射状の線と多角形の網目を作成
            for (let r = 1; r <= rings; r++) {
                const curRadius = (r / rings) * radius;
                // 少しずつ回転（ねじれ）を加える
                const offset = (r * 0.1); 
                
                for (let i = 0; i < segments; i++) {
                    const theta1 = (i / segments) * Math.PI * 2 + offset;
                    const theta2 = ((i + 1) % segments) / segments * Math.PI * 2 + offset;
                    
                    // 多角形の線（横の網目）
                    points.push(new THREE.Vector3(Math.cos(theta1) * curRadius, Math.sin(theta1) * curRadius, 0));
                    points.push(new THREE.Vector3(Math.cos(theta2) * curRadius, Math.sin(theta2) * curRadius, 0));
                    
                    // 中心からの放射状の線（一番外側のリングを描く時だけ中心から線を引く）
                    if (r === rings) {
                        points.push(new THREE.Vector3(0, 0, 0));
                        points.push(new THREE.Vector3(Math.cos(theta1) * curRadius, Math.sin(theta1) * curRadius, 0));
                    }
                }
            }

            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            
            // 1. ワイヤーフレームの線
            const lineMat = new THREE.LineBasicMaterial({ 
                color: 0xffffff, 
                transparent: true, 
                opacity: 0.9,
                blending: THREE.AdditiveBlending 
            });
            const lines = new THREE.LineSegments(geometry, lineMat);
            group.add(lines);

            // 2. 結節点に光の粒（露のような効果）
            const pointMat = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 1.2,
                transparent: true,
                opacity: 1.0,
                blending: THREE.AdditiveBlending
            });
            const dots = new THREE.Points(geometry, pointMat);
            group.add(dots);

            // 3. 背景をうっすら埋める面（重なった時に光が飽和する）
            const fillGeo = new THREE.CircleGeometry(radius, segments);
            const fillMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.08,
                side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending
            });
            const fillMesh = new THREE.Mesh(fillGeo, fillMat);
            // 面の頂点を線に合わせて少しねじる
            fillMesh.rotation.z = rings * 0.1;
            group.add(fillMesh);

            // アニメーション用にマテリアルを保存
            group.userData = {
                lineMat: lineMat,
                pointMat: pointMat,
                fillMat: fillMat,
                baseScale: 1.0
            };

            return group;
        }

        // ----------------------------------------------------
        // 蜘蛛の巣パターンを空間に敷き詰める
        // ----------------------------------------------------
        const webs = [];
        const webGroup = new THREE.Group();
        scene.add(webGroup);

        const radius = 35; // 蜘蛛の巣の大きさ
        const dx = radius * 1.5; // X軸の間隔
        const dy = radius * Math.sqrt(3) * 0.8; // Y軸の間隔（少し重ねる）
        const zLayers = 8; // 奥行きの層の数
        const zSpacing = 60; // 層ごとの間隔

        // ハニカム（六角形）グリッド状に配置
        for (let z = 0; z < zLayers; z++) {
            for (let x = -3; x <= 3; x++) {
                for (let y = -3; y <= 3; y++) {
                    // 円形に切り抜いて配置を最適化
                    if (x * x + y * y > 12) continue;

                    // セグメント数(角数)をランダムに(6角形か8角形か12角形)
                    const segments = [6, 8, 12][Math.floor(Math.random() * 3)];
                    const web = createSpiderWeb(radius, segments, 6);

                    // 配置座標の計算（偶数列はYをずらして隙間を埋める）
                    const px = x * dx;
                    const py = y * dy + (Math.abs(x) % 2 === 1 ? dy / 2 : 0);
                    const pz = -z * zSpacing - (Math.random() * 20); // 奥行きは少しランダムに

                    web.position.set(px, py, pz);

                    // 個別の揺らぎや色のオフセットを持たせる
                    web.userData = {
                        ...web.userData,
                        phase: Math.random() * Math.PI * 2,
                        rotSpeed: (Math.random() - 0.5) * 0.03, // ゆっくり回転
                        hueOffset: (x * 0.1 + y * 0.1 + z * 0.15) % 1, // 位置による色のグラデーション
                    };

                    webGroup.add(web);
                    webs.push(web);
                }
            }
        }

        // ----------------------------------------------------
        // 背景を漂う光のパーティクル
        // ----------------------------------------------------
        const particleGeo = new THREE.BufferGeometry();
        const pCount = 3000;
        const pPos = new Float32Array(pCount * 3);
        const loopDistance = zLayers * zSpacing;

        for (let i = 0; i < pCount; i++) {
            pPos[i * 3] = (Math.random() - 0.5) * 300;
            pPos[i * 3 + 1] = (Math.random() - 0.5) * 300;
            pPos[i * 3 + 2] = -Math.random() * loopDistance;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        const particleMat = new THREE.PointsMaterial({
            color: 0xffffff, size: 0.8, transparent: true, blending: THREE.AdditiveBlending
        });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        // ----------------------------------------------------
        // インタラクション
        // ----------------------------------------------------
        let targetX = 0, targetY = 0;
        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        document.addEventListener('mousemove', (e) => {
            targetX = (e.clientX - windowHalfX) * 0.05;
            targetY = (e.clientY - windowHalfY) * 0.05;
        });
        document.addEventListener('touchmove', (e) => {
            targetX = (e.touches[0].clientX - windowHalfX) * 0.05;
            targetY = (e.touches[0].clientY - windowHalfY) * 0.05;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // ----------------------------------------------------
        // アニメーションループ
        // ----------------------------------------------------
        const clock = new THREE.Clock();
        const bpm = 130; // トランス・テクノなどのBPM想定
        const bps = bpm / 60;
        const speed = 30; // カメラが進むような演出のスピード

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();
            const delta = clock.getDelta();

            // 1. 全体的なビート（脈動）の計算
            // 正弦波を累乗して、ドクン！という鋭いパルスを作る
            const globalBeat = Math.pow(Math.sin(time * Math.PI * bps), 4);
            const subBeat = Math.pow(Math.cos(time * Math.PI * bps * 0.5), 2);

            // 2. 蜘蛛の巣曼荼羅のアニメーション
            webs.forEach(web => {
                // 手前に移動させてループさせる
                web.position.z += speed * delta;
                if (web.position.z > camera.position.z + 20) {
                    web.position.z -= loopDistance;
                }

                // 独自の回転
                web.rotation.z += web.userData.rotSpeed;
                // Z軸の位置によって少し揺らす
                web.position.x += Math.sin(time + web.userData.phase) * 0.02;

                // スケールの脈動: 収縮の落差を大きくする (ベースを小さく、膨張を大きく)
                const localBeat = Math.sin(time * 2.0 + web.userData.phase) * 0.5 + 0.5;
                const scale = 0.5 + globalBeat * 1.2 + localBeat * 0.1;
                web.scale.set(scale, scale, 1);

                // サイケデリックな色相の変化
                const baseHue = (time * 0.2 + web.userData.hueOffset) % 1;
                
                // 真っ白にならないよう、明度(Lightness)の最大値を0.5（最も鮮やか）付近に抑える
                const lightness = 0.05 + globalBeat * 0.4 + localBeat * 0.05;
                
                // 彩度(Saturation)をMAX(1.0)にして、色付きの光として発光させる
                web.userData.lineMat.color.setHSL(baseHue, 1.0, lightness + 0.1); 
                web.userData.pointMat.color.setHSL((baseHue + 0.1) % 1, 1.0, lightness + 0.2);
                web.userData.fillMat.color.setHSL((baseHue + 0.5) % 1, 1.0, lightness * 0.3);
                
                // 面の不透明度もビートに連動させる（縮んだ時は面を透けさせて奥の線を見せる）
                web.userData.fillMat.opacity = 0.01 + globalBeat * 0.15;
            });

            // 3. パーティクルのアニメーション
            const positions = particles.geometry.attributes.position.array;
            for (let i = 0; i < pCount; i++) {
                positions[i * 3 + 2] += speed * delta * 1.5;
                if (positions[i * 3 + 2] > camera.position.z) {
                    positions[i * 3 + 2] -= loopDistance;
                }
            }
            particles.geometry.attributes.position.needsUpdate = true;
            particleMat.color.setHSL((time * 0.1) % 1, 1.0, 0.4 + globalBeat * 0.2); // パーティクルも白飛び防止

            // 4. Bloom（発光）強度のフラッシュ
            // 白飛びを抑え、色付きのふんわりとした光にする
            bloomPass.strength = 0.5 + globalBeat * 1.5;

            // 5. カメラワーク
            // マウスによる視点移動を滑らかに追従
            camera.position.x += (targetX - camera.position.x) * 0.05;
            camera.position.y += (-targetY - camera.position.y) * 0.05;
            // 空間全体を少し傾けてトリップ感を出す
            camera.rotation.z = Math.sin(time * 0.2) * 0.15;

            // 描画
            composer.render();
        }

        animate();
    </script>
</body>
</html>
