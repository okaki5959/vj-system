<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Cyberpunk VJ Loop</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
    }
    /* Canvasを画面いっぱいに広げ、ピクセルアートのジャギーを維持する */
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <canvas id="vjCanvas"></canvas>

  <script>
    const canvas = document.getElementById('vjCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    // 内部解像度の設定（低解像度にしてレトロ感を出す）
    let W, H;
    const pixelScale = 4; // ピクセルスケール（大きいほどドットが荒くなる）
    const tw = 32; // タイル幅
    const th = 16; // タイル高さ

    function resize() {
      W = canvas.width = Math.floor(window.innerWidth / pixelScale);
      H = canvas.height = Math.floor(window.innerHeight / pixelScale);
      ctx.imageSmoothingEnabled = false;
    }
    window.addEventListener('resize', resize);
    resize();

    // サイバーパンク×ファミコン風のカラーパレット
    const colors = {
      0: { top: '#1a0b2e', left: '#0d0517', right: '#08030f' }, // 床 (ダークパープル)
      1: { top: '#ff0055', left: '#a30036', right: '#5c001f' }, // ピンクビル
      2: { top: '#00eeff', left: '#008b96', right: '#00474d' }, // シアンビル
      3: { top: '#ffee00', left: '#9c9100', right: '#4a4500' }, // イエロービル
      4: { top: '#b000ff', left: '#5f008a', right: '#2e0042' }, // パープルビル
      5: { top: '#33ff00', left: '#118800', right: '#004400' }, // 発光グリーン床
    };

    // モンスターのスプライトパターン (0:メイン色, 1:黒, 3:白, スペース:透明)
    const sprites = {
      slime: [
        [
          "  0000  ",
          " 000000 ",
          " 030030 ",
          " 000000 ",
          " 00000  ",
          "  0  0  "
        ],
        [
          "  0000  ",
          " 000000 ",
          " 030030 ",
          " 000000 ",
          "  0000  ",
          " 0    0 "
        ]
      ],
      eye: [
        [
          "   000   ",
          "  00000  ",
          " 0003300 ",
          " 0003100 ",
          "  00000  ",
          "   000   "
        ],
        [
          "   000   ",
          "  00000  ",
          " 0000000 ",
          " 0033300 ",
          "  00000  ",
          "   000   "
        ]
      ],
      ghost: [
        [
          "  0000  ",
          " 000000 ",
          " 030030 ",
          " 010010 ",
          " 000000 ",
          " 0 00 0 "
        ],
        [
          "  0000  ",
          " 000000 ",
          " 030030 ",
          " 010010 ",
          " 000000 ",
          " 00  00 "
        ]
      ],
      bat: [
        [
          " 0    0 ",
          " 00  00 ",
          " 030030 ",
          " 000000 ",
          "  0  0  "
        ],
        [
          "        ",
          "  0  0  ",
          " 000000 ",
          " 030030 ",
          " 0    0 "
        ]
      ],
      skull: [
        [
          "  0000  ",
          " 000000 ",
          " 010010 ",
          " 000000 ",
          "  0110  ",
          "   00   "
        ],
        [
          "  0000  ",
          " 000000 ",
          " 010010 ",
          " 000000 ",
          "  0000  ",
          "  0110  "
        ]
      ]
    };

    // パーリンノイズの代わりのシンプルな擬似ハッシュ関数
    function hash(x, y) {
      let n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
      return n - Math.floor(n);
    }

    // 無限マップの生成ロジック
    function getMapData(x, y) {
      let rx = Math.abs(x % 8);
      let ry = Math.abs(y % 8);
      
      // 道（ダンジョンの通路）を広げて見通しを良くする
      if (rx <= 2 || ry <= 2) {
        if (hash(x, y) > 0.95) return { h: 0, type: 5 }; // まれに光る床
        return { h: 0, type: 0 }; 
      }
      
      // ビル（ダンジョンの壁）の高さを抑える
      let val = hash(x, y);
      if (val > 0.8) return { h: 3, type: 1 };
      if (val > 0.5) return { h: 2, type: 2 };
      if (val > 0.2) return { h: 1, type: 3 };
      return { h: 1, type: 4 };
    }

    // モンスターの管理
    const monsters = [];
    function createMonster(cx, cy) {
      const types = ['slime', 'eye', 'ghost', 'bat', 'skull'];
      return {
        x: Math.floor(cx + (Math.random() - 0.5) * 30),
        y: Math.floor(cy + (Math.random() - 0.5) * 30),
        type: types[Math.floor(Math.random() * types.length)],
        color: ['#33ff00', '#ff0055', '#00eeff', '#ffee00'][Math.floor(Math.random() * 4)],
        frame: 0
      };
    }

    // 初期モンスター配置
    for (let i = 0; i < 150; i++) {
      monsters.push(createMonster(0, 0));
    }

    function updateMonsters(camX, camY, frameCount) {
      for (let m of monsters) {
        // ビートに合わせてカクカク動く
        if (frameCount % 15 === 0) {
          m.frame = 1 - m.frame; // アニメーション切り替え
          // ランダム移動
          let dirs = [ {x:0,y:1}, {x:0,y:-1}, {x:1,y:0}, {x:-1,y:0} ];
          let d = dirs[Math.floor(Math.random() * 4)];
          let nx = Math.round(m.x) + d.x;
          let ny = Math.round(m.y) + d.y;
          
          // 床の上なら移動する
          if (getMapData(nx, ny).h === 0) {
            m.x = nx;
            m.y = ny;
          }
        }
        
        // カメラから離れすぎたら画面前方に再配置（ループ感）
        if (Math.abs(m.x - camX) > 25 || Math.abs(m.y - camY) > 25) {
          Object.assign(m, createMonster(camX + (Math.random() > 0.5 ? 20 : -20), camY + (Math.random() > 0.5 ? 20 : -20)));
        }
      }
    }

    // アイソメトリックなブロックを描画
    function drawBlock(ctx, cx, cy, type, isFloor) {
      const h = isFloor ? 2 : th; 
      let cols = colors[type];
      
      ctx.strokeStyle = '#000000'; // ファミコン風のアウトライン
      ctx.lineWidth = 1;

      // トップ面
      ctx.fillStyle = cols.top;
      ctx.beginPath();
      ctx.moveTo(cx, cy - h - th/2);
      ctx.lineTo(cx + tw/2, cy - h);
      ctx.lineTo(cx, cy - h + th/2);
      ctx.lineTo(cx - tw/2, cy - h);
      ctx.fill(); ctx.stroke();
      
      // レフト面
      ctx.fillStyle = cols.left;
      ctx.beginPath();
      ctx.moveTo(cx - tw/2, cy - h);
      ctx.lineTo(cx, cy - h + th/2);
      ctx.lineTo(cx, cy + th/2);
      ctx.lineTo(cx - tw/2, cy);
      ctx.fill(); ctx.stroke();

      // ライト面
      ctx.fillStyle = cols.right;
      ctx.beginPath();
      ctx.moveTo(cx, cy - h + th/2);
      ctx.lineTo(cx + tw/2, cy - h);
      ctx.lineTo(cx + tw/2, cy);
      ctx.lineTo(cx, cy + th/2);
      ctx.fill(); ctx.stroke();
    }

    // モンスターを描画
    function drawCharacter(ctx, cx, cy, m, time) {
      // 影
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.beginPath();
      ctx.ellipse(cx, cy, 12, 6, 0, 0, Math.PI*2);
      ctx.fill();
      
      let sprite = sprites[m.type][m.frame];
      let pw = 3; // ピクセルサイズを大きく
      let sw = sprite[0].length * pw;
      let sh = sprite.length * pw;
      
      let bounce = Math.abs(Math.sin(time * 0.01 + m.x)) * 6; // ぽよぽよ跳ねる
      let startX = cx - sw / 2;
      let startY = cy - sh - bounce;
      
      for (let row = 0; row < sprite.length; row++) {
        for (let col = 0; col < sprite[row].length; col++) {
          let char = sprite[row][col];
          if (char !== ' ') {
            ctx.fillStyle = char === '0' ? m.color : (char === '3' ? '#ffffff' : '#000000');
            ctx.fillRect(startX + col * pw, startY + row * pw, pw, pw);
          }
        }
      }
    }

    // VJ的HUD（画面表示）
    function drawHUD(ctx, W, H, time, frameCount) {
      ctx.fillStyle = '#ff0055';
      ctx.font = '10px "Courier New", monospace';
      
      // レコーディング風の点滅
      if (frameCount % 60 < 30) {
        ctx.fillText("REC [●]", 10, 20);
      } else {
        ctx.fillStyle = '#5c001f';
        ctx.fillText("REC [ ]", 10, 20);
      }
      
      ctx.fillStyle = '#00eeff';
      ctx.fillText("SECTOR: " + Math.floor(time/2000).toString().padStart(4, '0'), 10, 35);
      
      // グリッチ風のランダム数値
      ctx.fillText("SYS: " + (Math.random() > 0.9 ? "ERR" : "OK "), W - 60, 20);
      ctx.fillText("DAT: " + Math.floor(Math.random()*9999).toString().padStart(4, '0'), W - 60, 35);
    }

    // VJ的グリッチエフェクト
    function applyGlitch(ctx, W, H) {
      if (Math.random() > 0.96) { // 時々発動
        let numSlices = Math.floor(Math.random() * 4) + 1;
        for (let i = 0; i < numSlices; i++) {
          let sliceY = Math.floor(Math.random() * H);
          let sliceH = Math.floor(Math.random() * 15) + 5;
          let offsetX = (Math.random() - 0.5) * 30;
          
          ctx.drawImage(ctx.canvas, 
            0, sliceY, W, sliceH, 
            offsetX, sliceY, W, sliceH);
        }
      }
      
      // 色収差 (RGBずらし)
      if (Math.random() > 0.98) {
        ctx.globalCompositeOperation = 'screen';
        ctx.fillStyle = 'rgba(255, 0, 85, 0.2)';
        ctx.fillRect(0, 0, W, H);
        ctx.drawImage(ctx.canvas, 3, 0);
        ctx.globalCompositeOperation = 'source-over';
      }
    }

    // ブラウン管風スキャンライン
    function drawScanlines(ctx, W, H) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
      for (let y = 0; y < H; y += 2) {
        ctx.fillRect(0, y, W, 1);
      }
    }

    let startTime = Date.now();
    let frameCount = 0;

    // メインアニメーションループ
    function loop() {
      let time = Date.now() - startTime;
      frameCount++;
      
      // カメラの自動スクロール
      let camX = time * 0.003;
      let camY = time * 0.002;
      
      // ビート同期（BPM120 = 0.5秒間隔）による画面のズーム・揺れ
      let beat = (time % 500) / 500; 
      let scale = 1.0 + Math.max(0, 1.0 - beat * 4) * 0.03;
      
      // 背景クリア
      ctx.fillStyle = '#0a0512';
      ctx.fillRect(0, 0, W, H);
      
      ctx.save();
      // 画面中心を基準にスケール
      ctx.translate(W/2, H/2);
      ctx.scale(scale, scale);
      ctx.translate(-W/2, -H/2);
      
      let drawList = [];
      // 画面サイズに応じた描画範囲の計算
      let viewRadius = Math.ceil(Math.max(W/tw, H/th)) + 5;
      
      let startX = Math.floor(camX) - viewRadius;
      let endX = Math.floor(camX) + viewRadius;
      let startY = Math.floor(camY) - viewRadius;
      let endY = Math.floor(camY) + viewRadius + 5; // 高さを考慮してYは下方向広め
      
      // 視野内のマップ構築
      for (let y = startY; y <= endY; y++) {
        for (let x = startX; x <= endX; x++) {
          let md = getMapData(x, y);
          // 床の追加
          drawList.push({ type: 'block', x, y, z: 0, btype: md.type === 5 ? 5 : 0, isFloor: true });
          // ビルの追加
          for (let z = 1; z <= md.h; z++) {
            drawList.push({ type: 'block', x, y, z, btype: md.type, isFloor: false });
          }
        }
      }
      
      // モンスターの更新と追加
      updateMonsters(camX, camY, frameCount);
      for (let m of monsters) {
        drawList.push({ type: 'char', x: m.x, y: m.y, z: 0.2, obj: m });
      }
      
      // アイソメトリックZソート (奥から手前へ)
      drawList.sort((a, b) => {
        let da = a.x + a.y;
        let db = b.x + b.y;
        if (da !== db) return da - db; // まず画面の奥から
        if (a.z !== b.z) return a.z - b.z; // 同じマスなら下から上へ
        return a.type === 'char' ? 1 : -1; // キャラクターはブロックより手前
      });
      
      // 描画実行
      for (let item of drawList) {
        let dx = item.x - camX;
        let dy = item.y - camY;
        // アイソメトリック座標変換
        let sx = (dx - dy) * tw / 2 + W / 2;
        let sy = (dx + dy) * th / 2 + H / 2;
        
        // 画面外カリング (パフォーマンス最適化)
        if (sx < -tw*2 || sx > W + tw*2 || sy < -th - 80 || sy > H + th*2) continue;
        
        if (item.type === 'block') {
          drawBlock(ctx, sx, sy - item.z * th, item.btype, item.isFloor);
        } else {
          drawCharacter(ctx, sx, sy - item.z * th, item.obj, time);
        }
      }
      
      ctx.restore();
      
      // ポストプロセス・UI
      drawHUD(ctx, W, H, time, frameCount);
      applyGlitch(ctx, W, H);
      drawScanlines(ctx, W, H);
      
      requestAnimationFrame(loop);
    }

    // アニメーション開始
    loop();

  </script>
</body>
</html>
