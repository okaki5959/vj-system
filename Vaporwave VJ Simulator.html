<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAPORWAVE VJ // VHS GLITCH</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'MS PGothic', 'Courier New', monospace;
        }
        #webgl-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #subliminal-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            display: none;
            background-color: #0000AA; /* 古いテレビのブルーバック/天気予報背景 */
            color: white;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            mix-blend-mode: hard-light;
            pointer-events: none;
        }
        .weather-text {
            font-size: 8vw;
            font-weight: bold;
            text-shadow: 4px 4px 0 #000;
            letter-spacing: 1vw;
            image-rendering: pixelated;
        }
        .weather-icon {
            font-size: 15vw;
            margin: 20px 0;
            color: #FFD700;
            text-shadow: 5px 5px 0 #FF4500;
        }
        .weather-detail {
            font-size: 4vw;
            text-shadow: 2px 2px 0 #000;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border: 2px solid white;
        }
        
        /* 画面全体にかかる走査線オーバーレイ（CSS版の補助） */
        #scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            z-index: 5;
            pointer-events: none;
            opacity: 0.6;
        }
        
        /* 録画表示 */
        #rec {
            position: absolute;
            top: 5vh;
            left: 5vw;
            z-index: 5;
            color: white;
            font-size: 3vw;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000;
            pointer-events: none;
            display: flex;
            align-items: center;
        }
        #rec-dot {
            width: 2vw;
            height: 2vw;
            background-color: red;
            border-radius: 50%;
            margin-right: 10px;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        
        #play-info {
            position: absolute;
            bottom: 5vh;
            right: 5vw;
            z-index: 5;
            color: white;
            font-size: 2vw;
            text-shadow: 2px 2px 0px #000;
            pointer-events: none;
        }
    </style>
    <!-- Three.js本体とポストプロセス用コンポーネント -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
</head>
<body>
    <div id="webgl-container"></div>
    <div id="scanlines"></div>
    <div id="rec"><div id="rec-dot"></div>PLAY</div>
    <div id="play-info">SP 0:12:43<br>STEREO</div>

    <!-- サブリミナル用の天気予報レイヤー -->
    <div id="subliminal-layer">
        <div class="weather-text">あすの天気</div>
        <div class="weather-icon">☀</div>
        <div class="weather-detail">トウキョウ: 晴レ時々バグ</div>
    </div>

    <script>
        // --- 1. テクスチャの動的生成 ---

        // 市松模様のテクスチャ (床用)
        function createCheckerboardTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            
            const color1 = '#ff00ff'; // マゼンタ
            const color2 = '#00ffff'; // シアン
            
            const squareSize = 64;
            for (let y = 0; y < canvas.height; y += squareSize) {
                for (let x = 0; x < canvas.width; x += squareSize) {
                    ctx.fillStyle = ((x / squareSize + y / squareSize) % 2 === 0) ? color1 : color2;
                    ctx.fillRect(x, y, squareSize, squareSize);
                }
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.magFilter = THREE.NearestFilter; // ドット感を出す
            return texture;
        }

        // 古いWindows風のウィンドウテクスチャ
        function createWindowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 384;
            const ctx = canvas.getContext('2d');
            
            // 背景
            ctx.fillStyle = '#c0c0c0';
            ctx.fillRect(0, 0, 512, 384);
            // ボーダー (3D風)
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 512, 2);
            ctx.fillRect(0, 0, 2, 384);
            ctx.fillStyle = '#808080';
            ctx.fillRect(0, 382, 512, 2);
            ctx.fillRect(510, 0, 2, 384);
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 383, 512, 1);
            ctx.fillRect(511, 0, 1, 384);

            // タイトルバー
            ctx.fillStyle = '#000080';
            ctx.fillRect(4, 4, 504, 30);
            
            // タイトルテキスト
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 20px "MS Sans Serif", Arial';
            ctx.fillText('System Error', 10, 26);
            
            // 閉じるボタン
            ctx.fillStyle = '#c0c0c0';
            ctx.fillRect(484, 8, 20, 20);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(484, 8, 20, 2);
            ctx.fillRect(484, 8, 2, 20);
            ctx.fillStyle = '#000000';
            ctx.fillRect(484, 26, 20, 2);
            ctx.fillRect(502, 8, 2, 20);
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 16px Arial';
            ctx.fillText('X', 489, 23);

            // コンテンツ
            ctx.fillStyle = '#000000';
            ctx.font = '24px "MS Sans Serif", Arial';
            ctx.fillText('A fatal exception 0E has occurred.', 30, 120);
            ctx.fillText('The current application will be terminated.', 30, 160);
            
            // OKボタン
            ctx.fillStyle = '#c0c0c0';
            ctx.fillRect(206, 250, 100, 40);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(206, 250, 100, 2);
            ctx.fillRect(206, 250, 2, 40);
            ctx.fillStyle = '#000000';
            ctx.fillRect(206, 288, 100, 2);
            ctx.fillRect(304, 250, 2, 40);
            ctx.fillText('OK', 240, 278);

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        // フロッピーディスクのラベルテクスチャ
        function createFloppyLabelTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 256, 256);
            
            // ライン
            ctx.fillStyle = '#ff0000';
            ctx.fillRect(0, 0, 256, 40);
            ctx.fillStyle = '#0000ff';
            ctx.fillRect(0, 45, 256, 10);
            
            // テキスト
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 30px Arial';
            ctx.fillText('VIRTUAL', 10, 100);
            ctx.fillText('MEMORIES', 10, 140);
            
            ctx.font = '20px Arial';
            ctx.fillText('A:\\> _', 10, 200);

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        // --- 2. Three.js セットアップ ---
        
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a0033); // 暗い紫背景
        scene.fog = new THREE.FogExp2(0x1a0033, 0.015); // ピンク・紫系のフォグ

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(1); // 解像度を意図的に落としてレトロ感を出す設定も可能
        container.appendChild(renderer.domElement);

        // ライト
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xff00ff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);
        const dirLight2 = new THREE.DirectionalLight(0x00ffff, 0.8);
        dirLight2.position.set(-10, -20, -10);
        scene.add(dirLight2);

        // --- 3. オブジェクトの配置 ---

        // 床 (無限に続く市松模様)
        const floorGeo = new THREE.PlaneGeometry(2000, 2000);
        const floorTex = createCheckerboardTexture();
        floorTex.repeat.set(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ 
            map: floorTex,
            roughness: 0.2,
            metalness: 0.1
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -10;
        scene.add(floor);

        // 浮遊するオブジェクト群を管理する配列
        const floatingObjects = [];

        // ウィンドウオブジェクトの生成関数
        const windowTex = createWindowTexture();
        function spawnWindow() {
            const geo = new THREE.PlaneGeometry(16, 12);
            const mat = new THREE.MeshBasicMaterial({ map: windowTex, side: THREE.DoubleSide, transparent: true });
            const mesh = new THREE.Mesh(geo, mat);
            
            mesh.position.set(
                (Math.random() - 0.5) * 100,
                Math.random() * 30,
                -Math.random() * 200 - 50 // 奥の方に配置
            );
            mesh.rotation.set(
                (Math.random() - 0.5) * 0.5,
                (Math.random() - 0.5) * 0.5,
                (Math.random() - 0.5) * 0.2
            );
            
            scene.add(mesh);
            floatingObjects.push({
                mesh: mesh,
                rotSpeed: {
                    x: (Math.random() - 0.5) * 0.01,
                    y: (Math.random() - 0.5) * 0.01,
                    z: (Math.random() - 0.5) * 0.005
                },
                moveSpeed: Math.random() * 0.5 + 0.2
            });
        }

        // フロッピーオブジェクトの生成関数
        const floppyLabelTex = createFloppyLabelTexture();
        function spawnFloppy() {
            const group = new THREE.Group();
            
            // 本体 (プラスチック部分)
            const bodyGeo = new THREE.BoxGeometry(8, 8, 0.5);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            group.add(body);

            // メタルシャッター部分
            const shutterGeo = new THREE.BoxGeometry(3, 2.5, 0.55);
            const shutterMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.8, roughness: 0.2 });
            const shutter = new THREE.Mesh(shutterGeo, shutterMat);
            shutter.position.set(2, 2.75, 0);
            group.add(shutter);

            // ラベル
            const labelGeo = new THREE.PlaneGeometry(6, 4);
            const labelMat = new THREE.MeshBasicMaterial({ map: floppyLabelTex });
            const label = new THREE.Mesh(labelGeo, labelMat);
            label.position.set(0, -1, 0.26);
            group.add(label);

            group.position.set(
                (Math.random() - 0.5) * 100,
                Math.random() * 40 - 5,
                -Math.random() * 200 - 50
            );
            
            group.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
            
            scene.add(group);
            floatingObjects.push({
                mesh: group,
                rotSpeed: {
                    x: (Math.random() - 0.5) * 0.02,
                    y: (Math.random() - 0.5) * 0.02,
                    z: (Math.random() - 0.5) * 0.02
                },
                moveSpeed: Math.random() * 0.8 + 0.4
            });
        }

        // 初期オブジェクト配置
        for(let i=0; i<15; i++) spawnWindow();
        for(let i=0; i<20; i++) spawnFloppy();

        // --- 4. ポストプロセス (VHS Glitch Shader) ---
        
        const composer = new THREE.EffectComposer(renderer);
        const renderPass = new THREE.RenderPass(scene, camera);
        composer.addPass(renderPass);

        // カスタムVHSシェーダー
        const VhsShader = {
            uniforms: {
                "tDiffuse": { value: null },
                "time": { value: 0.0 },
                "distortion": { value: 1.0 }, // 歪みの強さ
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float time;
                uniform float distortion;
                varying vec2 vUv;

                // ランダム関数
                float rand(vec2 co){
                    return fract(sin(dot(co.xy ,vec2(12.9898,78.233))) * 43758.5453);
                }

                void main() {
                    vec2 uv = vUv;

                    // 1. トラッキングエラー（VHSのテープ乱れ）
                    // 画面下部ほど波打つようにする
                    float waveDistortion = sin(uv.y * 15.0 + time * 5.0) * 0.01 * distortion;
                    // 横方向の断続的なズレ
                    float stepDistortion = step(0.9, sin(uv.y * 3.0 - time * 10.0)) * 0.05 * distortion;
                    uv.x += waveDistortion + stepDistortion;

                    // 縦方向の揺れ (テープのたわみ)
                    uv.y += sin(time * 20.0) * 0.003 * distortion;

                    // 2. ブロックノイズ（強い歪みの時のみ発生）
                    vec2 blockUv = floor(uv * 20.0) / 20.0; // 画面を荒いグリッドに分割
                    float blockNoise = rand(blockUv + floor(time * 5.0));
                    if (blockNoise > 0.9 && distortion > 1.5) {
                        uv.x += (rand(blockUv) - 0.5) * 0.15;
                    }

                    // 境界外のラップアラウンド防止 (黒でクリップ)
                    if(uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) {
                        gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
                        return;
                    }

                    // 3. 色収差（RGBズレ）
                    // 歪みが強いほどズレが大きくなる
                    float rOffset = 0.005 + 0.01 * distortion;
                    float bOffset = -0.005 - 0.01 * distortion;
                    
                    float r = texture2D(tDiffuse, vec2(uv.x + rOffset, uv.y)).r;
                    float g = texture2D(tDiffuse, uv).g;
                    float b = texture2D(tDiffuse, vec2(uv.x + bOffset, uv.y)).b;
                    vec3 color = vec3(r, g, b);

                    // 4. ホワイトノイズ
                    float noise = (rand(uv + time) - 0.5) * 0.15 * distortion;
                    color += noise;

                    // 5. 色の劣化処理 (彩度を少し落とし、マゼンタ寄りに)
                    float luma = dot(color, vec3(0.299, 0.587, 0.114));
                    color = mix(color, vec3(luma), 0.2); // 少し白黒っぽく
                    color.r *= 1.1; // 赤強調
                    color.b *= 1.2; // 青強調
                    color.g *= 0.8; // 緑減衰

                    // ビネット (周辺減光)
                    float dist = distance(vUv, vec2(0.5, 0.5));
                    color *= smoothstep(0.8, 0.3, dist);

                    gl_FragColor = vec4(color, 1.0);
                }
            `
        };

        const vhsPass = new THREE.ShaderPass(VhsShader);
        composer.addPass(vhsPass);


        // --- 5. アニメーションとイベント ---

        let clock = new THREE.Clock();
        let targetDistortion = 1.0;
        let subliminalTimer = 0;
        const subliminalLayer = document.getElementById('subliminal-layer');

        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // 床をスクロールさせて前進しているように見せる
            floorTex.offset.y -= 0.5 * delta;

            // 浮遊オブジェクトのアニメーション
            floatingObjects.forEach((obj, index) => {
                obj.mesh.rotation.x += obj.rotSpeed.x;
                obj.mesh.rotation.y += obj.rotSpeed.y;
                obj.mesh.rotation.z += obj.rotSpeed.z;
                
                // 手前に向かって移動
                obj.mesh.position.z += obj.moveSpeed;

                // カメラより後ろに行ったら奥にリスポーン
                if (obj.mesh.position.z > camera.position.z + 10) {
                    obj.mesh.position.z = -200;
                    obj.mesh.position.x = (Math.random() - 0.5) * 100;
                    obj.mesh.position.y = Math.random() * 40 - 5;
                }
            });

            // --- 狂気的な編集効果の制御 ---

            // 1. トラッキングエラー（グリッチ）のランダム発生
            if (Math.random() < 0.02) { // 2%の確率で強い歪み
                targetDistortion = Math.random() * 4.0 + 2.0; 
            } else if (Math.random() < 0.1) {
                targetDistortion = 1.0; // すぐに戻す
            }
            // 歪み値を滑らかに補間
            vhsPass.uniforms.distortion.value += (targetDistortion - vhsPass.uniforms.distortion.value) * 0.1;

            // 2. サブリミナル天気予報のフラッシュ
            if (subliminalTimer <= 0) {
                // ごく稀に（例：約3〜8秒に1回）サブリミナルを発動
                if (Math.random() < 0.005) {
                    subliminalLayer.style.display = 'flex';
                    // 1〜3フレーム程度で消すためのタイマー
                    subliminalTimer = Math.floor(Math.random() * 3) + 1; 
                    
                    // 同時に強烈なグリッチをかける
                    vhsPass.uniforms.distortion.value = 8.0; 
                }
            } else {
                subliminalTimer--;
                if (subliminalTimer <= 0) {
                    subliminalLayer.style.display = 'none';
                }
            }

            // シェーダーの時間を更新
            vhsPass.uniforms.time.value = time;

            // レンダリング
            composer.render();
            
            // プレイ時間の更新 (SP 0:12:xx の部分)
            const playInfo = document.getElementById('play-info');
            const totalSeconds = Math.floor(time) + 763; // 12分43秒からスタート
            const m = Math.floor(totalSeconds / 60) % 60;
            const s = totalSeconds % 60;
            playInfo.innerHTML = `SP 0:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}<br>STEREO`;
        }

        // リサイズ対応
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // 実行開始
        animate();
    </script>
</body>
</html>
