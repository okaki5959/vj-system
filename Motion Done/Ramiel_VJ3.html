<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramiel VJ Motion Graphics</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffff;
            text-shadow: 0 0 5px #00aaff, 0 0 10px #00aaff;
            pointer-events: none;
            z-index: 10;
        }
        .hud-line {
            margin-bottom: 5px;
            font-size: 16px;
            letter-spacing: 2px;
        }
        .warning {
            color: #ff0000;
            text-shadow: 0 0 5px #ff0000, 0 0 10px #ff0000;
            font-weight: bold;
            animation: blink 0.2s infinite;
            display: none;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            background: 
                linear-gradient(rgba(0, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            background-position: center center;
            pointer-events: none;
            z-index: 5;
            opacity: 0.3;
        }
        .center-mark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 1px solid rgba(0, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
        }
        .center-mark::before, .center-mark::after {
            content: '';
            position: absolute;
            background: rgba(0, 255, 255, 0.8);
        }
        .center-mark::before { top: -10px; bottom: -10px; left: 19px; width: 2px; }
        .center-mark::after { left: -10px; right: -10px; top: 19px; height: 2px; }
    </style>
</head>
<body>
    <div id="crosshair"><div class="center-mark"></div></div>
    <div id="hud">
        <div class="hud-line">SYSTEM: ONLINE</div>
        <div class="hud-line">TARGET: ANGEL-06</div>
        <div class="hud-line warning" id="warning-msg">HIGH ENERGY DETECTED</div>
        <div class="hud-line">PHASE: <span id="mode-text">IDLE</span></div>
        <div class="hud-line">SYNC RATE: <span id="sync-rate">400.0%</span></div>
        <div class="hud-line" style="font-size: 12px; margin-top: 20px; opacity: 0.7;">CLICK TO FORCE TRANSFORM / FULLSCREEN</div>
    </div>

    <!-- Three.js & Postprocessing dependencies (r128) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <script>
        // --- Setup Scene ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const baseCameraPos = new THREE.Vector3(0, 0, 15);
        camera.position.copy(baseCameraPos);

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // 負荷軽減のため最大2
        document.body.appendChild(renderer.domElement);

        // --- Postprocessing ---
        const renderScene = new THREE.RenderPass(scene, camera);
        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene);

        // Bloom Pass (強烈な発光)
        const bloomPass = new THREE.UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            2.0, // strength
            0.5, // radius
            0.1  // threshold
        );
        composer.addPass(bloomPass);

        // Custom CRT & Glitch Shader Pass
        const CRTShader = {
            uniforms: {
                "tDiffuse": { value: null },
                "time": { value: 0.0 },
                "resolution": { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                "glitchIntensity": { value: 0.0 },
                "rgbShift": { value: 0.005 }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float time;
                uniform vec2 resolution;
                uniform float glitchIntensity;
                uniform float rgbShift;
                varying vec2 vUv;

                // 疑似乱数ジェネレーター
                float rand(vec2 co){
                    return fract(sin(dot(co.xy ,vec2(12.9898,78.233))) * 43758.5453);
                }

                void main() {
                    vec2 uv = vUv;

                    // Barrel Distortion (ブラウン管の丸み)
                    vec2 crtUv = uv * 2.0 - 1.0;
                    float offset = dot(crtUv, crtUv) * 0.1;
                    crtUv = crtUv * (1.0 - offset);
                    crtUv = (crtUv + 1.0) / 2.0;

                    // 画面外は黒
                    if(crtUv.x < 0.0 || crtUv.x > 1.0 || crtUv.y < 0.0 || crtUv.y > 1.0) {
                        gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
                        return;
                    }

                    // グリッチによる横ズレ
                    float glitchOffset = 0.0;
                    if (glitchIntensity > 0.1) {
                        float stripY = floor(crtUv.y * 30.0);
                        if (rand(vec2(time * 10.0, stripY)) > 0.8) {
                            glitchOffset = (rand(vec2(time, stripY)) - 0.5) * 0.2 * glitchIntensity;
                        }
                    }
                    crtUv.x += glitchOffset;

                    // 色収差 (RGB Shift)
                    float currentShift = rgbShift + glitchIntensity * 0.05 * rand(vec2(time, crtUv.y));
                    vec4 r = texture2D(tDiffuse, crtUv + vec2(currentShift, 0.0));
                    vec4 g = texture2D(tDiffuse, crtUv);
                    vec4 b = texture2D(tDiffuse, crtUv - vec2(currentShift, 0.0));
                    vec4 color = vec4(r.r, g.g, b.b, 1.0);

                    // 走査線 (Scanlines)
                    float scanline = sin(uv.y * resolution.y * 1.5) * 0.05;
                    color.rgb -= scanline;

                    // ビネット (Vignette)
                    float vignette = length(uv - 0.5);
                    color.rgb *= 1.0 - vignette * 0.8;

                    // 全体的なノイズとフリッカー
                    color.rgb += (rand(uv + time) - 0.5) * 0.05;
                    color.rgb *= 1.0 - 0.1 * rand(vec2(time * 5.0)) * glitchIntensity;

                    gl_FragColor = color;
                }
            `
        };
        const crtPass = new THREE.ShaderPass(CRTShader);
        composer.addPass(crtPass);


        // --- Objects: Ramiel (Octahedron) ---
        const masterGroup = new THREE.Group();
        scene.add(masterGroup);

        // ラミエル本体マテリアル
        const ramielGeo = new THREE.OctahedronGeometry(3, 0);
        const ramielMat = new THREE.MeshPhongMaterial({
            color: 0x0088ff,
            emissive: 0x001144,
            specular: 0xffffff,
            shininess: 100,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide,
            flatShading: true
        });
        const ramielMesh = new THREE.Mesh(ramielGeo, ramielMat);
        masterGroup.add(ramielMesh);

        // ワイヤーフレーム
        const wireGeo = new THREE.EdgesGeometry(ramielGeo);
        const wireMat = new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 2 });
        const wireMesh = new THREE.LineSegments(wireGeo, wireMat);
        // Zファイティング防止のため少し大きく
        wireMesh.scale.set(1.01, 1.01, 1.01);
        masterGroup.add(wireMesh);

        // 内部コア
        const coreGeo = new THREE.SphereGeometry(0.5, 16, 16);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const coreMesh = new THREE.Mesh(coreGeo, coreMat);
        masterGroup.add(coreMesh);

        // コア光源
        const coreLight = new THREE.PointLight(0xff0000, 2, 20);
        masterGroup.add(coreLight);

        // 周囲のビット（分裂した破片）
        const bitsCount = 8;
        const bits = [];
        const bitGeo = new THREE.OctahedronGeometry(0.5, 0);
        for(let i=0; i<bitsCount; i++) {
            const bitGroup = new THREE.Group();
            
            const bMesh = new THREE.Mesh(bitGeo, ramielMat);
            const bWire = new THREE.LineSegments(new THREE.EdgesGeometry(bitGeo), wireMat);
            bWire.scale.set(1.02, 1.02, 1.02);
            
            bitGroup.add(bMesh);
            bitGroup.add(bWire);
            masterGroup.add(bitGroup);
            
            bits.push({
                group: bitGroup,
                baseAngle: (i / bitsCount) * Math.PI * 2,
                targetPos: new THREE.Vector3(),
                currentPos: new THREE.Vector3()
            });
        }

        // 背景パーティクル（宇宙の塵/ノイズ）
        const particleGeo = new THREE.BufferGeometry();
        const particleCount = 1000;
        const posArray = new Float32Array(particleCount * 3);
        for(let i=0; i<particleCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 100;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particleMat = new THREE.PointsMaterial({
            size: 0.1,
            color: 0x00aaff,
            transparent: true,
            opacity: 0.5,
            blending: THREE.AdditiveBlending
        });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        // --- Lights ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 10, 5);
        scene.add(dirLight);


        // --- Animation & VJ Logic ---
        const clock = new THREE.Clock();
        let time = 0;

        // 目標値（補間用）
        let targetScale = new THREE.Vector3(1, 1, 1);
        let currentScale = new THREE.Vector3(1, 1, 1);
        
        let targetRotSpeed = new THREE.Vector3(0.01, 0.02, 0);
        let currentRotSpeed = new THREE.Vector3(0, 0, 0);
        let currentRotation = new THREE.Vector3(0, 0, 0);

        let targetBloom = 1.5;
        let shakeIntensity = 0;
        let targetGlitch = 0;
        let currentGlitch = 0;
        let beatPulse = 0;

        // URLパラメータでモード固定
        const _urlParams = new URLSearchParams(window.location.search);
        const _lockedScene = _urlParams.has('scene') ? parseInt(_urlParams.get('scene')) : -1;

        const MODES = {
            IDLE: 0,
            ATTACK_CANNON: 1, // 加粒子砲（細長く伸びる）
            DEFENSE_SHIELD: 2, // 防御（平べったく広がる）
            DRILL: 3, // ドリル攻撃（Y軸に伸びて高速回転）
            BURST: 4 // エネルギー暴走（ランダムな変形）
        };
        let currentMode = (_lockedScene >= 0 && _lockedScene <= 4) ? _lockedScene : MODES.IDLE;
        let modeLocked = _lockedScene >= 0;
        let modeTimer = 0;
        const modeInterval = 4.0; // 4秒ごとにモード自動切替

        // モード変更処理
        function changeMode() {
            // エフェクト爆発
            targetGlitch = 1.5;
            shakeIntensity = 2.0;
            targetBloom = 5.0; // 一瞬強烈に光る
            
            // 次のモードをランダム決定（同じにならないように）
            let nextMode;
            do {
                nextMode = Math.floor(Math.random() * Object.keys(MODES).length);
            } while (nextMode === currentMode);
            currentMode = nextMode;

            const modeTextEl = document.getElementById('mode-text');
            const warningEl = document.getElementById('warning-msg');
            warningEl.style.display = 'none';

            switch(currentMode) {
                case MODES.IDLE:
                    modeTextEl.innerText = "IDLE";
                    targetScale.set(1, 1, 1);
                    targetRotSpeed.set(0.01, 0.02, 0.005);
                    ramielMat.emissive.setHex(0x001144);
                    coreMat.color.setHex(0xff0000);
                    break;
                
                case MODES.ATTACK_CANNON:
                    modeTextEl.innerText = "ATTACK (PARTICLE CANNON)";
                    warningEl.style.display = 'block';
                    targetScale.set(0.2, 0.2, 5.0); // Z軸に鋭く伸びる
                    targetRotSpeed.set(0, 0, 0.5); // Z軸高速回転
                    ramielMat.emissive.setHex(0x0033ff);
                    coreMat.color.setHex(0xffffff); // コア白飛び
                    break;
                
                case MODES.DEFENSE_SHIELD:
                    modeTextEl.innerText = "DEFENSE SHIELD";
                    targetScale.set(4.0, 0.1, 4.0); // 平べったく
                    targetRotSpeed.set(0, 0.1, 0);
                    ramielMat.emissive.setHex(0x00aa00); // 防御は少し緑がかる
                    coreMat.color.setHex(0xffaa00);
                    break;

                case MODES.DRILL:
                    modeTextEl.innerText = "ATTACK (DRILL)";
                    warningEl.style.display = 'block';
                    targetScale.set(0.5, 4.0, 0.5); // Y軸に伸びる
                    targetRotSpeed.set(0, 1.0, 0); // Y軸超高速回転
                    ramielMat.emissive.setHex(0xaa00ff); // 紫っぽく
                    coreMat.color.setHex(0xff00ff);
                    break;

                case MODES.BURST:
                    modeTextEl.innerText = "UNSTABLE / BURST";
                    warningEl.style.display = 'block';
                    targetRotSpeed.set(0.2, 0.3, 0.4);
                    ramielMat.emissive.setHex(0xff0000); // 真っ赤に
                    coreMat.color.setHex(0xffffff);
                    break;
            }
        }

        // --- Render Loop ---
        const bpm = 130;
        const beatInterval = 60 / bpm;
        let lastBeat = 0;

        function animate() {
            requestAnimationFrame(animate);

            const dt = clock.getDelta();
            time += dt;
            modeTimer += dt;

            // ビート同期エフェクト
            if (time - lastBeat > beatInterval) {
                lastBeat = time;
                beatPulse = 1.0;
                // HUDの同期率をランダムに更新
                document.getElementById('sync-rate').innerText = (200 + Math.random() * 250).toFixed(1) + "%";
            }
            beatPulse = THREE.MathUtils.lerp(beatPulse, 0, 0.1);

            // 自動モード切替（固定モード時は無効）
            if (!modeLocked && modeTimer > modeInterval) {
                modeTimer = 0;
                changeMode();
            }

            // BURSTモード時のランダムスケール
            if (currentMode === MODES.BURST) {
                if (Math.random() > 0.8) {
                    targetScale.set(1 + Math.random()*2, 1 + Math.random()*2, 1 + Math.random()*2);
                }
            }

            // パラメータのLerp補間
            currentScale.lerp(targetScale, 0.1);
            ramielMesh.scale.copy(currentScale);
            wireMesh.scale.copy(currentScale).multiplyScalar(1.01); // 常に少し大きめ

            currentRotSpeed.lerp(targetRotSpeed, 0.05);
            currentRotation.add(currentRotSpeed);
            masterGroup.rotation.set(currentRotation.x, currentRotation.y, currentRotation.z);

            // コアの鼓動（ビートに合わせる + 攻撃時は激しく）
            const coreBaseScale = (currentMode === MODES.ATTACK_CANNON || currentMode === MODES.DRILL) ? 1.5 : 1.0;
            const pulseScale = coreBaseScale + beatPulse * 0.5 + Math.sin(time * 20.0) * 0.1;
            coreMesh.scale.set(pulseScale, pulseScale, pulseScale);
            coreLight.intensity = pulseScale * 2.0;

            // ビット（破片）の動き計算
            for (let i = 0; i < bitsCount; i++) {
                const bit = bits[i];
                const angle = bit.baseAngle + time * (currentMode === MODES.DRILL ? 5.0 : 1.0);
                
                // モードごとのターゲット位置
                if (currentMode === MODES.IDLE) {
                    bit.targetPos.set(Math.sin(angle) * 5, Math.cos(angle * 2) * 2, Math.cos(angle) * 5);
                } else if (currentMode === MODES.ATTACK_CANNON) {
                    // Z軸前方に並ぶ（ビームのガイド）
                    bit.targetPos.set(Math.sin(angle*5)*0.5, Math.cos(angle*5)*0.5, 4 + i * 1.5);
                } else if (currentMode === MODES.DEFENSE_SHIELD) {
                    // 周囲に平面バリアを形成
                    bit.targetPos.set(Math.sin(bit.baseAngle) * 8, 0, Math.cos(bit.baseAngle) * 8);
                } else if (currentMode === MODES.DRILL) {
                    // Y軸に螺旋
                    bit.targetPos.set(Math.sin(angle) * 2, (i - bitsCount/2) * 1.5, Math.cos(angle) * 2);
                } else {
                    // BURST: 暴れ回る
                    bit.targetPos.set((Math.random()-0.5)*10, (Math.random()-0.5)*10, (Math.random()-0.5)*10);
                }

                bit.currentPos.lerp(bit.targetPos, 0.1);
                bit.group.position.copy(bit.currentPos);
                // ビット自身も回転
                bit.group.rotation.x += 0.05;
                bit.group.rotation.y += 0.05;
            }

            // カメラシェイク
            if (shakeIntensity > 0.01) {
                camera.position.x = baseCameraPos.x + (Math.random() - 0.5) * shakeIntensity;
                camera.position.y = baseCameraPos.y + (Math.random() - 0.5) * shakeIntensity;
                camera.position.z = baseCameraPos.z + (Math.random() - 0.5) * shakeIntensity;
                shakeIntensity = THREE.MathUtils.lerp(shakeIntensity, 0, 0.1);
            } else {
                camera.position.copy(baseCameraPos);
            }
            
            // 攻撃時は常に微弱なシェイク
            if (currentMode === MODES.ATTACK_CANNON || currentMode === MODES.DRILL || currentMode === MODES.BURST) {
                camera.position.x += (Math.random() - 0.5) * 0.2;
                camera.position.y += (Math.random() - 0.5) * 0.2;
            }

            // パーティクル回転
            particles.rotation.y = time * 0.05;
            particles.rotation.z = time * 0.02;

            // ポストプロセス更新
            // Bloom減衰
            let currentTargetBloom = targetBloom;
            if (currentMode === MODES.ATTACK_CANNON || currentMode === MODES.DRILL || currentMode === MODES.BURST) {
                currentTargetBloom = 2.5 + beatPulse * 2.0; // 攻撃中はビートで強く光る
            } else {
                currentTargetBloom = 1.2 + beatPulse * 0.5;
            }
            bloomPass.strength = THREE.MathUtils.lerp(bloomPass.strength, currentTargetBloom, 0.1);
            targetBloom = THREE.MathUtils.lerp(targetBloom, 1.0, 0.05);

            // CRT & Glitch更新
            crtPass.uniforms["time"].value = time;
            currentGlitch = THREE.MathUtils.lerp(currentGlitch, targetGlitch, 0.2);
            targetGlitch = THREE.MathUtils.lerp(targetGlitch, 0, 0.05); // すぐ落ち着く
            
            // 攻撃中は常に少しグリッチ
            let activeGlitch = currentGlitch;
            if(currentMode === MODES.BURST) activeGlitch += 0.5;
            if(currentMode === MODES.ATTACK_CANNON) activeGlitch += 0.2;
            crtPass.uniforms["glitchIntensity"].value = activeGlitch;
            crtPass.uniforms["rgbShift"].value = 0.005 + activeGlitch * 0.02;

            // Render
            composer.render();
        }

        // --- Interaction ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            crtPass.uniforms["resolution"].value.set(window.innerWidth, window.innerHeight);
        });

        // クリックで強制変形 & フルスクリーン
        window.addEventListener('click', () => {
            modeTimer = 0; // タイマーリセット
            changeMode();
            
            if (!document.fullscreenElement) {
                document.body.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            }
        });

        // Start
        changeMode();
        animate();

    </script>
</body>
</html>
