<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字パーティクル・シミュレーション</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505; /* 深い暗闇の背景 */
            font-family: 'Yu Gothic', 'Meiryo', sans-serif;
        }
        #ui-container {
            position: absolute;
            top: 15px;
            left: 20px;
            color: rgba(255, 255, 255, 0.8);
            pointer-events: none;
            text-shadow: 0 0 8px #000;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: #00ffff;
        }
        p {
            margin: 0;
            font-size: 0.9rem;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 1.5rem;
            pointer-events: none;
        }
    </style>
    <!-- Import maps を使用して three.js と OrbitControls を読み込む -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui-container">
        <h1>森と川の文字絵巻</h1>
        <p>マウスドラッグ: 視点回転 / スクロール: ズーム</p>
    </div>
    <div id="loading">構築中...</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;

        // パーティクルシステムとアニメーション用の配列
        let waterPoints, windPoints;
        const waterInitData = [];
        const windInitData = [];

        // 川の蛇行の周期（Z軸100の長さでぴったり1周するように設定し、ループを滑らかにする）
        const riverFreq = (Math.PI * 2) / 100; 

        init();
        animate();

        function init() {
            // 1. シーンとカメラのセットアップ
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050505, 0.015); // 奥を暗闇に溶け込ませるフォグ

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 25, 45);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05; // 地面の下に行かないようにする

            // 2. 文字テクスチャの生成
            const texWater = createTextTexture('水', '#00FFFF', true); // シアン、発光あり
            const texLand  = createTextTexture('土', '#8B7355', false); // 茶色
            const texTrunk = createTextTexture('木', '#A0522D', false); // 幹の色
            const texLeaf  = createTextTexture('葉', '#32CD32', true);  // 緑
            const texWind  = createTextTexture('風', '#E0FFFF', true);  // 白/水色

            // 3. ジオメトリデータの準備
            const landPos = [], trunkPos = [], leafPos = [], waterPos = [], windPos = [];

            // 地形の起伏を計算する関数
            function getElevation(x, z) {
                // 基本のうねり（山と谷）
                let y = Math.sin(x * 0.08) * Math.cos(z * 0.08) * 6;
                y += Math.sin(x * 0.15 + z * 0.1) * 1.5;
                
                // 川の浸食（谷底を作る）
                let riverX = Math.sin(z * riverFreq) * 10;
                let distToRiver = Math.abs(x - riverX);
                if (distToRiver < 15) {
                    let depth = (15 - distToRiver) * 0.7; // 川の中心ほど深く削る
                    y -= depth;
                }
                return y;
            }

            // --- 陸地と木の生成 ---
            for (let x = -50; x <= 50; x += 1.2) {
                for (let z = -50; z <= 50; z += 1.2) {
                    // 少し位置をランダムにずらして自然な配置にする
                    let px = x + (Math.random() - 0.5) * 0.6;
                    let pz = z + (Math.random() - 0.5) * 0.6;
                    let py = getElevation(px, pz);

                    // 陸地パーティクルを追加
                    landPos.push(px, py, pz);

                    // 条件を満たせば木を生やす（川底ではなく、ある程度の高さがある場所）
                    if (py > 0 && Math.random() < 0.025) {
                        // 幹（木）の生成
                        let height = 3 + Math.floor(Math.random() * 3);
                        for (let ty = 0; ty < height; ty++) {
                            trunkPos.push(px, py + ty, pz);
                        }
                        
                        // 葉の生成（球状に配置）
                        let canopyRadius = 1.8 + Math.random() * 1.5;
                        let canopyCenterY = py + height;
                        for (let lx = -canopyRadius; lx <= canopyRadius; lx += 0.8) {
                            for (let ly = -canopyRadius; ly <= canopyRadius; ly += 0.8) {
                                for (let lz = -canopyRadius; lz <= canopyRadius; lz += 0.8) {
                                    if (lx*lx + ly*ly + lz*lz <= canopyRadius*canopyRadius) {
                                        // 葉の間引いて配置
                                        if (Math.random() > 0.3) {
                                            leafPos.push(
                                                px + lx + (Math.random()-0.5)*0.5, 
                                                canopyCenterY + ly + (Math.random()-0.5)*0.5, 
                                                pz + lz + (Math.random()-0.5)*0.5
                                            );
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }

            // --- 水の生成 ---
            let waterCount = 0;
            const targetWaterCount = 12000; // 水のパーティクル数
            while(waterCount < targetWaterCount) {
                let wz = (Math.random() - 0.5) * 100;
                let riverX = Math.sin(wz * riverFreq) * 10;
                // 川の幅に散らす
                let offsetX = (Math.random() - 0.5) * 26;
                let wx = riverX + offsetX;
                let bedY = getElevation(wx, wz);
                
                let surfaceY = -2; // 水面の高さ設定
                
                // 地形が水面より低い場所にのみ水を配置
                if (bedY < surfaceY) {
                    // 水底から水面までの間でランダムな高さを決定
                    let wy = bedY + Math.random() * (surfaceY - bedY);
                    waterPos.push(wx, wy, wz);
                    
                    // アニメーション用の初期状態を保存
                    waterInitData.push({
                        offsetX: offsetX,
                        baseY: wy,
                        speed: Math.random() * 0.15 + 0.05,  // 流れる速さ
                        wavePhase: Math.random() * Math.PI * 2 // 波の上下運動の位相
                    });
                    waterCount++;
                }
            }

            // --- 風の生成 ---
            for (let i = 0; i < 400; i++) {
                windPos.push(
                    (Math.random() - 0.5) * 100,
                    Math.random() * 25 + 10, // 上空に配置
                    (Math.random() - 0.5) * 100
                );
                windInitData.push({
                    speedX: Math.random() * 0.4 + 0.2, // X方向への強い風
                    speedZ: (Math.random() - 0.5) * 0.1, // Z方向の揺らぎ
                    bobPhase: Math.random() * Math.PI * 2
                });
            }

            // 4. パーティクル・オブジェクトの構築
            createParticleSystem(landPos, texLand, 1.8, false, scene);
            createParticleSystem(trunkPos, texTrunk, 2.0, false, scene);
            createParticleSystem(leafPos, texLeaf, 2.2, false, scene);
            waterPoints = createParticleSystem(waterPos, texWater, 1.5, true, scene);
            windPoints = createParticleSystem(windPos, texWind, 2.5, true, scene);

            // ロード文字を消す
            document.getElementById('loading').style.display = 'none';

            // リサイズイベント
            window.addEventListener('resize', onWindowResize, false);
        }

        // --- ユーティリティ関数 ---

        // 文字からCanvas経由でテクスチャを作成する関数
        function createTextTexture(text, color, glowing) {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            ctx.clearRect(0, 0, 64, 64);
            ctx.fillStyle = color;
            ctx.font = 'bold 44px "Yu Gothic", "Meiryo", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // 発光エフェクト（水や風などに適用）
            if (glowing) {
                ctx.shadowColor = color;
                ctx.shadowBlur = 12;
            }
            
            ctx.fillText(text, 32, 32);
            
            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        // パーティクルシステムを作成・追加する関数
        function createParticleSystem(positions, texture, size, isAdditive, targetScene) {
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

            const material = new THREE.PointsMaterial({
                size: size,
                map: texture,
                transparent: true,
                alphaTest: 0.1, // 透明部分を完全に抜く
                depthWrite: false, // パーティクル同士の前後関係の透過を綺麗にする
                blending: isAdditive ? THREE.AdditiveBlending : THREE.NormalBlending
            });

            const points = new THREE.Points(geometry, material);
            targetScene.add(points);
            return points;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- アニメーションループ ---
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now() * 0.001; // 経過時間(秒)

            // 水のアニメーション（川に沿って流れ、波打つ）
            if (waterPoints) {
                const wPosArray = waterPoints.geometry.attributes.position.array;
                for (let i = 0; i < waterInitData.length; i++) {
                    let idx = i * 3;
                    
                    // Z軸方向に流す
                    wPosArray[idx + 2] -= waterInitData[i].speed; 
                    
                    // 領域外に出たら反対側へループさせる
                    if (wPosArray[idx + 2] < -50) {
                        wPosArray[idx + 2] = 50;
                    }

                    // 現在のZ位置に基づいて、川の曲がり具合（X位置）を再計算
                    let currentZ = wPosArray[idx + 2];
                    let riverX = Math.sin(currentZ * riverFreq) * 10;
                    
                    wPosArray[idx] = riverX + waterInitData[i].offsetX; // Xの更新
                    wPosArray[idx + 1] = waterInitData[i].baseY + Math.sin(time * 3 + waterInitData[i].wavePhase) * 0.15; // Yの更新（波）
                }
                waterPoints.geometry.attributes.position.needsUpdate = true;
            }

            // 風のアニメーション
            if (windPoints) {
                const wPosArray = windPoints.geometry.attributes.position.array;
                for (let i = 0; i < windInitData.length; i++) {
                    let idx = i * 3;
                    
                    wPosArray[idx] += windInitData[i].speedX; // 右へ移動
                    wPosArray[idx + 2] += windInitData[i].speedZ; // Z方向への微小な揺れ
                    wPosArray[idx + 1] += Math.sin(time * 4 + windInitData[i].bobPhase) * 0.05; // 上下運動

                    // 画面外に出たらリセット
                    if (wPosArray[idx] > 50) wPosArray[idx] = -50;
                    if (wPosArray[idx + 2] > 50) wPosArray[idx + 2] = -50;
                    if (wPosArray[idx + 2] < -50) wPosArray[idx + 2] = 50;
                }
                windPoints.geometry.attributes.position.needsUpdate = true;
            }

            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
