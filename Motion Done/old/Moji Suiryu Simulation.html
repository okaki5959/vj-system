<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Water Flow Simulation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #030508;
            font-family: sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: rgba(255, 255, 255, 0.7);
            pointer-events: none;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div id="info">
        <strong>文字の水流シミュレーション</strong><br>
        ドラッグで視点移動 / スクロールでズーム
    </div>

    <!-- Three.js本体とOrbitControlsの読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- 1. 文字テクスチャの生成 ---
        // 4x4のグリッドに16種類の文字を描画し、テクスチャとして使用する
        function createTextTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // 背景は透明
            ctx.clearRect(0, 0, 512, 512);
            
            // 白文字で描画（後でシェーダーで色を付ける）
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 80px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // 水に関連する16文字
            const chars = ['水','流','滴','波','海','泡','清','冷','潤','氷','雨','河','川','飛','沫','洋'];
            
            for (let i = 0; i < 16; i++) {
                const col = i % 4;
                const row = Math.floor(i / 4);
                const x = col * 128 + 64;
                const y = row * 128 + 64;
                ctx.fillText(chars[i], x, y);
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.flipY = false; // シェーダーでのUV計算を簡単にするため
            texture.minFilter = THREE.LinearFilter;
            return texture;
        }

        // --- 2. シーン・カメラ・レンダラーの設定 ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030508, 0.005); // 奥行きを出すためのフォグ

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
        camera.position.set(0, 40, 100);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 15, 0);

        // --- 3. 環境のセットアップ ---
        // 衝突用の岩（中心の球体）
        const sphereRadius = 15;
        const sphereCenter = new THREE.Vector3(0, 15, 0);
        const sphereGeo = new THREE.SphereGeometry(sphereRadius, 32, 32);
        const sphereMat = new THREE.MeshStandardMaterial({ 
            color: 0x111115, 
            roughness: 0.3, 
            metalness: 0.8 
        });
        const sphere = new THREE.Mesh(sphereGeo, sphereMat);
        sphere.position.copy(sphereCenter);
        scene.add(sphere);

        // 床のグリッド
        const gridHelper = new THREE.GridHelper(100, 20, 0x0044ff, 0x001133);
        gridHelper.position.y = 0;
        scene.add(gridHelper);

        // ライト
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xaaccff, 1);
        dirLight.position.set(20, 50, 20);
        scene.add(dirLight);

        // --- 4. パーティクル（水流）のセットアップ ---
        const particleCount = 5000; // パーティクルの数
        const geometry = new THREE.BufferGeometry();

        // 属性用の配列
        const positions = new Float32Array(particleCount * 3);
        const velocities = new Float32Array(particleCount * 3);
        const charIndices = new Float32Array(particleCount);
        const lifetimes = new Float32Array(particleCount);

        function resetParticle(i) {
            // エミッター（湧き出し口）の位置
            positions[i * 3] = (Math.random() - 0.5) * 10;
            positions[i * 3 + 1] = 45 + Math.random() * 5;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 10;

            // 初期速度（少し上向きに散らす）
            velocities[i * 3] = (Math.random() - 0.5) * 10;
            velocities[i * 3 + 1] = 2 + Math.random() * 5;
            velocities[i * 3 + 2] = (Math.random() - 0.5) * 10;

            // 0〜15のランダムな文字インデックス
            charIndices[i] = Math.floor(Math.random() * 16);
            lifetimes[i] = 0.0;
        }

        // 初期化
        for (let i = 0; i < particleCount; i++) {
            resetParticle(i);
            // 最初からバラバラになるようにライフタイムをずらす
            lifetimes[i] = Math.random(); 
            // ライフタイムに合わせて位置も少し下げておく（初期の塊感をなくす）
            positions[i * 3 + 1] -= lifetimes[i] * 40;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('charIndex', new THREE.BufferAttribute(charIndices, 1));
        geometry.setAttribute('lifetime', new THREE.BufferAttribute(lifetimes, 1));

        // カスタムシェーダーマテリアル
        const material = new THREE.ShaderMaterial({
            uniforms: {
                uTexture: { value: createTextTexture() },
                uColor: { value: new THREE.Color(0x00aaff) }, // 水色
                uPixelRatio: { value: window.devicePixelRatio }
            },
            vertexShader: `
                attribute float charIndex;
                attribute float lifetime;
                varying float vCharIndex;
                varying float vAlpha;
                uniform float uPixelRatio;
                
                void main() {
                    vCharIndex = charIndex;
                    // 生まれたてと消滅前にフェードアウトさせる
                    vAlpha = smoothstep(0.0, 0.1, lifetime) * smoothstep(1.0, 0.8, lifetime);
                    
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                    // 遠くの文字ほど小さくする
                    gl_PointSize = 30.0 * uPixelRatio * (100.0 / -mvPosition.z);
                }
            `,
            fragmentShader: `
                uniform sampler2D uTexture;
                uniform vec3 uColor;
                varying float vCharIndex;
                varying float vAlpha;
                
                void main() {
                    // 4x4グリッドのどの文字を使うか計算
                    float col = mod(vCharIndex, 4.0);
                    float row = floor(vCharIndex / 4.0);
                    
                    vec2 uv = gl_PointCoord;
                    uv.x = (uv.x + col) / 4.0;
                    uv.y = (uv.y + row) / 4.0;
                    
                    vec4 texColor = texture2D(uTexture, uv);
                    
                    // 文字の透明部分を破棄
                    if (texColor.a < 0.1) discard;
                    
                    // 色を付けて描画
                    gl_FragColor = vec4(uColor, texColor.a * vAlpha);
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.NormalBlending // 白飛びを防ぐため通常合成に変更
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        // --- 5. アニメーションと物理演算ループ ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const dt = Math.min(clock.getDelta(), 0.1); // 最大dtを制限して破綻を防ぐ
            
            const posAttr = geometry.attributes.position;
            const lifeAttr = geometry.attributes.lifetime;
            
            const pos = posAttr.array;
            const life = lifeAttr.array;

            // 物理シミュレーション（簡易）
            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                
                let px = pos[i3];
                let py = pos[i3 + 1];
                let pz = pos[i3 + 2];
                
                let vx = velocities[i3];
                let vy = velocities[i3 + 1];
                let vz = velocities[i3 + 2];
                
                // 重力
                vy -= 40.0 * dt; 
                
                // 空気抵抗・ノイズ（流体っぽい揺らぎ）
                vx += Math.sin(py * 0.5 + px) * 0.2 * dt;
                vz += Math.cos(py * 0.5 + pz) * 0.2 * dt;
                
                // 位置の更新
                px += vx * dt;
                py += vy * dt;
                pz += vz * dt;
                
                // --- 衝突判定：中心の球体 ---
                let dx = px - sphereCenter.x;
                let dy = py - sphereCenter.y;
                let dz = pz - sphereCenter.z;
                let distSq = dx*dx + dy*dy + dz*dz;
                const rSq = sphereRadius * sphereRadius;
                
                if (distSq < rSq) {
                    const dist = Math.sqrt(distSq);
                    const nx = dx / dist;
                    const ny = dy / dist;
                    const nz = dz / dist;
                    
                    // 外に押し出す
                    px = sphereCenter.x + nx * (sphereRadius + 0.1);
                    py = sphereCenter.y + ny * (sphereRadius + 0.1);
                    pz = sphereCenter.z + nz * (sphereRadius + 0.1);
                    
                    // 速度を球の法線で反射（少し滑らせる）
                    const dot = vx*nx + vy*ny + vz*nz;
                    vx -= 1.2 * dot * nx;
                    vy -= 1.2 * dot * ny;
                    vz -= 1.2 * dot * nz;
                    
                    // 岩の摩擦
                    vx *= 0.95;
                    vy *= 0.95;
                    vz *= 0.95;
                }
                
                // --- 衝突判定：床 ---
                if (py < 0) {
                    py = 0;
                    vy *= -0.3; // 床で少しバウンド
                    
                    // 床に落ちたら波紋のように外側に広がる力を加える
                    const distToCenter = Math.sqrt(px*px + pz*pz);
                    if (distToCenter > 0) {
                        vx += (px / distToCenter) * 0.5;
                        vz += (pz / distToCenter) * 0.5;
                    }
                    
                    // 床の摩擦
                    vx *= 0.9;
                    vz *= 0.9;
                }
                
                // 配列に書き戻す
                pos[i3] = px;
                pos[i3 + 1] = py;
                pos[i3 + 2] = pz;
                
                velocities[i3] = vx;
                velocities[i3 + 1] = vy;
                velocities[i3 + 2] = vz;
                
                // ライフタイムの更新（古いものはリセット）
                life[i] += dt * 0.25; // 約4秒で消滅
                if (life[i] >= 1.0) {
                    resetParticle(i);
                }
            }
            
            posAttr.needsUpdate = true;
            lifeAttr.needsUpdate = true;

            controls.update();
            renderer.render(scene, camera);
        }

        // ウィンドウリサイズ対応
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            material.uniforms.uPixelRatio.value = window.devicePixelRatio;
        });

        // アニメーション開始
        animate();
    </script>
</body>
</html>
