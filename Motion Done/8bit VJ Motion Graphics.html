<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8-bit Geometric VJ</title>
    <!-- p5.jsのライブラリを読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            overflow: hidden; /* スクロールバーを隠す */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: monospace;
        }
        /* キャンバスを拡大した際にぼやけずドット絵のように表示するための設定 */
        canvas {
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }
        #overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
            text-shadow: 2px 2px 0 #000;
        }
    </style>
</head>
<body>
    <div id="overlay">
        <h2 style="margin: 0; color: #0ff;">REC [■]</h2>
        <p id="bpm-display" style="color: #f0f;">BPM: 128</p>
    </div>

    <script>
        // URLパラメータでシーン固定
        const _urlParams = new URLSearchParams(window.location.search);
        const _lockedScene = _urlParams.has('scene') ? parseInt(_urlParams.get('scene')) : -1;

        // 8bit感を出すための低解像度設定
        const RES_W = 320;
        const RES_H = 180; 
        
        let pg; // オフスクリーンバッファ（ここで描画を行う）
        let palette;
        
        function setup() {
            // 実際の画面サイズに合わせてキャンバスを作成
            createCanvas(windowWidth, windowHeight);
            
            // 低解像度のグラフィックバッファを作成
            pg = createGraphics(RES_W, RES_H);
            
            // ピクセルをくっきり見せるための設定
            noSmooth();
            pg.noSmooth();
            
            // 8bit/レトロアーケード風のカラーパレット
            palette = [
                color(0, 255, 255),   // シアン
                color(255, 0, 255),   // マゼンタ
                color(255, 255, 0),   // イエロー
                color(0, 255, 0),     // ライムグリーン
                color(255, 50, 50)    // レッド
            ];
            
            // 昔のゲーム機を意識してフレームレートを少し落とす（オプション）
            frameRate(30); 
        }

        function draw() {
            background(0);
            
            // バッファの背景を半透明の黒にして残像（トレイル）エフェクトを作る
            pg.background(0, 50);
            
            // 時間経過（フレーム数）によるシーンの切り替え（約5秒ごと）
            let sceneTimer = _lockedScene >= 0 ? _lockedScene : floor(frameCount / 150) % 3;
            
            pg.push();
            // 原点を画面中央に移動
            pg.translate(pg.width / 2, pg.height / 2);
            
            switch(sceneTimer) {
                case 0:
                    drawTunnelScene();
                    break;
                case 1:
                    drawWaveGridScene();
                    break;
                case 2:
                    drawKaleidoscopeScene();
                    break;
            }
            pg.pop();
            
            // ブラウン管（CRT）風のスキャンライン効果を追加
            drawScanlines();

            // UIテキストの描画（バッファ内に描くことでドット化させる）
            drawRetroText();

            // --------------------------------------------------
            // バッファをメインキャンバスに拡大して描画
            // --------------------------------------------------
            // アスペクト比を維持しつつ最大化するスケールを計算
            let scaleFactor = min(width / RES_W, height / RES_H);
            let drawW = RES_W * scaleFactor;
            let drawH = RES_H * scaleFactor;
            let drawX = (width - drawW) / 2;
            let drawY = (height - drawH) / 2;
            
            image(pg, drawX, drawY, drawW, drawH);
        }

        // ==========================================
        // シーン1: 幾何学トンネル
        // ==========================================
        function drawTunnelScene() {
            let t = frameCount * 0.05;
            pg.rectMode(CENTER);
            pg.noFill();
            
            for (let i = 20; i > 0; i--) {
                let size = (i * 20 + (frameCount * 5) % 20);
                let col = palette[i % palette.length];
                
                pg.stroke(col);
                pg.strokeWeight(2);
                
                pg.push();
                // 奥行きに合わせて回転させる
                pg.rotate(t + i * 0.1);
                // 交互に四角形と円を描画
                if (i % 2 === 0) {
                    pg.rect(0, 0, size, size);
                } else {
                    // ドット感を強調するため、あえて荒い多角形で円を表現
                    pg.circle(0, 0, size); 
                }
                pg.pop();
            }
        }

        // ==========================================
        // シーン2: ウェーブするドットグリッド
        // ==========================================
        function drawWaveGridScene() {
            let t = frameCount * 0.1;
            pg.noStroke();
            
            let cols = 16;
            let rows = 9;
            let spacingX = pg.width / cols;
            let spacingY = pg.height / rows;
            
            // 中央を原点としているため左上から開始するよう補正
            pg.translate(-pg.width/2 + spacingX/2, -pg.height/2 + spacingY/2);
            
            for (let x = 0; x < cols; x++) {
                for (let y = 0; y < rows; y++) {
                    // サイン波を使って波打つような動きを計算
                    let wave = sin(t + x * 0.5 + y * 0.5);
                    let size = map(wave, -1, 1, 2, spacingX * 0.8);
                    
                    let colIndex = floor(map(wave, -1, 1, 0, palette.length - 1));
                    pg.fill(palette[colIndex]);
                    
                    // 幾何学的な十字の動き
                    pg.push();
                    pg.translate(x * spacingX, y * spacingY);
                    pg.rotate(wave * PI);
                    pg.rectMode(CENTER);
                    pg.rect(0, 0, size, size);
                    // 中心に小さなドット
                    pg.fill(0);
                    pg.rect(0, 0, size/2, size/2);
                    pg.pop();
                }
            }
        }

        // ==========================================
        // シーン3: 万華鏡（カレイドスコープ）ポリゴン
        // ==========================================
        function drawKaleidoscopeScene() {
            let t = frameCount * 0.02;
            let sides = 6; // 六角形ベース
            
            pg.noFill();
            pg.strokeWeight(1);
            
            // blendModeを加算にしてネオンのように光らせる
            pg.blendMode(ADD);
            
            for(let j = 0; j < 3; j++) {
                pg.push();
                pg.rotate(t * (j%2===0 ? 1 : -1) + j);
                pg.stroke(palette[j % palette.length]);
                
                for (let i = 0; i < 15; i++) {
                    let r = i * 8 + (sin(t*5)*20);
                    drawPolygon(0, 0, r, sides);
                    // 内側に幾何学的な線を描画
                    pg.line(0, 0, r, 0);
                    pg.rotate(TWO_PI / (sides * 2));
                }
                pg.pop();
            }
            // 描画モードを元に戻す
            pg.blendMode(BLEND);
        }

        // 多角形を描画するヘルパー関数
        function drawPolygon(x, y, radius, npoints) {
            let angle = TWO_PI / npoints;
            pg.beginShape();
            for (let a = 0; a < TWO_PI; a += angle) {
                let sx = x + cos(a) * radius;
                let sy = y + sin(a) * radius;
                pg.vertex(sx, sy);
            }
            pg.endShape(CLOSE);
        }

        // ==========================================
        // スキャンライン（ブラウン管エフェクト）
        // ==========================================
        function drawScanlines() {
            pg.stroke(0, 0, 0, 100);
            pg.strokeWeight(1);
            for (let y = 0; y < pg.height; y += 2) {
                pg.line(0, y, pg.width, y);
            }
        }

        // ==========================================
        // バッファに描くレトロテキスト
        // ==========================================
        function drawRetroText() {
            pg.fill(255);
            pg.noStroke();
            pg.textAlign(RIGHT, BOTTOM);
            pg.textSize(8); // 小さい文字を描いて拡大することでドット字にする
            // フレームカウントから適当に数値を生成してサイバー感を演出
            pg.text("DATA: " + hex(frameCount, 4) + " / SYS.OK", pg.width - 5, pg.height - 5);
        }

        // ウィンドウのサイズが変更されたときにキャンバスをリサイズ
        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
