<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAMIEL VJ SYSTEM - PATTERN BLUE</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Arial Black', Impact, sans-serif;
            color: #fff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* EVA風のフラッシュテキスト演出 */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            mix-blend-mode: exclusion;
        }
        .text-flash {
            font-size: 8vw;
            font-weight: 900;
            color: #ff003c;
            text-transform: uppercase;
            letter-spacing: 0.5em;
            opacity: 0;
            transform: scale(1.5);
            transition: opacity 0.1s, transform 0.1s;
        }
        .text-flash.active {
            opacity: 1;
            transform: scale(1);
        }
        .scanlines-overlay {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            z-index: 5;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="scanlines-overlay"></div>
    <div id="ui-layer">
        <div id="alert-text" class="text-flash">EMERGENCY</div>
    </div>

    <!-- Three.js & PostProcessing Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>

    <script>
        // ==========================================
        // VJ System Variables & Setup
        // ==========================================
        let scene, camera, renderer, composer;
        let mainGroup, core, wireCore;
        let spikeX, spikeY, spikeZ;
        let shieldBits = [];
        
        // URLパラメータでステート固定
        const _urlParams = new URLSearchParams(window.location.search);
        const _stateNames = ['IDLE', 'ATTACK_STAR', 'ATTACK_DRILL', 'DEFENSE'];
        const _lockedScene = _urlParams.has('scene') ? parseInt(_urlParams.get('scene')) : -1;

        let currentState = (_lockedScene >= 0 && _lockedScene < _stateNames.length) ? _stateNames[_lockedScene] : 'IDLE';
        let glitchIntensity = 0;
        let cameraShake = 0;
        let time = 0;

        // Colors
        const COLOR_IDLE = new THREE.Color(0x0044ff);
        const COLOR_ATTACK = new THREE.Color(0xff0033);
        const COLOR_DEFENSE = new THREE.Color(0x00ffff);
        let targetColor = COLOR_IDLE.clone();
        let currentColor = COLOR_IDLE.clone();

        // Target Transformations (Lerp targets)
        const target = {
            coreScale: new THREE.Vector3(1, 1, 1),
            spikeXScale: new THREE.Vector3(0.01, 0.01, 0.01),
            spikeYScale: new THREE.Vector3(0.01, 0.01, 0.01),
            spikeZScale: new THREE.Vector3(0.01, 0.01, 0.01),
            rotationSpeed: new THREE.Vector3(0.005, 0.01, 0),
            shieldScale: 0.01,
            shieldDistance: 0
        };

        const alertTexts = ["EMERGENCY", "PATTERN BLUE", "A.T. FIELD ACTIVE", "TARGET CONFIRMED", "WARNING"];
        const alertEl = document.getElementById('alert-text');

        function init() {
            // 1. Scene Setup
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.02);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 15;

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // 重すぎないように制限
            container.appendChild(renderer.domElement);

            // 2. Lights
            const ambientLight = new THREE.AmbientLight(0x111122);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 2, 50);
            scene.add(pointLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(5, 5, 5);
            scene.add(dirLight);

            // 3. Ramiel Geometry Generation
            mainGroup = new THREE.Group();
            scene.add(mainGroup);

            // 共通のベース形状（正八面体）
            const baseGeo = new THREE.OctahedronGeometry(3, 0);

            // マテリアル（発光するクリスタル風）
            const solidMat = new THREE.MeshStandardMaterial({
                color: 0x000000,
                emissive: currentColor,
                emissiveIntensity: 0.8,
                roughness: 0.1,
                metalness: 0.9,
                transparent: true,
                opacity: 0.9
            });

            const wireMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                wireframe: true,
                transparent: true,
                opacity: 0.3
            });

            // コア（中心）
            core = new THREE.Mesh(baseGeo, solidMat);
            wireCore = new THREE.Mesh(baseGeo, wireMat);
            wireCore.scale.set(1.02, 1.02, 1.02);
            core.add(wireCore);
            mainGroup.add(core);

            // 攻撃態勢用のスパイク（X, Y, Z軸）
            spikeX = createSpike(baseGeo, solidMat, wireMat);
            spikeY = createSpike(baseGeo, solidMat, wireMat);
            spikeZ = createSpike(baseGeo, solidMat, wireMat);
            mainGroup.add(spikeX, spikeY, spikeZ);

            // 防御態勢用のシールドビット（周囲に展開する小さな八面体）
            const bitGeo = new THREE.OctahedronGeometry(0.5, 0);
            for(let i=0; i<16; i++) {
                const bit = new THREE.Mesh(bitGeo, solidMat);
                const wBit = new THREE.Mesh(bitGeo, wireMat);
                wBit.scale.set(1.1, 1.1, 1.1);
                bit.add(wBit);
                
                const angle = (i / 16) * Math.PI * 2;
                bit.userData = { angle: angle }; // 配置計算用
                shieldBits.push(bit);
                mainGroup.add(bit);
            }

            // 4. Post-Processing (VJ / CRT Effects)
            setupPostProcessing();

            // 5. Events
            window.addEventListener('resize', onWindowResize);
            
            // 自動状態遷移（VJプレイ風に一定間隔で激しく切り替える）
            if (_lockedScene >= 0) {
                setState(_stateNames[_lockedScene]);
            } else {
                setInterval(triggerRandomState, 2000);
                triggerRandomState(); // 初回実行
            }
        }

        function createSpike(geo, solidMat, wireMat) {
            const spike = new THREE.Mesh(geo, solidMat);
            const wSpike = new THREE.Mesh(geo, wireMat);
            wSpike.scale.set(1.02, 1.02, 1.02);
            spike.add(wSpike);
            spike.scale.set(0.01, 0.01, 0.01); // 初期は見えない
            return spike;
        }

        // カスタムCRTシェーダー
        const CRTShader = {
            uniforms: {
                "tDiffuse": { value: null },
                "time": { value: 0.0 },
                "rgbShift": { value: 0.01 },
                "distortion": { value: 0.2 }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float time;
                uniform float rgbShift;
                uniform float distortion;
                varying vec2 vUv;

                // ノイズ生成
                float rand(vec2 co){ return fract(sin(dot(co.xy ,vec2(12.9898,78.233))) * 43758.5453); }

                void main() {
                    vec2 uv = vUv;
                    
                    // 1. ブラウン管の歪み（バレルディストーション）
                    vec2 cc = uv - 0.5;
                    float dist = dot(cc, cc);
                    uv = uv + cc * dist * distortion;

                    // 画面外は黒くする
                    if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) {
                        gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
                        return;
                    }

                    // 2. RGBシフト（色収差・グリッチ）
                    float shift = rgbShift;
                    // 横方向のランダムグリッチ
                    if(rand(vec2(time, uv.y)) > 0.98) {
                        shift *= 10.0;
                    }

                    vec4 cr = texture2D(tDiffuse, uv + vec2(shift, 0.0));
                    vec4 cg = texture2D(tDiffuse, uv);
                    vec4 cb = texture2D(tDiffuse, uv - vec2(shift, 0.0));
                    
                    vec4 color = vec4(cr.r, cg.g, cb.b, cg.a);

                    // 3. 走査線 (Scanlines)
                    float scanline = sin(uv.y * 800.0) * 0.04;
                    color.rgb -= scanline;

                    // 4. ホワイトノイズ
                    float noise = (rand(uv * time) - 0.5) * 0.1;
                    color.rgb += noise;

                    // 5. ヴィネット (画面四隅を暗く)
                    float vignette = uv.x * uv.y * (1.0 - uv.x) * (1.0 - uv.y);
                    vignette = clamp(pow(16.0 * vignette, 0.25), 0.0, 1.0);
                    color.rgb *= vignette;

                    gl_FragColor = color;
                }
            `
        };

        let crtPass;
        let bloomPass;

        function setupPostProcessing() {
            composer = new THREE.EffectComposer(renderer);
            
            const renderPass = new THREE.RenderPass(scene, camera);
            composer.addPass(renderPass);

            // ブルーム効果（激しい発光）
            bloomPass = new THREE.UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                2.5,  // strength
                0.5,  // radius
                0.2   // threshold
            );
            composer.addPass(bloomPass);

            // CRT & グリッチ効果
            crtPass = new THREE.ShaderPass(CRTShader);
            composer.addPass(crtPass);
        }

        // ==========================================
        // 状態遷移ロジック (State Machine)
        // ==========================================
        function triggerRandomState() {
            const states = ['IDLE', 'ATTACK_STAR', 'ATTACK_DRILL', 'DEFENSE'];
            // 前の状態と違うものを選ぶ
            let newState = states[Math.floor(Math.random() * states.length)];
            while(newState === currentState) {
                newState = states[Math.floor(Math.random() * states.length)];
            }
            
            setState(newState);
            
            // 状態遷移時の強烈なエフェクト
            glitchIntensity = 1.0;
            cameraShake = 1.0;
            bloomPass.strength = 5.0; // 一瞬強く光る

            // 確率でUIテキストをフラッシュ
            if(Math.random() > 0.3) {
                alertEl.innerText = alertTexts[Math.floor(Math.random() * alertTexts.length)];
                alertEl.classList.add('active');
                setTimeout(() => alertEl.classList.remove('active'), 150 + Math.random()*200);
            }
        }

        function setState(state) {
            currentState = state;
            
            switch(state) {
                case 'IDLE':
                    targetColor = COLOR_IDLE;
                    target.coreScale.set(1, 1, 1);
                    target.spikeXScale.set(0.01, 0.01, 0.01);
                    target.spikeYScale.set(0.01, 0.01, 0.01);
                    target.spikeZScale.set(0.01, 0.01, 0.01);
                    target.rotationSpeed.set(0.005, 0.01, 0.002);
                    target.shieldScale = 0.01;
                    target.shieldDistance = 0;
                    break;
                    
                case 'ATTACK_STAR':
                    targetColor = COLOR_ATTACK;
                    target.coreScale.set(0.5, 0.5, 0.5);
                    target.spikeXScale.set(3, 0.2, 0.2); // X軸に伸びる
                    target.spikeYScale.set(0.2, 3, 0.2); // Y軸に伸びる
                    target.spikeZScale.set(0.2, 0.2, 3); // Z軸に伸びる
                    target.rotationSpeed.set(0.05, 0.05, 0.05); // 激しく回転
                    target.shieldScale = 0.01;
                    target.shieldDistance = 0;
                    break;

                case 'ATTACK_DRILL':
                    targetColor = COLOR_ATTACK;
                    target.coreScale.set(0.2, 0.2, 4); // 縦に長く
                    target.spikeXScale.set(0.01, 0.01, 0.01);
                    target.spikeYScale.set(0.01, 0.01, 0.01);
                    target.spikeZScale.set(0.01, 0.01, 0.01);
                    target.rotationSpeed.set(0, 0, 0.4); // Z軸ドリル回転
                    target.shieldScale = 0.01;
                    target.shieldDistance = 0;
                    // ドリル時はカメラを正面に向けるためにグループ全体を回転
                    mainGroup.rotation.x = Math.PI / 2;
                    break;

                case 'DEFENSE':
                    targetColor = COLOR_DEFENSE;
                    target.coreScale.set(2.5, 2.5, 0.1); // 平たく巨大化
                    target.spikeXScale.set(0.01, 0.01, 0.01);
                    target.spikeYScale.set(0.01, 0.01, 0.01);
                    target.spikeZScale.set(0.01, 0.01, 0.01);
                    target.rotationSpeed.set(0, 0, 0.02); // ゆっくり回転
                    target.shieldScale = 1.0;
                    target.shieldDistance = 8.0; // シールドビットを展開
                    mainGroup.rotation.set(0, 0, 0); // 回転リセット
                    break;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        // ==========================================
        // Animation Loop
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;

            // 1. 滑らかな補間 (Lerp) で激しい変形を表現
            const lerpFactor = 0.15; // 変化の鋭さ。高いほどパキッと変わる
            
            core.scale.lerp(target.coreScale, lerpFactor);
            spikeX.scale.lerp(target.spikeXScale, lerpFactor);
            spikeY.scale.lerp(target.spikeYScale, lerpFactor);
            spikeZ.scale.lerp(target.spikeZScale, lerpFactor);

            // 回転
            if(currentState !== 'ATTACK_DRILL' && currentState !== 'DEFENSE') {
                mainGroup.rotation.x += target.rotationSpeed.x;
                mainGroup.rotation.y += target.rotationSpeed.y;
            } else if (currentState === 'DEFENSE') {
                // 防御時は正面を向いてZ回転
                mainGroup.rotation.x = THREE.MathUtils.lerp(mainGroup.rotation.x, 0, lerpFactor);
                mainGroup.rotation.y = THREE.MathUtils.lerp(mainGroup.rotation.y, 0, lerpFactor);
                mainGroup.rotation.z += target.rotationSpeed.z;
            } else {
                // ドリル
                mainGroup.rotation.x = THREE.MathUtils.lerp(mainGroup.rotation.x, Math.PI / 2, lerpFactor);
                mainGroup.rotation.y = THREE.MathUtils.lerp(mainGroup.rotation.y, 0, lerpFactor);
                mainGroup.rotation.z += target.rotationSpeed.z;
            }

            // 色の遷移
            currentColor.lerp(targetColor, 0.1);
            core.material.emissive = currentColor;

            // シールドビットのアニメーション
            let currentShieldDist = shieldBits[0].position.length();
            let newDist = THREE.MathUtils.lerp(currentShieldDist, target.shieldDistance, lerpFactor);
            
            shieldBits.forEach((bit, i) => {
                bit.scale.setScalar(THREE.MathUtils.lerp(bit.scale.x, target.shieldScale, lerpFactor));
                
                // 円状に配置
                const angle = bit.userData.angle + time * 0.5;
                bit.position.set(
                    Math.cos(angle) * newDist,
                    Math.sin(angle) * newDist,
                    Math.sin(time * 2 + i) * 0.5 // Z軸に少し波打つ
                );
                
                // コアの方を向く
                bit.lookAt(core.position);
            });

            // 2. VJ Effects Update
            // カメラシェイク減衰
            cameraShake *= 0.85;
            if (cameraShake > 0.01) {
                camera.position.x = (Math.random() - 0.5) * cameraShake * 2;
                camera.position.y = (Math.random() - 0.5) * cameraShake * 2;
            } else {
                camera.position.x = 0;
                camera.position.y = 0;
            }

            // ブルーム減衰（フラッシュ後元に戻る）
            bloomPass.strength = THREE.MathUtils.lerp(bloomPass.strength, 2.0, 0.1);

            // CRTシェーダーの更新
            if (crtPass) {
                crtPass.uniforms.time.value = time;
                
                // グリッチの強さを減衰
                glitchIntensity *= 0.8;
                // 基本のRGBシフト + グリッチスパイク
                crtPass.uniforms.rgbShift.value = 0.005 + (glitchIntensity * 0.05); 
                
                // ドリル攻撃時などは常に画面を少し歪ませる
                if(currentState === 'ATTACK_DRILL') {
                    crtPass.uniforms.distortion.value = 0.4 + Math.sin(time * 20)*0.1;
                } else {
                    crtPass.uniforms.distortion.value = THREE.MathUtils.lerp(crtPass.uniforms.distortion.value, 0.2, 0.1);
                }
            }

            // 3. レンダリング
            composer.render();
        }

        // 初期化とアニメーションループの開始
        init();
        animate();
    </script>
</body>
</html>
