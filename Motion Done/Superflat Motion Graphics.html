<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Superflat Motion Graphics</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #ffffff; /* 真っ白の空間 */
            touch-action: none; /* スマホでのデフォルトスクロールを防止 */
        }
        canvas {
            display: block;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: sans-serif;
            font-weight: bold;
            color: #333;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
    </style>
    <!-- Three.jsとOrbitControlsを読み込むためのImport Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="loading">生成中...</div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --------------------------------------------------------
        // パステルカラーのパレット（村上隆風のポップな色合い）
        // --------------------------------------------------------
        const pastelColors = [
            '#FFB3BA', // ピンク
            '#FFDFBA', // オレンジ
            '#FFFFBA', // イエロー
            '#BAFFC9', // ミントグリーン
            '#BAE1FF', // ライトブルー
            '#E8BAFF'  // ラベンダー
        ];

        // --------------------------------------------------------
        // スーパーフラット風のテクスチャをCanvasで動的に生成する関数
        // --------------------------------------------------------
        function createFlowerTexture(bgColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const center = 256;

            // 背景を透明に
            ctx.clearRect(0, 0, 512, 512);

            // 花びらの描画 (黒い縁取りとパステルカラーの塗り)
            ctx.fillStyle = bgColor;
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 14;
            const petals = 12;
            for (let i = 0; i < petals; i++) {
                const angle = (i / petals) * Math.PI * 2;
                const x = center + Math.cos(angle) * 160;
                const y = center + Math.sin(angle) * 160;
                ctx.beginPath();
                ctx.arc(x, y, 75, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }

            // 顔のベース（白）
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(center, center, 130, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // 目
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.ellipse(center - 45, center - 30, 15, 25, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(center + 45, center - 30, 15, 25, 0, 0, Math.PI * 2);
            ctx.fill();

            // 笑顔の口
            ctx.beginPath();
            ctx.arc(center, center + 20, 70, 0.1, Math.PI - 0.1, false);
            ctx.lineWidth = 12;
            ctx.lineCap = 'round';
            ctx.stroke();

            // 頬のチーク（ほんのりピンク）
            ctx.fillStyle = 'rgba(255, 100, 150, 0.6)';
            ctx.beginPath(); ctx.arc(center - 80, center + 20, 20, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(center + 80, center + 20, 20, 0, Math.PI * 2); ctx.fill();

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        function createDotTexture(bgColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const center = 64;

            ctx.clearRect(0, 0, 128, 128);
            ctx.fillStyle = bgColor;
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.arc(center, center, 50, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            return new THREE.CanvasTexture(canvas);
        }

        // --------------------------------------------------------
        // Three.js 初期設定
        // --------------------------------------------------------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff); // 真っ白の空間

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1500);
        // カメラは巨大なサークルの外側から全体を見渡す位置に
        camera.position.set(0, 50, 400);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // スマホのパフォーマンス考慮
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // --------------------------------------------------------
        // オブジェクトの生成と配置（巨大なサークル）
        // --------------------------------------------------------
        const mainGroup = new THREE.Group();
        const flowerGroup = new THREE.Group();
        const dotGroup = new THREE.Group();
        mainGroup.add(flowerGroup);
        mainGroup.add(dotGroup);
        scene.add(mainGroup);

        const planeGeo = new THREE.PlaneGeometry(20, 20); // 平面的なオブジェクト用
        const dotGeo = new THREE.PlaneGeometry(8, 8);

        // 巨大なサークル（トーラス状）のパラメータ
        const circleRadius = 250; // 画面をはみ出す巨大な半径
        const tubeRadius = 80;    // サークルの太さ

        const dummy = new THREE.Object3D();

        // 1. お花オブジェクトの配置
        const flowersPerColor = 400; 
        pastelColors.forEach(color => {
            const tex = createFlowerTexture(color);
            // 陰影の影響を受けないMeshBasicMaterialを使用（スーパーフラット感）
            // alphaTestで透明部分を完全に切り抜き、Zソートの不具合を防止
            const mat = new THREE.MeshBasicMaterial({ 
                map: tex, 
                transparent: true, 
                alphaTest: 0.5, 
                side: THREE.DoubleSide 
            });
            const instancedMesh = new THREE.InstancedMesh(planeGeo, mat, flowersPerColor);

            for (let i = 0; i < flowersPerColor; i++) {
                // トーラス（ドーナツ）状の分布計算
                const u = Math.random() * Math.PI * 2;
                const v = Math.random() * Math.PI * 2;
                // 中心に偏らないよう平方根を使用
                const r = tubeRadius * Math.sqrt(Math.random()); 

                const x = (circleRadius + r * Math.cos(v)) * Math.cos(u);
                const y = r * Math.sin(v);
                const z = (circleRadius + r * Math.cos(v)) * Math.sin(u);

                dummy.position.set(x, y, z);
                // ランダムな回転（平面的に見せるためランダムに配置しつつも視点によって線に見えるように）
                dummy.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                dummy.scale.setScalar(Math.random() * 1.5 + 0.5);
                
                dummy.updateMatrix();
                instancedMesh.setMatrixAt(i, dummy.matrix);
            }
            flowerGroup.add(instancedMesh);
        });

        // 2. ドットオブジェクトの配置（空間を埋めるため）
        const dotsPerColor = 600;
        pastelColors.forEach(color => {
            const tex = createDotTexture(color);
            const mat = new THREE.MeshBasicMaterial({ 
                map: tex, 
                transparent: true, 
                alphaTest: 0.5, 
                side: THREE.DoubleSide 
            });
            const instancedMesh = new THREE.InstancedMesh(dotGeo, mat, dotsPerColor);

            for (let i = 0; i < dotsPerColor; i++) {
                const u = Math.random() * Math.PI * 2;
                const v = Math.random() * Math.PI * 2;
                const r = tubeRadius * 1.5 * Math.sqrt(Math.random()); // ドットは少し広めに散らす

                const x = (circleRadius + r * Math.cos(v)) * Math.cos(u);
                const y = r * Math.sin(v);
                const z = (circleRadius + r * Math.cos(v)) * Math.sin(u);

                dummy.position.set(x, y, z);
                dummy.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                dummy.scale.setScalar(Math.random() * 2.0 + 0.5);
                
                dummy.updateMatrix();
                instancedMesh.setMatrixAt(i, dummy.matrix);
            }
            dotGroup.add(instancedMesh);
        });

        // ロード画面を非表示に
        document.getElementById('loading').style.opacity = 0;

        // --------------------------------------------------------
        // アニメーションループ
        // --------------------------------------------------------
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();

            // モーショングラフィックス的な動きの演出
            // 巨大なサークル全体がゆっくりとうねりながら回転する
            flowerGroup.rotation.y = time * 0.05;
            flowerGroup.rotation.z = Math.sin(time * 0.1) * 0.1;

            // ドットは逆方向に少し早く回転し、パララックス効果（奥行き）を生み出す
            dotGroup.rotation.y = -time * 0.07;
            dotGroup.rotation.x = Math.cos(time * 0.1) * 0.1;

            // 全体がゆっくり呼吸するようにスケールを変える
            const scaleWave = 1.0 + Math.sin(time * 0.5) * 0.05;
            mainGroup.scale.set(scaleWave, scaleWave, scaleWave);

            controls.update();
            renderer.render(scene, camera);
        }

        // --------------------------------------------------------
        // ウィンドウリサイズ対応
        // --------------------------------------------------------
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 準備完了後、アニメーション開始
        window.onload = function() {
            animate();
        };

    </script>
</body>
</html>
