<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk City VJ</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* ブラウン管スキャンラインと画面のノイズエフェクト */
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 10;
        }
        /* サイバーなUIオーバーレイ */
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ffcc;
            pointer-events: none;
            text-shadow: 0 0 10px #00ffcc, 0 0 20px #00ffcc;
            z-index: 20;
            opacity: 0.8;
        }
        h1 { margin: 0; font-size: 24px; letter-spacing: 2px; }
        p { margin: 5px 0 0 0; font-size: 14px; line-height: 1.5; }
        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="scanlines"></div>
    <div id="ui-layer">
        <h1>SYS.TERMINAL // G.I.T.S. PROTOCOL</h1>
        <p>STATUS: <span class="blink">ACTIVE</span><br>MODE: ORBIT_AUTO_TRACKING<br>V-SYNC: ENGAGED<br>COORD: SECTOR-9</p>
    </div>

    <!-- Three.js & PostProcessing dependencies (r128) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>

    <script>
        // --- 1. 基本セットアップ ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        // 深い緑がかった暗闇のフォグ（都市の空気感）
        scene.fog = new THREE.FogExp2(0x001111, 0.0035);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
        camera.position.set(0, 30, 120);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000505);
        container.appendChild(renderer.domElement);

        // OrbitControls (自動回転 + 手動操作)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.5; // カメラの旋回スピード
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1; // 見下げすぎないように制限
        controls.target.set(0, 40, 0);

        // --- 2. PostProcessing (Bloomエフェクト) ---
        const renderScene = new THREE.RenderPass(scene, camera);
        // 解像度, 強度, 半径, 閾値
        const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 2.0, 0.5, 0.2);
        
        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- 3. サイバー都市ビル群 (InstancedMesh & Custom Shader) ---
        // ビルのカスタムシェーダー
        const buildingVertexShader = `
            varying vec2 vUv;
            varying vec3 vWorldPosition;
            void main() {
                vUv = uv;
                vec4 worldPosition = modelMatrix * instanceMatrix * vec4(position, 1.0);
                vWorldPosition = worldPosition.xyz;
                gl_Position = projectionMatrix * viewMatrix * worldPosition;
            }
        `;

        const buildingFragmentShader = `
            uniform float time;
            uniform vec3 colorPrimary;
            uniform vec3 colorSecondary;
            varying vec2 vUv;
            varying vec3 vWorldPosition;

            // シンプルなノイズ関数
            float random(vec2 st) {
                return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
            }

            void main() {
                // ビルの暗いベース色
                vec3 baseColor = vec3(0.02, 0.04, 0.06);

                // 窓のようなグリッド模様
                vec2 grid = fract(vUv * vec2(10.0, 50.0));
                float isWindow = step(0.2, grid.x) * step(0.2, grid.y);

                // ビルごとの固有ID的な乱数（位置を使用）
                float bldgRandom = random(floor(vWorldPosition.xz / 5.0));
                
                // 窓ごとの乱数
                float windowNoise = random(floor(vUv * vec2(10.0, 50.0)) + bldgRandom);
                
                // VJライクな激しい明滅（ビートに合わせて光る）
                float beat = pow(sin(time * 10.0 + bldgRandom * 5.0), 8.0);
                float slowBlink = sin(time * 2.0 + windowNoise * 10.0) * 0.5 + 0.5;

                vec3 windowColor = vec3(0.0);
                if (isWindow > 0.0 && windowNoise > 0.6) {
                    // エメラルドグリーンとシアンブルーをランダムに割り当て
                    vec3 neonColor = mix(colorPrimary, colorSecondary, step(0.5, bldgRandom));
                    // 明滅を適用 (通常点滅 + ビートフラッシュ)
                    windowColor = neonColor * slowBlink * (1.0 + beat * 2.0);
                }

                // ビルのワイヤーフレーム風エッジ
                float edge = step(0.02, vUv.x) * step(vUv.x, 0.98) * step(0.01, vUv.y) * step(vUv.y, 0.99);
                vec3 edgeColor = vec3(0.0);
                if (edge == 0.0) {
                    edgeColor = colorPrimary * 0.2; // 薄く発光
                }

                // 下から上へ走るスキャンラインエフェクト
                float scanline = step(0.98, fract(vWorldPosition.y * 0.03 - time * 3.0));
                vec3 scanColor = colorSecondary * scanline * 1.5;

                vec3 finalColor = baseColor + windowColor + edgeColor + scanColor;
                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        const buildingMaterial = new THREE.ShaderMaterial({
            vertexShader: buildingVertexShader,
            fragmentShader: buildingFragmentShader,
            uniforms: {
                time: { value: 0.0 },
                colorPrimary: { value: new THREE.Color(0x00ffcc) },   // 攻殻グリーン
                colorSecondary: { value: new THREE.Color(0x0088ff) }  // サイバーブルー
            }
        });

        const buildingCount = 1500;
        const buildingGeometry = new THREE.BoxGeometry(1, 1, 1);
        buildingGeometry.translate(0, 0.5, 0); // 底面を原点に
        const buildings = new THREE.InstancedMesh(buildingGeometry, buildingMaterial, buildingCount);
        
        const dummy = new THREE.Object3D();
        for (let i = 0; i < buildingCount; i++) {
            // ランダムに配置
            const x = (Math.random() - 0.5) * 400;
            const z = (Math.random() - 0.5) * 400;
            
            // 中央付近は少し空間を空ける
            if (Math.abs(x) < 20 && Math.abs(z) < 20) continue;

            // 中心に近いほどビルを高くする
            const dist = Math.sqrt(x*x + z*z);
            const baseHeight = Math.random() * 40 + 10;
            const height = baseHeight * (1.0 + 100 / (dist + 10));

            dummy.position.set(x, 0, z);
            dummy.scale.set(Math.random() * 4 + 2, height, Math.random() * 4 + 2);
            dummy.updateMatrix();
            buildings.setMatrixAt(i, dummy.matrix);
        }
        scene.add(buildings);

        // --- 4. データトラフィック (飛び交う光の線) ---
        const trafficCount = 800;
        const trafficGeo = new THREE.BoxGeometry(0.5, 0.5, 8.0); // 細長い光
        const trafficMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const trafficMesh = new THREE.InstancedMesh(trafficGeo, trafficMat, trafficCount);
        scene.add(trafficMesh);

        const trafficData = [];
        const trafficColors = [0x00ffcc, 0xff00ff, 0xffaa00, 0x0088ff]; // 緑、マゼンタ、オレンジ、青
        const colorObj = new THREE.Color();

        for (let i = 0; i < trafficCount; i++) {
            let x = (Math.random() - 0.5) * 400;
            let y = Math.random() * 100 + 5;
            let z = (Math.random() - 0.5) * 400;
            let speed = Math.random() * 3 + 1.5;
            let axis = Math.random() > 0.5 ? 'x' : 'z'; // X軸方向かZ軸方向か
            let dir = Math.random() > 0.5 ? 1 : -1;
            
            trafficData.push({ x, y, z, speed, axis, dir });
            
            // 色の割り当て
            colorObj.setHex(trafficColors[Math.floor(Math.random() * trafficColors.length)]);
            trafficMesh.setColorAt(i, colorObj);
        }

        // --- 5. デジタルレイン (マトリックス風の降下パーティクル) ---
        const rainCount = 4000;
        const rainGeo = new THREE.BufferGeometry();
        const rainPos = new Float32Array(rainCount * 3);
        for(let i=0; i<rainCount; i++) {
            rainPos[i*3] = (Math.random() - 0.5) * 300;
            rainPos[i*3+1] = Math.random() * 200;
            rainPos[i*3+2] = (Math.random() - 0.5) * 300;
        }
        rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
        const rainMat = new THREE.PointsMaterial({
            color: 0x00ffcc,
            size: 0.8,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });
        const rain = new THREE.Points(rainGeo, rainMat);
        scene.add(rain);

        // --- 6. 巨大ホログラムリング (空中のオブジェ) ---
        const rings = new THREE.Group();
        const ringGeo1 = new THREE.TorusGeometry(80, 0.5, 8, 100);
        const ringMat1 = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true, transparent: true, opacity: 0.3 });
        const ring1 = new THREE.Mesh(ringGeo1, ringMat1);
        ring1.rotation.x = Math.PI / 2;
        rings.add(ring1);

        const ringGeo2 = new THREE.TorusGeometry(100, 1, 8, 60);
        const ringMat2 = new THREE.MeshBasicMaterial({ color: 0xff00ff, wireframe: true, transparent: true, opacity: 0.2 });
        const ring2 = new THREE.Mesh(ringGeo2, ringMat2);
        ring2.rotation.x = Math.PI / 2;
        rings.add(ring2);

        rings.position.y = 120;
        scene.add(rings);

        // --- 7. アニメーションループ ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();
            const delta = clock.getDelta();

            // シェーダーの時間を更新
            buildingMaterial.uniforms.time.value = time;

            // トラフィック（光の線）の移動
            for (let i = 0; i < trafficCount; i++) {
                let data = trafficData[i];
                if (data.axis === 'x') {
                    data.x += data.speed * data.dir;
                    if (data.x > 200) data.x = -200;
                    if (data.x < -200) data.x = 200;
                } else {
                    data.z += data.speed * data.dir;
                    if (data.z > 200) data.z = -200;
                    if (data.z < -200) data.z = 200;
                }
                dummy.position.set(data.x, data.y, data.z);
                if (data.axis === 'x') dummy.rotation.y = Math.PI / 2;
                else dummy.rotation.y = 0;
                dummy.updateMatrix();
                trafficMesh.setMatrixAt(i, dummy.matrix);
            }
            trafficMesh.instanceMatrix.needsUpdate = true;

            // デジタルレインの降下
            const positions = rain.geometry.attributes.position.array;
            for(let i=0; i<rainCount; i++) {
                positions[i*3+1] -= 1.0; // 下へ移動
                if(positions[i*3+1] < 0) {
                    positions[i*3+1] = 200; // 上に戻す
                }
            }
            rain.geometry.attributes.position.needsUpdate = true;

            // ホログラムリングの回転
            ring1.rotation.z -= 0.005;
            ring2.rotation.z += 0.003;
            // リング全体をゆっくり上下させる
            rings.position.y = 120 + Math.sin(time * 0.5) * 10;

            // カメラのダイナミックな自動アニメーション（OrbitControlsと併用）
            // 自動で空間の立体感を感じさせるために高さをゆっくり変える
            controls.target.y = 40 + Math.sin(time * 0.3) * 15;
            camera.position.y += Math.cos(time * 0.4) * 0.05;

            // VJライクな激しいエフェクト（ビートに合わせてBloomを強くする）
            const beat = Math.pow(Math.sin(time * 6.0), 16.0); // ドン！という鋭いビート
            bloomPass.strength = 1.5 + beat * 1.5;

            controls.update();
            composer.render();
        }

        // リサイズ対応
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        // 開始
        window.onload = () => {
            animate();
        };
    </script>
</body>
</html>
