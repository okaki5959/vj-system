<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mondrian Generative Tile Grid - Three.js</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            pointer-events: none;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }
        h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 2px;
            font-weight: 600;
        }
        p {
            margin: 5px 0 0 0;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>MONDRIAN GRID</h1>
        <p>Generative Motion Graphics with Three.js</p>
    </div>
    <div id="canvas-container"></div>

    <!-- Three.js の読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        window.onload = function() {
            // --- シーンのセットアップ ---
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color('#1a1a1a');

            // アイソメトリック（等角投影）のルックを作るためのOrthographicCamera
            const aspect = window.innerWidth / window.innerHeight;
            const frustumSize = 30; // 視界の広さ
            const camera = new THREE.OrthographicCamera(
                frustumSize * aspect / -2, 
                frustumSize * aspect / 2, 
                frustumSize / 2, 
                frustumSize / -2, 
                1, 
                1000
            );
            
            // カメラを斜め上に配置し、中心を向かせる
            camera.position.set(50, 50, 50);
            camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true; // シャドウを有効化
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // --- ライティング ---
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.left = -30;
            dirLight.shadow.camera.right = 30;
            dirLight.shadow.camera.top = 30;
            dirLight.shadow.camera.bottom = -30;
            scene.add(dirLight);

            // --- モンドリアンカラーパレットと配色ルール ---
            const colorWeights = [
                { color: 0xf4f4f4, weight: 100 }, // 白 (ベース)
                { color: 0xc72323, weight: 20 },  // 赤
                { color: 0x0d47a1, weight: 20 },  // 青
                { color: 0xfbc02d, weight: 20 },  // 黄
                { color: 0x222222, weight: 5 }    // 黒 (アクセント)
            ];

            // 2つのタイルが隣接しているか判定する関数
            function isAdjacent(t1, t2) {
                const epsilon = 0.01;
                const overlapX = Math.max(0, Math.min(t1.x + t1.w, t2.x + t2.w) - Math.max(t1.x, t2.x)) > epsilon;
                const overlapZ = Math.max(0, Math.min(t1.z + t1.d, t2.z + t2.d) - Math.max(t1.z, t2.z)) > epsilon;
                
                const touchX = Math.abs((t1.x + t1.w) - t2.x) < epsilon || Math.abs((t2.x + t2.w) - t1.x) < epsilon;
                const touchZ = Math.abs((t1.z + t1.d) - t2.z) < epsilon || Math.abs((t2.z + t2.d) - t1.z) < epsilon;

                return (touchX && overlapZ) || (touchZ && overlapX);
            }

            // 隣接するタイルの色を避けてランダムな色を取得する関数
            function getValidColor(tile, previousTiles) {
                const adjacentColors = new Set();
                for (const pt of previousTiles) {
                    if (isAdjacent(tile, pt)) {
                        adjacentColors.add(pt.color);
                    }
                }

                // 隣接する色を除外した候補を作成
                let available = colorWeights.filter(cw => !adjacentColors.has(cw.color));
                
                // もし周囲が全色で囲まれて候補がなくなった場合は制限を解除
                if (available.length === 0) {
                    available = colorWeights; 
                }

                // 重み付きランダムで色を決定
                let totalWeight = available.reduce((sum, cw) => sum + cw.weight, 0);
                let rand = Math.random() * totalWeight;
                for (const cw of available) {
                    rand -= cw.weight;
                    if (rand <= 0) return cw.color;
                }
                return available[0].color;
            }

            // --- ジェネレーティブ・グリッド生成 ---
            const tiles = [];
            const gridSize = 40; // グリッドの全体サイズ
            const maxDepth = 7;  // 分割の深さを少し増やす

            // 再帰的に空間を分割する関数 (BSPツリーアルゴリズム)
            function splitRect(x, z, w, d, depth) {
                // 面積が小さすぎる場合は強制的に分割終了
                if (w < 2 || d < 2) {
                    tiles.push({ x, z, w, d });
                    return;
                }

                // 辺の長さが一定以上の場合は強制的に分割を継続する
                const maxAllowedLength = 12; // これより大きい辺があれば必ず分割する
                const forceSplit = (w > maxAllowedLength || d > maxAllowedLength);

                // 最大深度に達したか、（強制分割でなく）ランダム確率で終了
                if (depth === 0 || (!forceSplit && Math.random() < 0.25)) {
                    tiles.push({ x, z, w, d });
                    return;
                }

                // 縦に割るか、横に割るかを決定 (極端な縦横比の場合は強制的に補正)
                let splitHorizontal = Math.random() > 0.5;
                if (w / d > 1.5) splitHorizontal = false; // 幅が広すぎる場合はX軸で分割
                else if (d / w > 1.5) splitHorizontal = true;  // 奥行きが深すぎる場合はZ軸で分割

                // 分割比率 (0.3 ～ 0.7 の間にして、大小の極端な差を和らげる)
                const ratio = 0.3 + Math.random() * 0.4;

                if (splitHorizontal) {
                    // Z軸方向（横）に分割
                    const splitD = d * ratio;
                    splitRect(x, z, w, splitD, depth - 1);
                    splitRect(x, z + splitD, w, d - splitD, depth - 1);
                } else {
                    // X軸方向（縦）に分割
                    const splitW = w * ratio;
                    splitRect(x, z, splitW, d, depth - 1);
                    splitRect(x + splitW, z, w - splitW, d, depth - 1);
                }
            }

            // 初期位置を中央に合わせて分割開始
            splitRect(-gridSize / 2, -gridSize / 2, gridSize, gridSize, maxDepth);

            // --- メッシュの生成 ---
            const blocks = [];
            const blockGroup = new THREE.Group();
            scene.add(blockGroup);

            // 黒い背景のベース平面（モンドリアンの黒い太線を表現）
            const baseGeo = new THREE.PlaneGeometry(gridSize + 1, gridSize + 1);
            const baseMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const basePlane = new THREE.Mesh(baseGeo, baseMat);
            basePlane.rotation.x = -Math.PI / 2;
            basePlane.position.y = -0.1;
            basePlane.receiveShadow = true;
            blockGroup.add(basePlane);

            const gap = 0.8; // タイル間の隙間（太くしてモンドリアンの線を強調）

            const coloredTiles = []; // 色情報を持たせたタイルリスト

            tiles.forEach(tile => {
                // ★ 隣接するブロックと被らないように色を決定 ★
                tile.color = getValidColor(tile, coloredTiles);
                coloredTiles.push(tile);

                // 隙間を引いて実際のブロックサイズを計算
                const blockW = Math.max(0.1, tile.w - gap);
                const blockD = Math.max(0.1, tile.d - gap);
                const baseHeight = 0.2 + Math.random() * 1.5; // 初期高さをランダムにして立体感を出す

                // ボックスジオメトリの原点を底面に移動（スケール時に下方向へ伸びないようにする）
                const geometry = new THREE.BoxGeometry(blockW, baseHeight, blockD);
                geometry.translate(0, baseHeight / 2, 0);

                const material = new THREE.MeshStandardMaterial({
                    color: tile.color,
                    roughness: 0.2,
                    metalness: 0.1
                });

                const mesh = new THREE.Mesh(geometry, material);
                
                // ブロックの配置
                mesh.position.set(
                    tile.x + tile.w / 2, 
                    0, 
                    tile.z + tile.d / 2
                );
                
                mesh.castShadow = true;
                mesh.receiveShadow = true;

                // アニメーション用の独自データを保存
                mesh.userData = {
                    originalY: mesh.position.y,
                    phaseOffset: Math.random() * Math.PI * 2, // 波の位相オフセット
                    speed: 0.5 + Math.random() * 1.5,
                    isHighlight: Math.random() > 0.8 // 一部のブロックだけ動きを大きくする
                };

                blockGroup.add(mesh);
                blocks.push(mesh);

                // エッジ（輪郭線）を追加してよりグラフィカルにする
                const edgesGeo = new THREE.EdgesGeometry(geometry);
                const edgesMat = new THREE.LineBasicMaterial({ color: 0x111111, linewidth: 2 });
                const edges = new THREE.LineSegments(edgesGeo, edgesMat);
                mesh.add(edges);
            });

            // マウスインタラクション用の設定
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2(-100, -100);
            const mouseWorldPos = new THREE.Vector3();

            window.addEventListener('mousemove', (event) => {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            });

            // リサイズ処理
            window.addEventListener('resize', () => {
                const aspect = window.innerWidth / window.innerHeight;
                camera.left = -frustumSize * aspect / 2;
                camera.right = frustumSize * aspect / 2;
                camera.top = frustumSize / 2;
                camera.bottom = -frustumSize / 2;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // --- アニメーションループ ---
            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);

                const time = clock.getElapsedTime();

                // マウス位置のワールド座標を取得（レイキャスト）
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(basePlane);
                if (intersects.length > 0) {
                    mouseWorldPos.copy(intersects[0].point);
                }

                // グループ全体をゆっくり回転
                blockGroup.rotation.y = Math.sin(time * 0.1) * 0.1;

                // 各ブロックの高さと動きを更新
                blocks.forEach(block => {
                    // 基本の波の動き
                    let wave = Math.sin(time * block.userData.speed + block.userData.phaseOffset);
                    
                    // マウスからの距離に基づくインタラクション
                    const dist = block.position.distanceTo(mouseWorldPos);
                    const mouseEffect = Math.max(0, 1 - dist / 10); // 影響範囲は半径10
                    
                    // スケールYの計算
                    let targetScaleY = 1 + wave * 0.5;
                    
                    // ハイライトされたブロックはより大きく動く
                    if(block.userData.isHighlight) {
                        targetScaleY += Math.max(0, Math.sin(time * 2 + block.userData.phaseOffset)) * 2;
                    }

                    // マウスが近づいたブロックは跳ね上がる
                    targetScaleY += mouseEffect * 4;

                    // スムーズな補間（Lerp）で動きを滑らかにする
                    block.scale.y += (targetScaleY - block.scale.y) * 0.1;
                });

                renderer.render(scene, camera);
            }

            animate();
        };
    </script>
</body>
</html>
