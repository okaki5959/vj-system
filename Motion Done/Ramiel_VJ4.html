<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第6の使徒 - RAMIEL VJ MOTION</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* エヴァ風のUIオーバーレイ */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
            color: #ff3300;
            text-shadow: 0 0 5px #ff3300;
        }
        .ui-top, .ui-bottom {
            display: flex;
            justify-content: space-between;
        }
        .emergency {
            font-size: 2vw;
            font-weight: bold;
            animation: blink 0.5s infinite;
            border: 2px solid #ff3300;
            padding: 5px 20px;
            background: rgba(255, 0, 0, 0.2);
        }
        .data-text {
            font-size: 1vw;
            line-height: 1.5;
            text-align: right;
        }
        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        /* スキャンライン用のオーバーレイCSS（予備） */
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px;
            z-index: 5;
            pointer-events: none;
            opacity: 0.5;
        }
    </style>

    <!-- Three.jsとアドオンのインポートマップ -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="scanlines"></div>

    <div id="ui-layer">
        <div class="ui-top">
            <div class="emergency">EMERGENCY</div>
            <div class="data-text" id="status-display">
                TARGET: 6TH ANGEL<br>
                BLOOD TYPE: BLUE<br>
                STATE: <span id="state-text">IDLE</span>
            </div>
        </div>
        <div class="ui-bottom">
            <div class="data-text" style="text-align: left;">
                MAGI SYSTEM 01<br>
                TOKYO-3 GEOFRONT
            </div>
            <div class="data-text">
                <span id="timer">00:00:00:00</span>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

        // --- 設定と初期化 ---
        const container = document.getElementById('canvas-container');
        const stateText = document.getElementById('state-text');
        const timerText = document.getElementById('timer');
        
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.005);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 25);
        let cameraBasePosition = new THREE.Vector3(0, 5, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: false }); // CRTの粗さを出すためfalse
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.5;
        container.appendChild(renderer.domElement);

        // --- ポストプロセッシング (Bloom + CRT/Glitch) ---
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        // 激しい光を演出するBloom
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.1;
        bloomPass.strength = 2.0;
        bloomPass.radius = 0.5;
        composer.addPass(bloomPass);

        // カスタムCRT＆グリッチシェーダー
        const CRTShader = {
            uniforms: {
                "tDiffuse": { value: null },
                "time": { value: 0.0 },
                "glitchAmount": { value: 0.0 },
                "intensity": { value: 1.0 }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float time;
                uniform float glitchAmount;
                uniform float intensity;
                varying vec2 vUv;

                // CRTの湾曲効果
                vec2 curve(vec2 uv) {
                    uv = (uv - 0.5) * 2.0;
                    uv *= 1.1;	
                    uv.x *= 1.0 + pow((abs(uv.y) / 5.0), 2.0);
                    uv.y *= 1.0 + pow((abs(uv.x) / 4.0), 2.0);
                    uv  = (uv / 2.0) + 0.5;
                    uv =  uv *0.92 + 0.04;
                    return uv;
                }

                float rand(vec2 co){
                    return fract(sin(dot(co.xy ,vec2(12.9898,78.233))) * 43758.5453);
                }

                void main() {
                    vec2 uv = curve(vUv);
                    
                    // 画面外を暗くする
                    if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) {
                        gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
                        return;
                    }

                    // グリッチによるRGBずらし
                    float shift = glitchAmount * 0.05 * sin(time * 50.0 + uv.y * 20.0);
                    float r = texture2D(tDiffuse, vec2(uv.x + shift, uv.y)).r;
                    float g = texture2D(tDiffuse, uv).g;
                    float b = texture2D(tDiffuse, vec2(uv.x - shift, uv.y)).b;
                    
                    vec3 col = vec3(r, g, b);

                    // ビネット効果
                    float vig = 1.0 - smoothstep(0.4, 1.0, length(uv - 0.5));
                    col *= vig;

                    // ノイズ
                    col += rand(uv * time) * 0.05 * intensity;

                    gl_FragColor = vec4(col * intensity, 1.0);
                }
            `
        };
        const crtPass = new ShaderPass(CRTShader);
        composer.addPass(crtPass);

        // --- オブジェクト生成（ラミエル） ---
        const ramielGroup = new THREE.Group();
        scene.add(ramielGroup);

        // 1. コアとなる正八面体
        const coreGeo = new THREE.OctahedronGeometry(6, 0);
        const coreMat = new THREE.MeshStandardMaterial({
            color: 0x0044ff,
            emissive: 0x0022ff,
            emissiveIntensity: 1.0,
            roughness: 0.1,
            metalness: 0.9,
            transparent: true,
            opacity: 0.95
        });
        const core = new THREE.Mesh(coreGeo, coreMat);
        ramielGroup.add(core);

        // 2. 変形時の外郭（テトラヘドロン星型を2つ重ねて表現）
        const tetraGeo = new THREE.TetrahedronGeometry(7, 0);
        const wireMat = new THREE.MeshBasicMaterial({
            color: 0x00ffff,
            wireframe: true,
            transparent: true,
            opacity: 0.0
        });
        const tetra1 = new THREE.Mesh(tetraGeo, wireMat);
        const tetra2 = new THREE.Mesh(tetraGeo, wireMat);
        tetra2.rotation.x = Math.PI; // 上下反転して組み合わせる
        ramielGroup.add(tetra1);
        ramielGroup.add(tetra2);

        // 3. 攻撃時の加粒子砲ビーム
        const beamGeo = new THREE.CylinderGeometry(0.5, 2.0, 200, 32);
        // ビームの起点を中心からずらす
        beamGeo.translate(0, 100, 0);
        const beamMat = new THREE.MeshBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.0
        });
        const beam = new THREE.Mesh(beamGeo, beamMat);
        beam.rotation.x = Math.PI / 2; // Z軸方向（手前）に向ける
        ramielGroup.add(beam);

        // --- 環境（ジオフロント風グリッド） ---
        const gridHelper = new THREE.GridHelper(200, 50, 0xff0000, 0x330000);
        gridHelper.position.y = -15;
        scene.add(gridHelper);

        // 光源
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0x00aaff, 5, 100);
        scene.add(pointLight);

        // --- ステートマシン（アニメーション制御） ---
        const STATES = {
            IDLE: { duration: 4.0 },
            DEFEND: { duration: 3.0 },
            CHARGE: { duration: 3.5 },
            ATTACK: { duration: 2.0 }
        };
        // URLパラメータでステート固定
        const _urlParams = new URLSearchParams(window.location.search);
        const _lockedScene = _urlParams.has('scene') ? parseInt(_urlParams.get('scene')) : -1;
        const _stateKeys = Object.keys(STATES); // ['IDLE','DEFEND','CHARGE','ATTACK']

        const sequence = ['IDLE', 'DEFEND', 'IDLE', 'CHARGE', 'ATTACK'];
        let seqIndex = 0;
        let currentState = (_lockedScene >= 0 && _lockedScene < _stateKeys.length) ? _stateKeys[_lockedScene] : sequence[seqIndex];
        let stateLocked = _lockedScene >= 0;
        let stateTimer = 0;

        // ターゲット値（Lerp用）
        const targets = {
            coreScale: new THREE.Vector3(1, 1, 1),
            tetraScale: new THREE.Vector3(0.1, 0.1, 0.1),
            coreColor: new THREE.Color(0x0044ff),
            tetraOpacity: 0.0,
            beamOpacity: 0.0,
            bloomStrength: 1.5,
            glitchAmount: 0.0,
            cameraShake: 0.0,
            rotationSpeed: 0.01
        };

        function setTargetsForState(state) {
            stateText.innerText = state;
            
            switch(state) {
                case 'IDLE':
                    targets.coreScale.set(1, 1, 1);
                    targets.tetraScale.set(0.1, 0.1, 0.1);
                    targets.coreColor.set(0x0044ff);
                    targets.tetraOpacity = 0.0;
                    targets.beamOpacity = 0.0;
                    targets.bloomStrength = 1.2;
                    targets.glitchAmount = 0.05;
                    targets.cameraShake = 0.0;
                    targets.rotationSpeed = 0.005;
                    break;
                case 'DEFEND':
                    // 平たく展開
                    targets.coreScale.set(2.5, 0.1, 2.5);
                    targets.tetraScale.set(3.0, 0.2, 3.0);
                    targets.coreColor.set(0x00ffff);
                    targets.tetraOpacity = 0.8;
                    targets.beamOpacity = 0.0;
                    targets.bloomStrength = 2.5;
                    targets.glitchAmount = 0.3; // シールド展開時のノイズ
                    targets.cameraShake = 0.1;
                    targets.rotationSpeed = 0.05;
                    break;
                case 'CHARGE':
                    // 収縮して激しく回転、エネルギー充填
                    targets.coreScale.set(0.6, 0.6, 0.6);
                    targets.tetraScale.set(1.5, 1.5, 1.5);
                    targets.coreColor.set(0xff00ff);
                    targets.tetraOpacity = 0.5;
                    targets.beamOpacity = 0.0;
                    targets.bloomStrength = 4.0;
                    targets.glitchAmount = 0.5;
                    targets.cameraShake = 0.3;
                    targets.rotationSpeed = 0.2; // 激しい回転
                    break;
                case 'ATTACK':
                    // 星型に展開しビーム発射
                    targets.coreScale.set(0.2, 3.0, 0.2);
                    targets.tetraScale.set(2.5, 2.5, 2.5);
                    targets.coreColor.set(0xffffff);
                    targets.tetraOpacity = 1.0;
                    targets.beamOpacity = 1.0;
                    targets.bloomStrength = 8.0; // 極限の光
                    targets.glitchAmount = 1.0;
                    targets.cameraShake = 1.5;
                    targets.rotationSpeed = 0.02;
                    break;
            }
        }

        // 初期ステート設定
        setTargetsForState(currentState);

        // --- アニメーションループ ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // ステートの更新
            stateTimer += delta;
            if (!stateLocked && stateTimer >= STATES[currentState].duration) {
                stateTimer = 0;
                seqIndex = (seqIndex + 1) % sequence.length;
                currentState = sequence[seqIndex];
                setTargetsForState(currentState);
            }

            // --- 滑らかな補間 (Lerp) ---
            const lerpSpeed = delta * 5.0;
            
            core.scale.lerp(targets.coreScale, lerpSpeed);
            tetra1.scale.lerp(targets.tetraScale, lerpSpeed);
            tetra2.scale.lerp(targets.tetraScale, lerpSpeed);
            
            coreMat.color.lerp(targets.coreColor, lerpSpeed);
            coreMat.emissive.lerp(targets.coreColor, lerpSpeed);
            
            wireMat.opacity += (targets.tetraOpacity - wireMat.opacity) * lerpSpeed;
            
            // ビームは攻撃時一気に出す
            if(currentState === 'ATTACK') {
                beamMat.opacity = Math.random() > 0.2 ? 1.0 : 0.5; // フラッシュ効果
            } else {
                beamMat.opacity += (targets.beamOpacity - beamMat.opacity) * lerpSpeed;
            }

            bloomPass.strength += (targets.bloomStrength - bloomPass.strength) * lerpSpeed;
            crtPass.uniforms.glitchAmount.value += (targets.glitchAmount - crtPass.uniforms.glitchAmount.value) * lerpSpeed;
            crtPass.uniforms.time.value = time;

            // --- 回転アニメーション ---
            ramielGroup.rotation.y += targets.rotationSpeed;
            if(currentState === 'CHARGE') {
                ramielGroup.rotation.x += targets.rotationSpeed * 0.5;
                ramielGroup.rotation.z += targets.rotationSpeed * 0.8;
                // チャージ中はスケールが微振動する
                const jitter = 1.0 + Math.sin(time * 50) * 0.1;
                core.scale.multiplyScalar(jitter);
            } else {
                // 通常状態に戻るように補正
                ramielGroup.rotation.x *= 0.95;
                ramielGroup.rotation.z *= 0.95;
            }

            // テトラヘドロンは逆回転させたりして複雑さを出す
            tetra1.rotation.y -= targets.rotationSpeed * 1.5;
            tetra2.rotation.y += targets.rotationSpeed * 2.0;
            tetra2.rotation.x = Math.PI + Math.sin(time)*0.2;

            // --- カメラシェイク ---
            let currentShake = targets.cameraShake;
            if(currentShake > 0) {
                camera.position.x = cameraBasePosition.x + (Math.random() - 0.5) * currentShake;
                camera.position.y = cameraBasePosition.y + (Math.random() - 0.5) * currentShake;
                camera.position.z = cameraBasePosition.z + (Math.random() - 0.5) * currentShake;
            } else {
                camera.position.lerp(cameraBasePosition, 0.1);
            }
            camera.lookAt(scene.position);

            // --- グリッドのアニメーション（前進） ---
            gridHelper.position.z = (time * 15) % 10;

            // --- UIタイマーの更新 ---
            timerText.innerText = (time).toFixed(4).padStart(9, '0');

            // 描画（Composer経由）
            composer.render();
        }

        // リサイズ対応
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        // 開始
        animate();
    </script>
</body>
</html>
