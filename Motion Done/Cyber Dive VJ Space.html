<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberbrain Dive - VJ Graphics</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 2;
            color: rgba(255, 204, 0, 0.8);
            pointer-events: none;
            text-shadow: 0 0 5px rgba(255, 204, 0, 0.5);
        }
        .line {
            margin-bottom: 5px;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .highlight {
            color: #ff3300;
            text-shadow: 0 0 8px rgba(255, 51, 0, 0.8);
        }
        #hud {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 2;
            color: rgba(255, 204, 0, 0.5);
            font-size: 12px;
            text-align: right;
            pointer-events: none;
        }
    </style>
    <!-- Three.js本体と必要なアドオンをCDNから読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- PostProcessing (Bloomエフェクト用) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>

    <div id="ui-layer">
        <div class="line">SYS_VER: 9.0.2.4 // SECURE BYPASS</div>
        <div class="line">STATUS: <span class="highlight">WARNING: SYSTEM BREACH</span></div>
        <div class="line" id="hash-line">CONNECTING...</div>
        <div class="line" style="margin-top: 15px; font-size: 10px; opacity: 0.7;">DRAG TO LOOK AROUND</div>
    </div>
    
    <div id="hud">
        <div id="fps-counter">SYNC RATE: 43% // UNSTABLE</div>
        <div>DATA STREAM: COMPROMISED</div>
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- 1. テクスチャ生成 ---
        const TEX_COLS = 24; // テクスチャの列数（シェーダーと同期させるための定数）
        const TEX_ROWS = 24;

        function createDigitalRainTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; 
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = 'bold 36px monospace'; // マス目に収まるようにサイズ調整
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const cellW = canvas.width / TEX_COLS;
            const cellH = canvas.height / TEX_ROWS;

            for (let i = 0; i < TEX_COLS; i++) {
                for (let j = 0; j < TEX_ROWS; j++) {
                    const rand = Math.random();
                    let char = '';
                    
                    if (rand < 0.3) {
                        char = Math.floor(Math.random() * 10).toString(); // 数字 (30%)
                    } else if (rand < 0.6) {
                        char = String.fromCharCode(0x30A0 + Math.floor(Math.random() * 96)); // カタカナ (30%)
                    } else if (rand < 0.8) {
                        char = String.fromCharCode(0x41 + Math.floor(Math.random() * 26)); // アルファベット大文字 (20%)
                    } else if (rand < 0.9) {
                        const sym = "!@#$%^&*()_+-=[]{}|;':\",./<>?";
                        char = sym[Math.floor(Math.random() * sym.length)]; // 記号 (10%)
                    } else {
                        // 漢字 (10%) ランダムなUnicode範囲を指定して文字化け感を演出
                        char = String.fromCharCode(0x4E00 + Math.floor(Math.random() * 2000));
                    }
                    
                    const v = Math.random();
                    let brightness = 0;
                    if (v > 0.95) brightness = 255;
                    else if (v > 0.6) brightness = Math.floor(150 + Math.random() * 100);
                    else if (v > 0.3) brightness = Math.floor(60 + Math.random() * 60);
                    else brightness = 0; 

                    if (brightness > 0) {
                        ctx.fillStyle = `rgb(${brightness}, ${brightness}, ${brightness})`;
                        ctx.fillText(char, i * cellW + cellW / 2, j * cellH + cellH / 2);
                    }
                }
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.magFilter = THREE.LinearFilter;
            texture.minFilter = THREE.LinearMipmapLinearFilter;
            return texture;
        }

        // 白い四角になっていたパーティクルを丸くするためのテクスチャ
        function createCircleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            ctx.beginPath();
            ctx.arc(16, 16, 14, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            return new THREE.CanvasTexture(canvas);
        }

        const rainTexture = createDigitalRainTexture();
        const circleTexture = createCircleTexture();

        // --- 2. シェーダーの定義 ---
        const vertexShader = `
            uniform float time;
            varying vec2 vUv;
            varying vec3 vPos;

            void main() {
                vUv = uv;
                vec3 pos = position;
                
                // 空間全体をゆっくり呼吸するようにうねらせる
                float wave = sin(pos.y * 0.01 + time * 0.5) * 3.0;
                vec3 dir = normalize(vec3(pos.x, 0.0, pos.z));
                pos.x += dir.x * wave;
                pos.z += dir.z * wave;
                
                vPos = pos;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `;

        const fragmentShader = `
            uniform sampler2D tDiffuse;
            uniform float time;
            uniform float speed;
            uniform vec3 color;
            uniform float glitchIntensity;
            uniform vec2 uvScale; 
            uniform float texCols; // テクスチャの実際の列数
            varying vec2 vUv;
            varying vec3 vPos;

            float random(vec2 st) {
                return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
            }

            void main() {
                // uvはテクスチャのリピート回数分スケールされた座標 (0.0 ~ uvScale)
                vec2 uv = vUv * uvScale;
                
                // ★修正：文字の列の切れ目とスクロールを完璧に同期させる
                // uv.xにtexColsを掛けることで、テクスチャが何度リピートされても、文字1列ごとに一意のIDが振られる
                float colId = floor(uv.x * texCols); 
                float colRand = random(vec2(colId, 0.0));
                
                // Y軸を下に向かってスクロール
                uv.y -= time * speed * (0.6 + colRand * 0.8);
                
                // 横ズレグリッチ
                float glitch = step(0.995, random(vec2(time * 0.1, colId))) * glitchIntensity * sin(time * 20.0);
                uv.x += glitch;
                
                vec4 texColor = texture2D(tDiffuse, fract(uv));
                float intensity = texColor.r;
                
                // 上下の端に行くほど暗くフェードアウト
                float depthFade = smoothstep(500.0, 100.0, abs(vPos.y)); 
                
                vec3 finalColor = color * intensity * 2.5; 
                
                if (glitch > 0.0) {
                    finalColor = vec3(0.8, 1.0, 1.0); 
                }
                
                gl_FragColor = vec4(finalColor * depthFade, intensity * depthFade);
            }
        `;

        // --- 3. Three.js セットアップ ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.003); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 0); 

        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- 4. ポストプロセッシング (発光・Bloom) ---
        const renderScene = new THREE.RenderPass(scene, camera);
        // 発光が強すぎて文字が潰れないように数値を調整
        const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.2, 0.6);
        
        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- 5. オブジェクト生成 ---
        const createCylinder = (radius, colorHex, speed, glitch, repeatsX, repeatsY) => {
            const geo = new THREE.CylinderGeometry(radius, radius, 1000, 64, 32, true);

            const mat = new THREE.ShaderMaterial({
                vertexShader,
                fragmentShader,
                uniforms: {
                    tDiffuse: { value: rainTexture },
                    time: { value: 0 },
                    speed: { value: speed },
                    color: { value: new THREE.Color(colorHex) },
                    glitchIntensity: { value: glitch },
                    uvScale: { value: new THREE.Vector2(repeatsX, repeatsY) },
                    texCols: { value: TEX_COLS } // シェーダーに列数を渡す
                },
                side: THREE.BackSide,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            return new THREE.Mesh(geo, mat);
        };

        // ★修正：危険な黄色〜赤系のグラデーションに変更
        const wall1 = createCylinder(40, 0xffcc00, 0.8, 0.02, 6, 24); // 手前: 警告のイエロー
        const wall2 = createCylinder(80, 0xff6600, 0.5, 0.05, 12, 24); // 中間: エマージェンシーオレンジ
        const wall3 = createCylinder(120, 0xff1100, 0.3, 0.01, 18, 24); // 奥: デンジャーレッド
        scene.add(wall1, wall2, wall3);

        // パーティクル（丸いテクスチャを適用して白い四角を解消）
        const particleCount = 1000;
        const particleGeo = new THREE.BufferGeometry();
        const posArray = new Float32Array(particleCount * 3);
        
        for(let i = 0; i < particleCount * 3; i += 3) {
            const radius = Math.random() * 120; 
            const theta = Math.random() * Math.PI * 2;
            posArray[i] = Math.cos(theta) * radius;        
            posArray[i+1] = Math.random() * 1000 - 500;    
            posArray[i+2] = Math.sin(theta) * radius;      
        }
        
        particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particleMat = new THREE.PointsMaterial({
            size: 2.0,
            color: 0xffdd55, // 飛び散る火花のような黄色
            map: circleTexture, 
            transparent: true,
            opacity: 0.5,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        // --- 6. Controlsと自動カメラワーク ---
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0, -1); 
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = false; 
        controls.enablePan = false;

        let isUserInteracting = false;
        controls.addEventListener('start', () => { isUserInteracting = true; });
        controls.addEventListener('end', () => { isUserInteracting = false; });

        // --- 7. アニメーションループ ---
        const clock = new THREE.Clock();
        const hashLine = document.getElementById('hash-line');
        let autoPanAngle = 0;

        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();
            
            wall1.material.uniforms.time.value = time;
            wall2.material.uniforms.time.value = time;
            wall3.material.uniforms.time.value = time;
            
            wall1.rotation.y = time * 0.05;
            wall2.rotation.y = -time * 0.03;
            wall3.rotation.y = time * 0.02;
            
            const positions = particles.geometry.attributes.position.array;
            for(let i = 1; i < positions.length; i += 3) {
                positions[i] -= delta * 300.0; 
                if(positions[i] < -500) {
                    positions[i] = 500; 
                }
            }
            particles.geometry.attributes.position.needsUpdate = true;

            if (!isUserInteracting) {
                autoPanAngle += delta * 0.15;
                const lookX = Math.sin(autoPanAngle);
                const lookZ = Math.cos(autoPanAngle);
                const lookY = Math.sin(time * 0.5) * 0.3; 
                
                controls.target.set(
                    camera.position.x + lookX, 
                    camera.position.y + lookY, 
                    camera.position.z + lookZ
                );
            }

            if (Math.random() > 0.9) {
                hashLine.innerText = 'DATA_LINK: 0x' + Math.random().toString(16).substr(2, 10).toUpperCase();
            }

            controls.update();
            composer.render(); 
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        window.onload = function() {
            animate();
        };
    </script>
</body>
</html>
