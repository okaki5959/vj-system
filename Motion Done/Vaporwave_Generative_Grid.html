<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaporwave Generative Tile Grid</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050014; /* 深い宇宙・夜空の色 */
            font-family: 'Courier New', Courier, monospace;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #overlay {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(0, 255, 255, 0.7);
            pointer-events: none;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
            z-index: 10;
        }
        h1 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 5px;
            text-transform: uppercase;
        }
        p {
            margin: 5px 0 0 0;
            font-size: 0.9rem;
            letter-spacing: 2px;
        }
    </style>
    <!-- Three.jsとアドオン（Post-processing等）をインポートするためのImport Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="overlay">
        <h1>V A P O R W A V E</h1>
        <p>Generative Tile Grid</p>
    </div>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- シーン・カメラ・レンダラーの設定 ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0022, 0.015); // 背景に溶け込むフォグ

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 5, 15);
        camera.lookAt(0, 5, -20);

        const renderer = new THREE.WebGLRenderer({ antialias: false }); // ポストプロセッシング時はオフが基本
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- ポストプロセッシング（ブルーム効果） ---
        const renderScene = new RenderPass(scene, camera);
        // resolution, strength, radius, threshold
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.8, 0.5, 0.2);
        
        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- ライティング ---
        const ambientLight = new THREE.AmbientLight(0x221144, 1.5); // 深い紫の環境光
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xff00ff, 2); // マゼンタ
        dirLight1.position.set(10, 10, 10);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0x00ffff, 2); // シアン
        dirLight2.position.set(-10, 10, -10);
        scene.add(dirLight2);

        // --- ジェネレーティブ・タイル・グリッド (InstancedMesh) ---
        // 大量のタイルを効率的に描画するためにInstancedMeshを使用します
        const gridCols = 50;
        const gridRows = 80;
        const count = gridCols * gridRows;
        const tileSize = 1.2;
        const spacing = 1.3;

        const tileGeometry = new THREE.BoxGeometry(tileSize, 1, tileSize);
        // 少し光沢のあるマテリアル
        const tileMaterial = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.2,
            metalness: 0.8,
        });

        const instancedMesh = new THREE.InstancedMesh(tileGeometry, tileMaterial, count);
        scene.add(instancedMesh);

        // タイル配置の初期化
        const dummy = new THREE.Object3D();
        const tileColor = new THREE.Color();
        const colorCyan = new THREE.Color(0x00ffff);
        const colorMagenta = new THREE.Color(0xff00ff);
        const colorDarkPurple = new THREE.Color(0x110033);

        // --- レトロな太陽 (ShaderMaterial) ---
        const sunGeometry = new THREE.CircleGeometry(40, 64);
        
        // Vaproewave特有のストライプグラデーション太陽を表現するカスタムシェーダー
        const sunShaderMaterial = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0.0 }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float uTime;
                varying vec2 vUv;

                void main() {
                    // 黄色からマゼンタへのグラデーション
                    vec3 topColor = vec3(1.0, 0.8, 0.0);
                    vec3 bottomColor = vec3(1.0, 0.0, 0.6);
                    vec3 color = mix(bottomColor, topColor, vUv.y);

                    // 下半分にストライプの切り込みを入れる
                    float alpha = 1.0;
                    if (vUv.y < 0.5) {
                        // 時間で上に動くストライプ
                        float stripe = fract(vUv.y * 20.0 - uTime * 2.0);
                        // 下に行くほど切り込み(暗い部分)を太くする
                        float thickness = mix(0.1, 0.8, vUv.y * 2.0); 
                        if (stripe > thickness) {
                            alpha = 0.0;
                        }
                    }

                    gl_FragColor = vec4(color, alpha);
                }
            `,
            transparent: true,
            side: THREE.DoubleSide
        });

        const sun = new THREE.Mesh(sunGeometry, sunShaderMaterial);
        sun.position.set(0, 10, -90); // グリッドの奥に配置
        scene.add(sun);

        // --- 背景の星 / パーティクル ---
        const starGeo = new THREE.BufferGeometry();
        const starCount = 500;
        const starPos = new Float32Array(starCount * 3);
        for(let i=0; i<starCount*3; i++) {
            starPos[i] = (Math.random() - 0.5) * 200;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({color: 0xffffff, size: 0.2, transparent: true, opacity: 0.8});
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // --- リサイズ処理 ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- アニメーションループ ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // 太陽のアニメーションを更新
            sunShaderMaterial.uniforms.uTime.value = elapsedTime;

            // 星をゆっくり回転
            stars.rotation.z = elapsedTime * 0.02;

            // ジェネレーティブ・グリッドの波の更新
            let i = 0;
            const speed = elapsedTime * 2.0;

            for (let row = 0; row < gridRows; row++) {
                for (let col = 0; col < gridCols; col++) {
                    // グリッドの座標計算
                    const x = (col - gridCols / 2) * spacing;
                    const z = -row * spacing + (elapsedTime * 5.0) % spacing; // 手前に無限スクロールするトリック

                    // 複数のサイン波を組み合わせて複雑な地形（プロシージャル・ジェネレーション）を作成
                    const wave1 = Math.sin(x * 0.2 + speed) * Math.cos(z * 0.2 + speed);
                    const wave2 = Math.sin(x * 0.05 - speed * 0.5) * Math.cos(z * 0.05 - speed * 0.5);
                    
                    // 高さを決定
                    let height = (wave1 + wave2) * 3.0 + 3.0; // 0〜程度の範囲
                    height = Math.max(0.1, height); // 最小の高さを確保

                    // 位置とスケールの適用
                    dummy.position.set(x, height / 2 - 2, z + 10); // +10はカメラ位置のオフセット
                    dummy.scale.set(1, height, 1);
                    dummy.updateMatrix();
                    instancedMesh.setMatrixAt(i, dummy.matrix);

                    // 高さに基づいて色を計算（低い=紫、高い=マゼンタ〜シアン）
                    let normalizedHeight = height / 8.0;
                    if (normalizedHeight < 0.4) {
                        tileColor.lerpColors(colorDarkPurple, colorMagenta, normalizedHeight / 0.4);
                    } else {
                        tileColor.lerpColors(colorMagenta, colorCyan, (normalizedHeight - 0.4) / 0.6);
                    }
                    instancedMesh.setColorAt(i, tileColor);

                    i++;
                }
            }

            // 更新フラグを立てる
            instancedMesh.instanceMatrix.needsUpdate = true;
            instancedMesh.instanceColor.needsUpdate = true;

            // カメラを少し揺らす（浮遊感）
            camera.position.y = 5 + Math.sin(elapsedTime * 0.5) * 0.5;
            camera.position.x = Math.sin(elapsedTime * 0.2) * 2.0;
            camera.lookAt(0, 5, -20);

            // シーンのレンダリング（ポストプロセッシングを通す）
            composer.render();
        }

        animate();
    </script>
</body>
</html>
