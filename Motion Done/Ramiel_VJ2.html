<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramiel VJ Motion Graphics</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 20px;
            z-index: 10;
        }
        .hud-text {
            color: rgba(255, 0, 0, 0.7);
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(255, 0, 0, 0.5);
        }
        .warning-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.1s;
        }
        .warning-text {
            color: #fff;
            background-color: #ff0000;
            padding: 5px 20px;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 10px;
            border: 2px solid #fff;
            animation: blink 0.2s infinite alternate;
        }
        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.2; }
        }
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50vw;
            height: 50vh;
            border: 1px solid rgba(255, 0, 0, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .crosshair::before, .crosshair::after {
            content: '';
            position: absolute;
            background-color: rgba(255, 0, 0, 0.3);
        }
        .crosshair::before { width: 100%; height: 1px; }
        .crosshair::after { width: 1px; height: 100%; }
        
        #controls-hint {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: rgba(0, 150, 255, 0.5);
            font-size: 12px;
            text-align: right;
        }
    </style>
    <!-- Import Three.js as ES Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="ui-layer">
        <div style="display: flex; justify-content: space-between;">
            <div class="hud-text">SYS_ID: 0x8A49F<br>TARGET: UNIDENTIFIED<br>PATTERN: BLUE</div>
            <div class="hud-text" style="text-align: right;">ORBIT_SYNC: OK<br>MAT_RESONANCE: 99.9%</div>
        </div>
        
        <div class="warning-container" id="warning-ui">
            <div class="warning-text" id="warning-msg">EMERGENCY</div>
        </div>
        
        <div class="crosshair"></div>
        
        <div id="controls-hint">
            [MOUSE DRAG] ROTATE CAMERA<br>
            [SCROLL] ZOOM IN/OUT
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- Configuration ---
        const CONFIG = {
            particleCount: 40000,
            baseColor: new THREE.Color(0.1, 0.4, 1.0),   // Blue
            attackColor: new THREE.Color(1.0, 0.1, 0.3), // Red/Pink
            beamColor: new THREE.Color(1.0, 0.8, 1.0)    // White/Pink
        };

        // --- Globals ---
        let scene, camera, renderer, composer, controls;
        let particleMesh, beamMesh, beamCoreMesh;
        let clock = new THREE.Clock();
        
        // URLパラメータでステート固定
        const _urlParams = new URLSearchParams(window.location.search);
        const _stateNames = ['idle', 'charge', 'fire', 'cooldown'];
        const _lockedScene = _urlParams.has('scene') ? parseInt(_urlParams.get('scene')) : -1;

        // State Machine
        let state = (_lockedScene >= 0 && _lockedScene < _stateNames.length) ? _stateNames[_lockedScene] : 'idle';
        let stateLocked = _lockedScene >= 0;
        let stateTimer = 0;
        let attackProgress = 0;
        let baseCameraPos = new THREE.Vector3(0, 0, 15);

        // UI Elements
        const warningUI = document.getElementById('warning-ui');
        const warningMsg = document.getElementById('warning-msg');

        init();
        animate();

        function init() {
            // 1. Scene & Camera Setup
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.02);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(baseCameraPos);

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x000000);
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // 2. Post-Processing (Bloom)
            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                1.5, // strength
                0.4, // radius
                0.2  // threshold
            );
            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            // 3. Generate Text Texture Atlas
            const textTexture = createTextTexture();

            // 4. Generate Ramiel Geometry (Particles on Octahedron surface)
            createParticleRamiel(textTexture);

            // 5. Create Beam Objects
            createBeams();

            // 6. Events
            window.addEventListener('resize', onWindowResize);
        }

        function createTextTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const cols = 16;
            const rows = 16;
            const cellW = canvas.width / cols;
            const cellH = canvas.height / rows;
            ctx.font = `bold ${cellH * 0.7}px "MS Mincho", "Hiragino Mincho Pro", serif`;

            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789使徒攻撃防衛警告臨界突破絶対領域拒絶死海文書";
            
            for (let i = 0; i < cols * rows; i++) {
                const char = chars.charAt(Math.floor(Math.random() * chars.length));
                const x = (i % cols) * cellW + cellW / 2;
                const y = Math.floor(i / cols) * cellH + cellH / 2;
                ctx.fillText(char, x, y);
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;
            texture.magFilter = THREE.LinearFilter;
            return texture;
        }

        function createParticleRamiel(texture) {
            // Octahedron vertices
            const size = 3;
            const vertices = [
                new THREE.Vector3(0, size, 0),   // Top
                new THREE.Vector3(0, -size, 0),  // Bottom
                new THREE.Vector3(size, 0, 0),   // Eq 1
                new THREE.Vector3(0, 0, size),   // Eq 2
                new THREE.Vector3(-size, 0, 0),  // Eq 3
                new THREE.Vector3(0, 0, -size)   // Eq 4
            ];

            const triangles = [
                [vertices[0], vertices[2], vertices[3]],
                [vertices[0], vertices[3], vertices[4]],
                [vertices[0], vertices[4], vertices[5]],
                [vertices[0], vertices[5], vertices[2]],
                [vertices[1], vertices[3], vertices[2]],
                [vertices[1], vertices[4], vertices[3]],
                [vertices[1], vertices[5], vertices[4]],
                [vertices[1], vertices[2], vertices[5]]
            ];

            const positions = new Float32Array(CONFIG.particleCount * 3);
            const normals = new Float32Array(CONFIG.particleCount * 3);
            const randoms = new Float32Array(CONFIG.particleCount);

            const particlesPerTri = Math.floor(CONFIG.particleCount / 8);

            let idx = 0;
            for (let t = 0; t < 8; t++) {
                const A = triangles[t][0];
                const B = triangles[t][1];
                const C = triangles[t][2];

                // Calculate face normal
                const AB = new THREE.Vector3().subVectors(B, A);
                const AC = new THREE.Vector3().subVectors(C, A);
                const normal = new THREE.Vector3().crossVectors(AB, AC).normalize();

                for (let i = 0; i < particlesPerTri; i++) {
                    // Random barycentric coordinates
                    let r1 = Math.random();
                    let r2 = Math.random();
                    if (r1 + r2 > 1) {
                        r1 = 1 - r1;
                        r2 = 1 - r2;
                    }
                    
                    const p = new THREE.Vector3()
                        .copy(A)
                        .addScaledVector(AB, r1)
                        .addScaledVector(AC, r2);

                    positions[idx * 3] = p.x;
                    positions[idx * 3 + 1] = p.y;
                    positions[idx * 3 + 2] = p.z;

                    normals[idx * 3] = normal.x;
                    normals[idx * 3 + 1] = normal.y;
                    normals[idx * 3 + 2] = normal.z;

                    randoms[idx] = Math.random();
                    idx++;
                }
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('aNormal', new THREE.BufferAttribute(normals, 3));
            geometry.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 1));

            // Custom Shader Material for Text Particles and Morphing
            const material = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uTexture: { value: texture },
                    uProgress: { value: 0 }, // 0 = idle, 1 = attack
                    uBeat: { value: 0 },
                    uBaseColor: { value: CONFIG.baseColor },
                    uAttackColor: { value: CONFIG.attackColor }
                },
                vertexShader: `
                    uniform float uTime;
                    uniform float uProgress;
                    uniform float uBeat;
                    
                    attribute vec3 aNormal;
                    attribute float aRandom;
                    
                    varying float vRandom;
                    varying float vProgress;

                    // Easing function
                    float easeInOutQuint(float x) {
                        return x < 0.5 ? 16.0 * x * x * x * x * x : 1.0 - pow(-2.0 * x + 2.0, 5.0) / 2.0;
                    }

                    void main() {
                        vRandom = aRandom;
                        vProgress = uProgress;
                        
                        vec3 pos = position;
                        
                        // --- Idle Animation ---
                        // Slight breathing
                        float breathe = 1.0 + sin(uTime * 3.0 + pos.y) * 0.05 * (1.0 - uProgress);
                        pos *= breathe;

                        // --- Attack Transformation ---
                        float morphPhase = easeInOutQuint(uProgress);
                        
                        // 1. Separate faces (push outward along normal)
                        float separation = morphPhase * 4.0;
                        vec3 morphedPos = pos + aNormal * separation;
                        
                        // 2. Transform into a cross/star shape
                        morphedPos.x *= 1.0 + morphPhase * 1.5;
                        morphedPos.y *= 1.0 + morphPhase * 1.5;
                        morphedPos.z *= 1.0 - morphPhase * 0.8; // flatten Z
                        
                        // 3. Add chaotic jitter when fully charged
                        float jitter = smoothstep(0.8, 1.0, uProgress) * 0.2;
                        morphedPos += aNormal * sin(uTime * 50.0 + aRandom * 100.0) * jitter;

                        // Mix positions
                        pos = mix(pos, morphedPos, morphPhase);

                        // --- Beat pulsing (VJ effect) ---
                        pos *= 1.0 + uBeat * 0.15;

                        vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                        
                        // Particle Size calculation
                        float pSize = (25.0 + aRandom * 30.0);
                        // Make particles bigger during attack
                        pSize += morphPhase * 20.0;
                        
                        gl_PointSize = pSize * (1.0 / -mvPosition.z);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    uniform sampler2D uTexture;
                    uniform float uTime;
                    uniform vec3 uBaseColor;
                    uniform vec3 uAttackColor;
                    
                    varying float vRandom;
                    varying float vProgress;

                    void main() {
                        // UV mapping for texture atlas (16x16)
                        float cols = 16.0;
                        float rows = 16.0;
                        
                        // Select random cell
                        float cellIndex = floor(vRandom * 256.0);
                        
                        // Glitch/Change text rapidly during attack
                        float glitch = step(0.5, vProgress) * floor(uTime * 20.0 + vRandom * 100.0);
                        // Slow change during idle
                        float idleChange = floor(uTime * 2.0 + vRandom * 10.0) * (1.0 - vProgress);
                        
                        cellIndex = mod(cellIndex + glitch + idleChange, 256.0);
                        
                        float col = mod(cellIndex, cols);
                        float row = floor(cellIndex / cols);
                        
                        vec2 uv = gl_PointCoord;
                        uv.x = (uv.x + col) / cols;
                        uv.y = (1.0 - uv.y + row) / rows; // Flip Y for correct text rendering
                        
                        vec4 texColor = texture2D(uTexture, uv);
                        if(texColor.r < 0.1) discard; // Discard black background
                        
                        // Color transition
                        vec3 color = mix(uBaseColor, uAttackColor, vProgress);
                        
                        // Make it super bright for bloom
                        color *= 1.5 + vProgress * 2.0;
                        
                        gl_FragColor = vec4(color, texColor.r); // Use Red channel as alpha
                    }
                `,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particleMesh = new THREE.Points(geometry, material);
            scene.add(particleMesh);
        }

        function createBeams() {
            // Main Beam (Outer)
            const geomOuter = new THREE.CylinderGeometry(0.5, 0.5, 100, 16);
            geomOuter.translate(0, 50, 0); // Origin at bottom
            geomOuter.rotateX(Math.PI / 2); // Point along Z axis

            const matOuter = new THREE.MeshBasicMaterial({
                color: CONFIG.attackColor,
                transparent: true,
                opacity: 0,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                side: THREE.DoubleSide
            });
            beamMesh = new THREE.Mesh(geomOuter, matOuter);
            scene.add(beamMesh);

            // Core Beam (Inner)
            const geomInner = new THREE.CylinderGeometry(0.2, 0.2, 100, 8);
            geomInner.translate(0, 50, 0);
            geomInner.rotateX(Math.PI / 2);

            const matInner = new THREE.MeshBasicMaterial({
                color: CONFIG.beamColor,
                transparent: true,
                opacity: 0,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            beamCoreMesh = new THREE.Mesh(geomInner, matInner);
            scene.add(beamCoreMesh);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function applyCameraShake(intensity) {
            if (intensity > 0) {
                camera.position.x = baseCameraPos.x + (Math.random() - 0.5) * intensity;
                camera.position.y = baseCameraPos.y + (Math.random() - 0.5) * intensity;
            } else {
                // Return to base smoothly
                camera.position.lerp(baseCameraPos, 0.1);
            }
        }

        function updateStateMachine(delta, time) {
            stateTimer += delta;
            // 固定モード時はステート遷移を抑制
            if (stateLocked) stateTimer = Math.min(stateTimer, 0.5);

            switch(state) {
                case 'idle':
                    attackProgress = 0;
                    beamMesh.material.opacity = 0;
                    beamCoreMesh.material.opacity = 0;
                    beamMesh.scale.z = 0;
                    beamCoreMesh.scale.z = 0;
                    
                    // Rotate slowly
                    particleMesh.rotation.y = time * 0.2;
                    particleMesh.rotation.x = Math.sin(time * 0.5) * 0.1;

                    if (stateTimer > 4.0) {
                        state = 'charge';
                        stateTimer = 0;
                        warningUI.style.opacity = '1';
                        warningMsg.innerText = "WARNING: HIGH ENERGY";
                        warningMsg.style.backgroundColor = "#ff8800";
                    }
                    break;

                case 'charge':
                    // Interpolate progress 0 -> 1 over 2 seconds
                    attackProgress = Math.min(1.0, stateTimer / 2.0);
                    
                    // Rotate faster
                    particleMesh.rotation.y += delta * (0.2 + attackProgress * 2.0);
                    
                    if (stateTimer > 2.0) {
                        state = 'fire';
                        stateTimer = 0;
                        warningMsg.innerText = "FIRING!";
                        warningMsg.style.backgroundColor = "#ff0000";
                        
                        // Snap rotation to face camera slightly (VJ impact)
                        particleMesh.rotation.x = 0;
                        particleMesh.rotation.y = 0;
                    }
                    break;

                case 'fire':
                    attackProgress = 1.0;
                    
                    // Beam Animation
                    beamMesh.material.opacity = 0.6 + Math.random() * 0.4; // Flicker
                    beamCoreMesh.material.opacity = 0.8 + Math.random() * 0.2;
                    beamMesh.scale.z = 1;
                    beamCoreMesh.scale.z = 1;
                    
                    // Scale X/Y for beam pulse effect
                    let pulse = 1.0 + Math.sin(time * 50.0) * 0.2;
                    beamMesh.scale.x = beamMesh.scale.y = 1.0 * pulse;
                    beamCoreMesh.scale.x = beamCoreMesh.scale.y = 1.0 * pulse;

                    // Intense camera shake
                    applyCameraShake(0.5);

                    if (stateTimer > 1.0) {
                        state = 'cooldown';
                        stateTimer = 0;
                        warningUI.style.opacity = '0';
                    }
                    break;

                case 'cooldown':
                    // Interpolate progress 1 -> 0 over 1 second
                    attackProgress = Math.max(0.0, 1.0 - stateTimer / 1.0);
                    
                    // Fade out beam
                    beamMesh.material.opacity *= 0.8;
                    beamCoreMesh.material.opacity *= 0.8;
                    beamMesh.scale.z *= 0.9;
                    beamCoreMesh.scale.z *= 0.9;

                    applyCameraShake(0); // Smooth return
                    
                    particleMesh.rotation.y += delta * (2.0 * attackProgress + 0.2);

                    if (stateTimer > 1.0) {
                        state = 'idle';
                        stateTimer = 0;
                    }
                    break;
            }

            // Sync Base Camera Pos with OrbitControls
            if (state !== 'fire') {
                baseCameraPos.copy(camera.position);
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            controls.update();
            updateStateMachine(delta, time);

            // VJ Beat calculation (Simulated 120 BPM)
            const bps = 120 / 60;
            const beatPhase = (time * bps) % 1.0;
            const beatPulse = Math.exp(-beatPhase * 5.0); // sharp decay

            if (particleMesh) {
                particleMesh.material.uniforms.uTime.value = time;
                particleMesh.material.uniforms.uProgress.value = attackProgress;
                particleMesh.material.uniforms.uBeat.value = (state === 'idle') ? beatPulse : 0;
            }

            // Post-processing render
            composer.render();
        }
    </script>
</body>
</html>
