<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generative Circuit VJ Loop</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #021204; /* 深い緑の基盤カラー */
            /* 基盤のグリッドパターンをCSSで描画 */
            background-image: 
                linear-gradient(rgba(0, 255, 0, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 0, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            font-family: sans-serif;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* VJらしい画面の質感を出すためのオーバーレイ（スキャンライン＋ビネット） */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at center, transparent 40%, rgba(0, 10, 0, 0.8) 100%),
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 255, 0, 0.03) 2px, rgba(0, 255, 0, 0.03) 4px);
            pointer-events: none; /* クリックを下のキャンバスに貫通させる */
            z-index: 2;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>
    <div class="overlay"></div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        const gridSize = 30; // グリッドの間隔（CSSのbackground-sizeと合わせる）
        let signals = [];
        const maxSignals = 150; // 同時に走る信号の最大数

        // 金色系のカラーパレット
        const goldColors = ['#FFD700', '#FDB813', '#E6C200', '#DAA520', '#F0E68C'];
        // アクセントとなるネオンカラー（VJらしさ）
        const neonColors = ['#00FFFF', '#FF00FF', '#00FF7F', '#FF4500'];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 基盤のパッド（ノード）を描画する関数
        function drawPad(x, y, color, size) {
            ctx.fillStyle = color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = color;
            ctx.beginPath();
            ctx.arc(x, y, size * 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // パッドの中心の穴
            ctx.fillStyle = '#021204';
            ctx.beginPath();
            ctx.arc(x, y, size * 0.8, 0, Math.PI * 2);
            ctx.fill();
        }

        class Signal {
            constructor(gx, gy, dir, isPulse = false) {
                // グリッド座標
                this.gx = gx !== undefined ? gx : Math.floor(Math.random() * (width / gridSize));
                this.gy = gy !== undefined ? gy : Math.floor(Math.random() * (height / gridSize));
                
                // ピクセル座標
                this.x = this.gx * gridSize;
                this.y = this.gy * gridSize;
                
                // 方向 (0:北, 1:北東, 2:東, 3:南東, 4:南, 5:南西, 6:西, 7:北西)
                this.dir = dir !== undefined ? dir : Math.floor(Math.random() * 8);
                
                this.targetGx = this.gx;
                this.targetGy = this.gy;
                this.targetX = this.x;
                this.targetY = this.y;
                
                this.isPulse = isPulse;
                
                // パルス（高速・高輝度データ）か通常の回路かでパラメータを変える
                if (this.isPulse) {
                    this.speed = 8 + Math.random() * 5;
                    this.color = '#FFFFFF';
                    this.width = 3;
                    this.life = 50 + Math.random() * 50;
                } else {
                    this.speed = 2 + Math.random() * 3;
                    // 80%は金色、20%はアクセントのネオンカラー
                    if (Math.random() > 0.2) {
                        this.color = goldColors[Math.floor(Math.random() * goldColors.length)];
                    } else {
                        this.color = neonColors[Math.floor(Math.random() * neonColors.length)];
                    }
                    this.width = Math.random() > 0.8 ? 2.5 : 1; // たまに太いバスラインを生成
                    this.life = 100 + Math.floor(Math.random() * 300);
                }
                
                this.dead = false;
                this.calculateNextTarget();
                
                if (!this.isPulse && Math.random() > 0.5) {
                    drawPad(this.x, this.y, this.color, this.width);
                }
            }

            calculateNextTarget() {
                // 方向転換のロジック（45度または90度）
                if (Math.random() < 0.3) {
                    let turn = Math.random() > 0.5 ? 1 : -1; // 45度
                    if (Math.random() < 0.2) turn *= 2; // 90度
                    this.dir = (this.dir + turn + 8) % 8;
                }

                // 8方向の移動量ベクトル
                const dx = [0, 1, 1, 1, 0, -1, -1, -1];
                const dy = [-1, -1, 0, 1, 1, 1, 0, -1];

                this.targetGx = this.gx + dx[this.dir];
                this.targetGy = this.gy + dy[this.dir];
                this.targetX = this.targetGx * gridSize;
                this.targetY = this.targetGy * gridSize;

                // 画面外に出たら消滅
                if (this.targetX < 0 || this.targetX > width || this.targetY < 0 || this.targetY > height) {
                    this.die();
                }
            }

            die() {
                this.dead = true;
                if (!this.isPulse) drawPad(this.x, this.y, this.color, this.width);
            }

            update() {
                if (this.dead) return;

                this.life--;
                if (this.life <= 0) {
                    this.die();
                    // 消滅時にたまに分岐して新しい信号を生む
                    if (Math.random() < 0.4 && !this.isPulse) spawnSignal(this.gx, this.gy);
                    return;
                }

                let dx = this.targetX - this.x;
                let dy = this.targetY - this.y;
                let dist = Math.sqrt(dx * dx + dy * dy);

                let oldX = this.x;
                let oldY = this.y;

                // ターゲットグリッドに到達した場合
                if (dist < this.speed) {
                    this.x = this.targetX;
                    this.y = this.targetY;
                    this.gx = this.targetGx;
                    this.gy = this.targetGy;

                    // 稀に90度方向に分岐（枝分かれ）
                    if (Math.random() < 0.05 && !this.isPulse) {
                        spawnSignal(this.gx, this.gy, (this.dir + 2) % 8);
                    }

                    this.calculateNextTarget();
                } else {
                    // ターゲットに向かって移動
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                }

                // 回路線の描画
                ctx.beginPath();
                ctx.moveTo(oldX, oldY);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.width;
                
                // 動いている先端部分だけグロー効果をつける（パフォーマンス対策）
                ctx.shadowBlur = this.isPulse ? 20 : 10;
                ctx.shadowColor = this.color;
                ctx.stroke();
                ctx.shadowBlur = 0; // リセット

                // 信号の先端（ヘッド）を描画
                ctx.fillStyle = this.isPulse ? '#FFFFFF' : '#FFF7D6';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.width * 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function spawnSignal(gx, gy, dir, isPulse) {
            // バースト時には一時的に最大数を超えるのを許可
            if (signals.length < maxSignals * 1.5) {
                signals.push(new Signal(gx, gy, dir, isPulse));
            }
        }

        // アニメーションループ
        function animate() {
            // トレイル（残像）エフェクトの作成
            // destination-outを使って徐々に透明にしていくことで、背景のCSSグリッドを透けさせる
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)'; // 軌跡が消える速度（数値が小さいほど長く残る）
            ctx.fillRect(0, 0, width, height);

            ctx.globalCompositeOperation = 'source-over';

            // 信号の更新と描画
            for (let i = signals.length - 1; i >= 0; i--) {
                signals[i].update();
                if (signals[i].dead) {
                    signals.splice(i, 1);
                }
            }

            // 常に一定数の信号を保つ
            while (signals.length < maxSignals) {
                // たまに高速のデータパルスを発生させる
                let isPulse = Math.random() < 0.02;
                spawnSignal(undefined, undefined, undefined, isPulse);
            }

            requestAnimationFrame(animate);
        }

        // 初期化：最初の信号をランダムに配置
        for (let i = 0; i < maxSignals; i++) {
            spawnSignal();
        }

        animate();

        // インタラクション：クリックでその位置からデータバースト
        window.addEventListener('mousedown', (e) => {
            let gx = Math.round(e.clientX / gridSize);
            let gy = Math.round(e.clientY / gridSize);
            
            // 8方向すべてに一斉に信号を放つ
            for(let i = 0; i < 8; i++) {
                spawnSignal(gx, gy, i);
                spawnSignal(gx, gy, i, true); // パルスも混ぜる
            }
            drawPad(gx * gridSize, gy * gridSize, '#FFFFFF', 4);
            
            // 画面全体を一瞬フラッシュさせる演出（色をランダム化）
            const flashColors = ['rgba(255, 215, 0, 0.2)', 'rgba(0, 255, 255, 0.2)', 'rgba(255, 0, 255, 0.2)', 'rgba(0, 255, 127, 0.2)'];
            ctx.fillStyle = flashColors[Math.floor(Math.random() * flashColors.length)];
            ctx.fillRect(0, 0, width, height);
        });

    </script>
</body>
</html>
