<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invader VJ Motion</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505; /* 暗い背景 */
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #00ffff;
            pointer-events: none;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #ff00ff;
            z-index: 10;
        }
        h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 5px;
            font-weight: bold;
        }
        p {
            margin: 5px 0 0 0;
            font-size: 14px;
            letter-spacing: 2px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div id="ui-layer">
        <h1>HUMANOID INVADERS</h1>
        <p>VJ MOTION / AUTO ROTATION / ORBIT CONTROLS ENABLED</p>
    </div>

    <!-- Three.js 本体と各種アドオン (r128 で統一) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <!-- ポストプロセッシング用 (Bloomエフェクト等) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

    <script>
        let scene, camera, renderer, composer, controls;
        let particles;
        const clock = new THREE.Clock();

        // インベーダーの設定
        const COLS = 12;    // 列数 (X方向)
        const ROWS = 12;    // 奥行き (Z方向)
        const LEVELS = 8;   // 高さの層 (Y方向)
        const HUMAN_COUNT = COLS * ROWS * LEVELS;
        
        const spacingX = 5.0;
        const spacingZ = 5.0;
        const spacingY = 12.0;

        // InstancedMeshを管理する配列とデータ
        const humanParts = [];
        const humansData = [];

        // アニメーション設定
        const BPM = 135; // VJらしいアップテンポなビート
        const beatTime = 60 / BPM;

        init();
        animate();

        function init() {
            // 1. Scene, Camera, Renderer のセットアップ
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050510, 0.015); // 遠くを暗く沈めるフォグ

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, -10, 35); // インベーダーに寄って見上げる迫力あるアングルに変更

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            // トーンマッピングを無効にしてBloomを強調
            renderer.toneMapping = THREE.NoToneMapping; 
            document.body.appendChild(renderer.domElement);

            // 2. PostProcessing (UnrealBloomPass) のセットアップ
            const renderScene = new THREE.RenderPass(scene, camera);
            // Bloomの設定 (強めに光らせる)
            const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 2.0, 0.5, 0.1);
            
            composer = new THREE.EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            // 3. Controls のセットアップ
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.autoRotate = true; // カメラの自動回転を有効化
            controls.autoRotateSpeed = 1.5; // 回転スピード
            controls.enableDamping = true;
            controls.target.set(0, 0, 0);

            // 4. Lights のセットアップ
            const ambientLight = new THREE.AmbientLight(0x222222);
            scene.add(ambientLight);

            const pointLight1 = new THREE.PointLight(0xff00ff, 2, 200);
            pointLight1.position.set(30, 0, 30);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0x00ffff, 2, 200);
            pointLight2.position.set(-30, -20, -30);
            scene.add(pointLight2);

            // 5. 背景の装飾 (空間を強調するグリッド)
            createEnvironment();

            // 6. 人型インベーダー (InstancedMesh) の生成
            createInvaders();

            // 7. パーティクル (データストリーム/星屑) の生成
            createParticles();

            // リサイズイベント
            window.addEventListener('resize', onWindowResize, false);
        }

        function createEnvironment() {
            // 上下のサイバーグリッド
            const gridHelperBottom = new THREE.GridHelper(300, 60, 0xff00ff, 0x440044);
            gridHelperBottom.position.y = -50;
            scene.add(gridHelperBottom);

            const gridHelperTop = new THREE.GridHelper(300, 60, 0x00ffff, 0x004444);
            gridHelperTop.position.y = 50;
            gridHelperTop.rotation.x = Math.PI; // 裏返す
            scene.add(gridHelperTop);
        }

        function createInvaders() {
            const S = 1.0; // 基準サイズ

            // 部位ごとのジオメトリ (原点を関節位置に合わせるための translate)
            const headGeom = new THREE.BoxGeometry(S*1.2, S*1.2, S*1.2);
            const bodyGeom = new THREE.BoxGeometry(S*1.6, S*2.0, S*0.8);
            
            const armGeom = new THREE.BoxGeometry(S*0.4, S*1.8, S*0.4);
            armGeom.translate(0, -S*0.9, 0); // 肩を原点に
            
            const legGeom = new THREE.BoxGeometry(S*0.5, S*2.0, S*0.5);
            legGeom.translate(0, -S*1.0, 0); // 股関節を原点に

            // マテリアルの設定
            // Solidは暗い下地、Wireframeはネオンカラーで光る線
            const matSolid = new THREE.MeshStandardMaterial({
                color: 0x111111,
                roughness: 0.8,
                metalness: 0.5
            });
            const matWire = new THREE.MeshBasicMaterial({
                color: 0xffffff, // InstancedColorで上書き
                wireframe: true,
                transparent: true,
                opacity: 0.8
            });

            // 部位の定義
            const partsDef = [
                { name: 'head', geom: headGeom },
                { name: 'body', geom: bodyGeom },
                { name: 'armL', geom: armGeom },
                { name: 'armR', geom: armGeom },
                { name: 'legL', geom: legGeom },
                { name: 'legR', geom: legGeom }
            ];

            // InstancedMeshの生成とシーンへの追加
            partsDef.forEach(def => {
                const meshSolid = new THREE.InstancedMesh(def.geom, matSolid, HUMAN_COUNT);
                const meshWire = new THREE.InstancedMesh(def.geom, matWire, HUMAN_COUNT);
                
                scene.add(meshSolid);
                scene.add(meshWire);
                
                humanParts.push({
                    name: def.name,
                    solid: meshSolid,
                    wire: meshWire
                });
            });

            // 各インベーダーの初期データ生成
            let index = 0;
            for (let level = 0; level < LEVELS; level++) {
                for (let row = 0; row < ROWS; row++) {
                    for (let col = 0; col < COLS; col++) {
                        const x = (col - COLS / 2 + 0.5) * spacingX;
                        const z = (row - ROWS / 2 + 0.5) * spacingZ;
                        const y = level * spacingY - (LEVELS * spacingY) / 2;

                        humansData.push({
                            index: index,
                            x: x,
                            z: z,
                            baseY: y,
                            hueOffset: (col / COLS + row / ROWS + level / LEVELS) * 0.3,
                            // 列ごとに動きのタイミングを少しずらす
                            phaseOffset: (col % 2) * 0.2
                        });
                        index++;
                    }
                }
            }
        }

        function createParticles() {
            const particleCount = 8000;
            const particleGeom = new THREE.BufferGeometry();
            const posArray = new Float32Array(particleCount * 3);

            for(let i = 0; i < particleCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 200;
            }
            particleGeom.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

            const particleMat = new THREE.PointsMaterial({
                size: 0.3,
                color: 0x00ffff,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending
            });

            particles = new THREE.Points(particleGeom, particleMat);
            scene.add(particles);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        // 毎フレームの更新処理
        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();
            const delta = clock.getDelta();

            // ビート計算 (VJ特有のパルスやガクガクした動きを作る)
            const currentBeat = Math.floor(time / beatTime);
            const beatPhase = (time % beatTime) / beatTime; // 0.0 ~ 1.0

            // イージングをかけて、ビートの瞬間に素早く動き、その後止まるような補間
            // easeOutExpo のようなカーブ
            const easeOut = 1.0 - Math.pow(2, -10 * beatPhase);
            
            // 全体の下降量 (ビートに合わせてガクッと落ちる)
            const globalDrop = (currentBeat + easeOut) * 2.0;
            const loopSize = LEVELS * spacingY;

            // ビート時のフラッシュエフェクト
            const flash = Math.max(0, 1.0 - beatPhase * 4.0);

            const dummy = new THREE.Object3D();
            const dummyColor = new THREE.Color();
            const S = 1.0;

            // 各インベーダーの行列更新
            for (let i = 0; i < HUMAN_COUNT; i++) {
                const h = humansData[i];

                // Y座標の計算 (ループ処理)
                let currentY = h.baseY - globalDrop;
                currentY = ((currentY % loopSize) + loopSize) % loopSize - loopSize / 2;

                // インベーダー特有の2コマアニメ風のポーズ計算
                // 列ごとのオフセットを加えて波打つようにする
                const localBeat = currentBeat + Math.floor(h.phaseOffset * 2);
                const poseAngle = (localBeat % 2 === 0) ? easeOut : (1 - easeOut);

                // 歩行アニメーション (前後スイング)
                // poseAngle(0.0 ~ 1.0) を -1.0 ~ 1.0 に変換
                const swing = poseAngle * 2.0 - 1.0;
                
                // 振幅の最大角度 (ラジアン)
                const maxSwing = 0.8; 

                // 腕は前後に振る。少し外側に開く角度は固定
                const armRotX_L = swing * maxSwing;
                const armRotX_R = -swing * maxSwing;

                // 足は腕と逆に前後に振る。横の開きはなし
                const legRotX_L = -swing * maxSwing;
                const legRotX_R = swing * maxSwing;

                // 歩行のバウンス (足が揃う時に少し高くなる)
                const walkBounce = (1.0 - Math.abs(swing)) * 0.8;

                // 色の計算 (時間と位置で色相が変化 + ビートで白くフラッシュ)
                const hue = (time * 0.1 + h.hueOffset) % 1.0;
                dummyColor.setHSL(hue, 1.0, 0.4 + flash * 0.4);

                const px = h.x;
                const py = currentY + walkBounce; // バウンスを適用
                const pz = h.z;

                // --- 1. Head ---
                dummy.position.set(px, py + S*1.6, pz);
                // 歩きに合わせて頭を少しうなずかせる
                dummy.rotation.set(Math.abs(swing) * 0.2, 0, 0); 
                dummy.scale.setScalar(1.0 + flash * 0.2); // ビートで膨張
                dummy.updateMatrix();
                setInstanceData('head', i, dummy.matrix, dummyColor);

                // --- 2. Body ---
                dummy.position.set(px, py, pz);
                // 胴体も歩行に合わせて少し前傾・左右に揺らす
                dummy.rotation.set(0.1, 0, swing * 0.1);
                dummy.scale.setScalar(1.0);
                dummy.updateMatrix();
                setInstanceData('body', i, dummy.matrix, dummyColor);

                // --- 3. Left Arm ---
                dummy.position.set(px - S*1.0, py + S*0.8, pz);
                dummy.rotation.set(armRotX_L, 0, 0.1); // 外側に少し広げつつ前後
                dummy.updateMatrix();
                setInstanceData('armL', i, dummy.matrix, dummyColor);

                // --- 4. Right Arm ---
                dummy.position.set(px + S*1.0, py + S*0.8, pz);
                dummy.rotation.set(armRotX_R, 0, -0.1);
                dummy.updateMatrix();
                setInstanceData('armR', i, dummy.matrix, dummyColor);

                // --- 5. Left Leg ---
                dummy.position.set(px - S*0.4, py - S*1.0, pz);
                dummy.rotation.set(legRotX_L, 0, 0); // 前後に振る
                dummy.updateMatrix();
                setInstanceData('legL', i, dummy.matrix, dummyColor);

                // --- 6. Right Leg ---
                dummy.position.set(px + S*0.4, py - S*1.0, pz);
                dummy.rotation.set(legRotX_R, 0, 0);
                dummy.updateMatrix();
                setInstanceData('legR', i, dummy.matrix, dummyColor);
            }

            // GPUへ更新フラグを送信
            humanParts.forEach(part => {
                part.solid.instanceMatrix.needsUpdate = true;
                part.wire.instanceMatrix.needsUpdate = true;
                if(part.wire.instanceColor) part.wire.instanceColor.needsUpdate = true;
            });

            // パーティクル（データストリーム）のアニメーション
            // ビートの瞬間に強烈に加速させる
            const baseSpeed = 20;
            const burstSpeed = 150 * flash;
            const particleSpeed = baseSpeed + burstSpeed;
            const positions = particles.geometry.attributes.position.array;
            
            for(let i = 1; i < positions.length; i += 3) {
                positions[i] += particleSpeed * (1/60); // 上に向かって流れる
                if(positions[i] > 100) positions[i] -= 200; // 上端まで行ったら下へループ
            }
            particles.geometry.attributes.position.needsUpdate = true;

            // OrbitControlsの更新 (自動回転)
            controls.update();

            // Composerによるポストプロセス描画
            composer.render();
        }

        // 各部位のInstancedMeshに行列と色をセットするヘルパー関数
        function setInstanceData(partName, index, matrix, color) {
            const part = humanParts.find(p => p.name === partName);
            if (part) {
                part.solid.setMatrixAt(index, matrix);
                part.wire.setMatrixAt(index, matrix);
                part.wire.setColorAt(index, color);
            }
        }
    </script>
</body>
</html>
