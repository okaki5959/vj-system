<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win95 Text Particle Motion Graphics</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: monospace;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ff00;
            font-size: 24px;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 0 5px #00ff00;
        }
    </style>
</head>
<body>
    <div id="loading">INITIALIZING SYSTEM...</div>

    <!-- Three.js と OrbitControls の読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- 設定・定数 ---
        const PARTICLE_COUNT = 60000;
        const CHARSET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+-=[]{}|;':,./<>? "; // 64文字 (最後はスペース)
        const P_SIZE = 0.25; // パーティクルの間隔

        let scene, camera, renderer, controls;
        let particleGeometry, particleMaterial;
        
        // URLパラメータでステート固定
        const _urlParams = new URLSearchParams(window.location.search);
        const _lockedScene = _urlParams.has('scene') ? parseInt(_urlParams.get('scene')) : -1;

        // 状態データ配列 [Random, Win95, BSoD]
        const states = [];
        let currentStateIdx = _lockedScene >= 0 ? _lockedScene : 0;
        let nextStateIdx = _lockedScene >= 0 ? _lockedScene : 1;
        let stateLocked = _lockedScene >= 0;

        let progress = 1.0;
        let transitionTimer = 0;

        // --- シェーダー定義 ---
        const vertexShader = `
            attribute vec3 targetPosition;
            attribute vec3 targetColor;
            attribute float charIndex;
            attribute float targetCharIndex;
            attribute float randomDelay;

            varying vec3 vColor;
            varying float vCharIndex;

            uniform float time;
            uniform float progress;

            // イージング関数
            float easeInOutCubic(float x) {
                return x < 0.5 ? 4.0 * x * x * x : 1.0 - pow(-2.0 * x + 2.0, 3.0) / 2.0;
            }

            void main() {
                // パーティクルごとに遷移のタイミングをずらす
                float p = clamp((progress - randomDelay * 0.4) / 0.6, 0.0, 1.0);
                p = easeInOutCubic(p);

                // 位置と色の補間
                vec3 currentPos = mix(position, targetPosition, p);
                vColor = mix(color, targetColor, p);

                // 文字の切り替え（半分を過ぎたら次の文字へ）
                vCharIndex = p < 0.5 ? charIndex : targetCharIndex;

                // 常にわずかに浮遊させるノイズ
                currentPos.y += sin(time * 1.5 + position.x * 0.1) * 0.15;
                currentPos.x += cos(time * 1.2 + position.y * 0.1) * 0.15;

                vec4 mvPosition = modelViewMatrix * vec4(currentPos, 1.0);
                
                // カメラからの距離に応じてパーティクルサイズを調整
                gl_PointSize = 32.0 * (25.0 / -mvPosition.z);
                gl_Position = projectionMatrix * mvPosition;
            }
        `;

        const fragmentShader = `
            uniform sampler2D map;
            varying vec3 vColor;
            varying float vCharIndex;

            void main() {
                // 8x8のテクスチャアトラスから該当する文字のUVを計算
                float cols = 8.0;
                float col = mod(vCharIndex, cols);
                float row = floor(vCharIndex / cols);

                vec2 uv = gl_PointCoord;
                uv.x = (uv.x + col) / cols;
                uv.y = (uv.y + row) / cols;

                vec4 texColor = texture2D(map, uv);
                
                // 文字のピクセルが透明な部分は描画しない
                if (texColor.a < 0.2) discard;

                gl_FragColor = vec4(vColor, 1.0);
            }
        `;

        // --- データ生成ヘルパー ---
        
        function getCharIndex(charStr) {
            let idx = CHARSET.indexOf(charStr.toUpperCase());
            return idx !== -1 ? idx : 63; // 見つからなければスペース
        }

        function createCharTextureAtlas() {
            const canvas = document.createElement('canvas');
            const size = 1024;
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            ctx.clearRect(0, 0, size, size);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 90px "Courier New", Courier, monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const gridSize = 8;
            const cellSize = size / gridSize;

            for(let i=0; i<64; i++) {
                let col = i % gridSize;
                let row = Math.floor(i / gridSize);
                let x = col * cellSize + cellSize / 2;
                let y = row * cellSize + cellSize / 2;
                if(i < CHARSET.length) {
                    ctx.fillText(CHARSET[i], x, y);
                }
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.flipY = false; // UV計算を簡単にするため反転しない
            return texture;
        }

        class StateBuilder {
            constructor() {
                this.positions = new Float32Array(PARTICLE_COUNT * 3);
                this.colors = new Float32Array(PARTICLE_COUNT * 3);
                this.chars = new Float32Array(PARTICLE_COUNT);
                this.idx = 0;
            }

            addP(x, y, z, r, g, b, charStr) {
                if (this.idx >= PARTICLE_COUNT) return;
                let i = this.idx;
                this.positions[i*3] = x;
                this.positions[i*3+1] = y;
                this.positions[i*3+2] = z;
                this.colors[i*3] = r / 255;
                this.colors[i*3+1] = g / 255;
                this.colors[i*3+2] = b / 255;
                this.chars[i] = getCharIndex(charStr);
                this.idx++;
            }

            drawRect(x, y, z, w, h, hexColor, charStr) {
                let r = (hexColor >> 16) & 255;
                let g = (hexColor >> 8) & 255;
                let b = hexColor & 255;
                for(let i=0; i<w; i++) {
                    for(let j=0; j<h; j++) {
                        this.addP(x + i*P_SIZE, y - j*P_SIZE, z, r, g, b, charStr);
                    }
                }
            }

            drawText(x, y, z, text, hexColor) {
                let r = (hexColor >> 16) & 255;
                let g = (hexColor >> 8) & 255;
                let b = hexColor & 255;
                for(let i=0; i<text.length; i++) {
                    this.addP(x + i*P_SIZE, y, z, r, g, b, text[i]);
                }
            }
        }

        // --- 各状態の構築 ---

        function createRandomState() {
            const builder = new StateBuilder();
            for(let i=0; i<PARTICLE_COUNT; i++) {
                // 球状にランダム配置
                let radius = 20 + Math.random() * 40;
                let theta = Math.random() * Math.PI * 2;
                let phi = Math.acos((Math.random() * 2) - 1);
                
                let px = radius * Math.sin(phi) * Math.cos(theta);
                let py = radius * Math.sin(phi) * Math.sin(theta);
                let pz = radius * Math.cos(phi);
                
                let charStr = CHARSET[Math.floor(Math.random() * 63)];
                // マトリックス風の緑系の色
                let g = 100 + Math.random() * 155;
                builder.addP(px, py, pz, 0, g, 0, charStr);
            }
            return builder;
        }

        function createWin95State() {
            const builder = new StateBuilder();
            
            // 1. デスクトップ背景 (Teal: #008080)
            // 規則的なグリッドで配置して壁紙っぽく
            let bgW = 160, bgH = 120;
            let startX = -bgW * P_SIZE / 2;
            let startY = bgH * P_SIZE / 2;
            for(let i=0; i<30000; i++) { // 背景に約半分を使用
                let px = startX + (Math.random() * bgW) * P_SIZE;
                let py = startY - (Math.random() * bgH) * P_SIZE;
                let pz = -5 - Math.random() * 2; // 少し奥に
                builder.addP(px, py, pz, 0, 128, 128, '.');
            }

            // 2. タスクバー
            let tbY = startY - bgH * P_SIZE + 2;
            builder.drawRect(startX, tbY, 0, bgW, 5, 0xc0c0c0, '=');
            builder.drawRect(startX, tbY, 0.1, bgW, 1, 0xffffff, '-'); // ハイライト
            // Startボタン
            builder.drawRect(startX+1, tbY-0.5, 0.2, 12, 4, 0xc0c0c0, '#');
            builder.drawRect(startX+1, tbY-0.5, 0.3, 12, 1, 0xffffff, '-');
            builder.drawRect(startX+12*P_SIZE, tbY-0.5, 0.3, 1, 4, 0x000000, '|');
            builder.drawRect(startX+1, tbY-4*P_SIZE, 0.3, 12, 1, 0x000000, '-');
            builder.drawText(startX+3*P_SIZE, tbY-1.5*P_SIZE, 0.4, "Start", 0x000000);

            // 3. ウィンドウ1 (My Computer)
            let wx = -15, wy = 10, wz = 2;
            let ww = 45, wh = 35;
            // ベースと枠
            builder.drawRect(wx, wy, wz, ww, wh, 0xc0c0c0, '%');
            builder.drawRect(wx, wy, wz, ww, 1, 0xffffff, '=');
            builder.drawRect(wx, wy, wz, 1, wh, 0xffffff, '|');
            builder.drawRect(wx, wy-(wh-1)*P_SIZE, wz, ww, 1, 0x000000, '=');
            builder.drawRect(wx+(ww-1)*P_SIZE, wy, wz, 1, wh, 0x000000, '|');
            // タイトルバー
            builder.drawRect(wx+1*P_SIZE, wy-1*P_SIZE, wz+0.1, ww-2, 4, 0x000080, '@');
            builder.drawText(wx+2*P_SIZE, wy-2*P_SIZE, wz+0.2, "My Computer", 0xffffff);
            // 閉じるボタン
            builder.drawRect(wx+(ww-5)*P_SIZE, wy-1.5*P_SIZE, wz+0.2, 4, 3, 0xc0c0c0, '#');
            builder.drawText(wx+(ww-4)*P_SIZE, wy-2.5*P_SIZE, wz+0.3, "X", 0x000000);
            // コンテンツ (アイコンとテキスト)
            builder.drawRect(wx+4*P_SIZE, wy-8*P_SIZE, wz+0.1, 8, 6, 0xffffff, '0');
            builder.drawRect(wx+14*P_SIZE, wy-8*P_SIZE, wz+0.1, 8, 6, 0xffffff, '0');
            builder.drawText(wx+4*P_SIZE, wy-15*P_SIZE, wz+0.1, "3.5 Floppy", 0x000000);
            builder.drawText(wx+15*P_SIZE, wy-15*P_SIZE, wz+0.1, "Drive C:", 0x000000);

            // 4. ウィンドウ2 (Error Dialog) 手前にポップアップ
            wx = -2, wy = -2, wz = 8;
            ww = 55, wh = 25;
            builder.drawRect(wx, wy, wz, ww, wh, 0xc0c0c0, '#');
            builder.drawRect(wx, wy, wz, ww, 1, 0xffffff, '=');
            builder.drawRect(wx, wy, wz, 1, wh, 0xffffff, '|');
            builder.drawRect(wx, wy-(wh-1)*P_SIZE, wz, ww, 1, 0x000000, '=');
            builder.drawRect(wx+(ww-1)*P_SIZE, wy, wz, 1, wh, 0x000000, '|');
            // タイトル
            builder.drawRect(wx+1*P_SIZE, wy-1*P_SIZE, wz+0.1, ww-2, 4, 0x000080, '@');
            builder.drawText(wx+2*P_SIZE, wy-2.5*P_SIZE, wz+0.2, "Error", 0xffffff);
            // 閉じる
            builder.drawRect(wx+(ww-5)*P_SIZE, wy-1.5*P_SIZE, wz+0.2, 4, 3, 0xc0c0c0, '#');
            builder.drawText(wx+(ww-3.5)*P_SIZE, wy-2.5*P_SIZE, wz+0.3, "X", 0x000000);
            // 警告アイコン (黄色の三角を文字で表現)
            builder.drawRect(wx+3*P_SIZE, wy-8*P_SIZE, wz+0.1, 8, 8, 0xffff00, 'A');
            builder.drawText(wx+6.5*P_SIZE, wy-11*P_SIZE, wz+0.2, "!", 0x000000);
            // テキスト
            builder.drawText(wx+14*P_SIZE, wy-9*P_SIZE, wz+0.1, "A fatal exception 0E has", 0x000000);
            builder.drawText(wx+14*P_SIZE, wy-11.5*P_SIZE, wz+0.1, "occurred at 0028:C0011E36.", 0x000000);
            // OKボタン
            builder.drawRect(wx+22*P_SIZE, wy-18*P_SIZE, wz+0.1, 10, 4, 0xc0c0c0, '#');
            builder.drawRect(wx+22*P_SIZE, wy-18*P_SIZE, wz+0.2, 10, 1, 0xffffff, '-');
            builder.drawRect(wx+22*P_SIZE, wy-21*P_SIZE, wz+0.2, 10, 1, 0x000000, '-');
            builder.drawText(wx+26*P_SIZE, wy-19.5*P_SIZE, wz+0.3, "OK", 0x000000);

            // 残りのパーティクルはランダムなノイズとして背景に散らす
            while(builder.idx < PARTICLE_COUNT) {
                let px = (Math.random() - 0.5) * 150;
                let py = (Math.random() - 0.5) * 150;
                let pz = (Math.random() - 0.5) * 50 - 10;
                let r = Math.random() > 0.5 ? 192 : 128; // Silver or DarkGray
                builder.addP(px, py, pz, r, r, r, ',');
            }
            return builder;
        }

        function createBSoDState() {
            const builder = new StateBuilder();
            let cols = 120;
            let rows = 90;
            let startX = -cols * P_SIZE / 2;
            let startY = rows * P_SIZE / 2;

            const textLines = [
                "Windows",
                "",
                "A fatal exception 0E has occurred at 0028:C0011E36 in VXD VMM(01)",
                "+ 00010E36. The current application will be terminated.",
                "",
                "* Press any key to terminate the current application.",
                "* Press CTRL+ALT+DEL again to restart your computer. You will",
                "   lose any unsaved information in all applications.",
                "",
                "Press any key to continue _"
            ];

            // 画面をブルースクリーンの青色文字で埋める
            for(let i=0; i<PARTICLE_COUNT; i++) {
                let col = i % cols;
                let row = Math.floor(i / cols);
                
                // グリッドをはみ出た分はランダム配置
                let px, py, pz;
                if (row < rows) {
                    px = startX + col * P_SIZE;
                    py = startY - row * P_SIZE;
                    pz = (Math.random() - 0.5) * 2.0; // 少し奥行きを歪ませる（グリッチ感）
                } else {
                    px = (Math.random() - 0.5) * 150;
                    py = (Math.random() - 0.5) * 150;
                    pz = (Math.random() - 0.5) * 100 - 50;
                }

                let r = 0, g = 0, b = 170; // BSoD Blue #0000aa
                let charStr = ['=', '-', ':', '.', ' '][Math.floor(Math.random()*5)]; // 背景用文字

                // テキスト部分の判定
                if (row > 10 && row <= 10 + textLines.length && col > 10) {
                    let line = textLines[row - 11];
                    let textCol = col - 11;
                    
                    // "Windows" の部分はセンタリング風に
                    if (row === 11) {
                        textCol = col - Math.floor(cols/2) + 3;
                    }

                    if (textCol >= 0 && textCol < line.length) {
                        charStr = line[textCol];
                        r = 255; g = 255; b = 255; // 白文字
                    }
                }

                // グリッチエフェクト（たまに赤い文字や変な記号を混ぜる）
                if (Math.random() < 0.005) {
                    r = 255; g = 0; b = 0;
                    charStr = '!';
                    pz += 5;
                }

                builder.addP(px, py, pz, r, g, b, charStr);
            }
            return builder;
        }

        // --- アニメーション・トランジション ---

        function triggerTransition() {
            currentStateIdx = nextStateIdx;
            nextStateIdx = (nextStateIdx + 1) % states.length;

            const cur = states[currentStateIdx];
            const nxt = states[nextStateIdx];

            // CPU側でバッファを更新して次のターゲットを設定
            const posAttr = particleGeometry.attributes.position;
            const colAttr = particleGeometry.attributes.color;
            const charAttr = particleGeometry.attributes.charIndex;
            
            const tPosAttr = particleGeometry.attributes.targetPosition;
            const tColAttr = particleGeometry.attributes.targetColor;
            const tCharAttr = particleGeometry.attributes.targetCharIndex;

            posAttr.array.set(cur.positions);
            colAttr.array.set(cur.colors);
            charAttr.array.set(cur.chars);

            tPosAttr.array.set(nxt.positions);
            tColAttr.array.set(nxt.colors);
            tCharAttr.array.set(nxt.chars);

            posAttr.needsUpdate = true;
            colAttr.needsUpdate = true;
            charAttr.needsUpdate = true;
            tPosAttr.needsUpdate = true;
            tColAttr.needsUpdate = true;
            tCharAttr.needsUpdate = true;

            progress = 0.0;
        }

        function init() {
            // シーン、カメラ、レンダラー
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 35);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;

            // テクスチャアトラス生成
            const charTexture = createCharTextureAtlas();

            // 状態データの生成
            states.push(createRandomState()); // 0: Random (Matrix style)
            states.push(createWin95State());  // 1: Windows 95 UI
            states.push(createBSoDState());   // 2: Blue Screen of Death

            // Geometry初期設定
            particleGeometry = new THREE.BufferGeometry();
            
            // 初期の属性用配列（状態0から状態1への遷移前としてセット）
            const curState = states[0];
            const nxtState = states[1];
            
            // randomDelayは全体で共通
            const randomDelays = new Float32Array(PARTICLE_COUNT);
            for(let i=0; i<PARTICLE_COUNT; i++) {
                randomDelays[i] = Math.random();
            }

            particleGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(curState.positions), 3));
            particleGeometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(curState.colors), 3));
            particleGeometry.setAttribute('charIndex', new THREE.BufferAttribute(new Float32Array(curState.chars), 1));
            
            particleGeometry.setAttribute('targetPosition', new THREE.BufferAttribute(new Float32Array(nxtState.positions), 3));
            particleGeometry.setAttribute('targetColor', new THREE.BufferAttribute(new Float32Array(nxtState.colors), 3));
            particleGeometry.setAttribute('targetCharIndex', new THREE.BufferAttribute(new Float32Array(nxtState.chars), 1));
            
            particleGeometry.setAttribute('randomDelay', new THREE.BufferAttribute(randomDelays, 1));

            // マテリアル設定
            particleMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0.0 },
                    progress: { value: 0.0 },
                    map: { value: charTexture }
                },
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                transparent: true,
                depthWrite: false, // 重なり時の描画順序問題を緩和
                blending: THREE.AdditiveBlending, // 光るような表現
                vertexColors: true // これを追加
            });

            const particleSystem = new THREE.Points(particleGeometry, particleMaterial);
            scene.add(particleSystem);

            document.getElementById('loading').style.display = 'none';

            window.addEventListener('resize', onWindowResize);
        }

        function animate(time) {
            requestAnimationFrame(animate);

            // ステートマシンの進行
            if (progress < 1.0) {
                progress += 0.005; // 遷移速度 (約3秒)
                if (progress >= 1.0) {
                    progress = 1.0;
                    transitionTimer = 0; // 状態キープ開始
                }
            } else {
                transitionTimer++;
                // 状態キープ時間
                let holdTime = currentStateIdx === 1 ? 300 : 180; // Win95状態は少し長めに表示
                if (!stateLocked && transitionTimer > holdTime) {
                    triggerTransition();
                }
            }

            controls.update();

            // シェーダーに変数を送る
            particleMaterial.uniforms.progress.value = progress;
            particleMaterial.uniforms.time.value = time * 0.001;

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 初期化実行 ---
        // クラスや関数の定義がすべて終わった後に呼び出します。
        init();
        animate();
    </script>
</body>
</html>
