<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Cyberspace - VJ Loop</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(0, 255, 204, 0.8);
            pointer-events: none;
            z-index: 10;
        }
        .glitch-text {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 5px rgba(0, 255, 204, 0.8);
            animation: blink 2s infinite;
        }
        .sys-info {
            font-size: 0.8rem;
            margin-top: 10px;
            line-height: 1.5;
            opacity: 0.7;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
            52% { opacity: 0.9; }
            54% { opacity: 0.2; }
            56% { opacity: 1; }
        }
    </style>
    <!-- Three.jsとPostProcessingをESモジュールとして読み込むためのImport Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui-layer">
        <div class="glitch-text">SYS.DIVE_INITIALIZED</div>
        <div class="sys-info">
            > ORBIT_CONTROLS: ENABLED<br>
            > DATA_STREAM: ACTIVE<br>
            > SECURITY_LEVEL: C<br>
            > STAND_ALONE_COMPLEX
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- シーン・カメラ・レンダラーのセットアップ ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        // 電脳空間特有の深みとフォグ
        scene.fog = new THREE.FogExp2(0x000510, 0.003);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 40);

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- ポストプロセッシング (Bloom効果で光らせる) ---
        const renderScene = new RenderPass(scene, camera);
        // 解像度, 強さ, 半径, 閾値
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 2.0, 0.5, 0.1);
        
        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- コントロール (OrbitControls) ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true; // ゆっくり自動回転させる
        controls.autoRotateSpeed = 0.5;

        // --- オブジェクトの生成 ---

        // 空間全体を包むグループ（カメラの相対的な移動効果用）
        const worldGroup = new THREE.Group();
        scene.add(worldGroup);

        // 1. 周囲のワイヤーフレームチューブ（空間の広がり）
        const tubeGeo = new THREE.CylinderGeometry(80, 80, 500, 32, 50, true);
        const tubeMat = new THREE.MeshBasicMaterial({
            color: 0x0033aa,
            wireframe: true,
            transparent: true,
            opacity: 0.15,
            blending: THREE.AdditiveBlending
        });
        const tube = new THREE.Mesh(tubeGeo, tubeMat);
        tube.rotation.x = Math.PI / 2;
        worldGroup.add(tube);

        // 2. 中央のデータコア（複合ジオメトリ）
        const coreGroup = new THREE.Group();
        worldGroup.add(coreGroup);

        // コアの内側
        const innerCoreGeo = new THREE.IcosahedronGeometry(5, 1);
        const innerCoreMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true });
        const innerCore = new THREE.Mesh(innerCoreGeo, innerCoreMat);
        coreGroup.add(innerCore);

        // コアの外側のリング（複数）
        const ringColors = [0x00ff88, 0x00ffff, 0x0055ff];
        const rings = [];
        for (let i = 0; i < 3; i++) {
            const ringGeo = new THREE.TorusGeometry(10 + i * 3, 0.1, 16, 100);
            const ringMat = new THREE.MeshBasicMaterial({ 
                color: ringColors[i],
                transparent: true,
                opacity: 0.8
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.random() * Math.PI;
            ring.rotation.y = Math.random() * Math.PI;
            rings.push({ mesh: ring, speedX: (Math.random() - 0.5) * 0.05, speedY: (Math.random() - 0.5) * 0.05 });
            coreGroup.add(ring);
        }

        // 3. ビュンビュン飛ぶ光線 (データストリーム / レーザー)
        const lasers = [];
        const laserCount = 300;
        const laserGeo = new THREE.CylinderGeometry(0.1, 0.1, 15, 4);
        laserGeo.rotateX(Math.PI / 2); // Z軸方向に向ける

        for (let i = 0; i < laserCount; i++) {
            // ランダムにシアン系とライムグリーン系を混ぜる
            const color = Math.random() > 0.5 ? 0x00ff88 : 0x00ffff;
            const laserMat = new THREE.MeshBasicMaterial({ 
                color: color, 
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending
            });
            const laser = new THREE.Mesh(laserGeo, laserMat);

            // チューブ内側にランダム配置
            const radius = Math.random() * 70 + 10;
            const theta = Math.random() * Math.PI * 2;
            laser.position.x = radius * Math.cos(theta);
            laser.position.y = radius * Math.sin(theta);
            laser.position.z = (Math.random() - 0.5) * 500;
            
            // 各レーザーの速度をランダムに
            laser.userData = { speed: Math.random() * 4 + 2 };
            
            worldGroup.add(laser);
            lasers.push(laser);
        }

        // 4. データダスト (パーティクル)
        const particlesGeo = new THREE.BufferGeometry();
        const particleCount = 2000;
        const posArray = new Float32Array(particleCount * 3);
        
        for(let i = 0; i < particleCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 200;
        }
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        
        const particleMat = new THREE.PointsMaterial({
            size: 0.3,
            color: 0x00ffcc,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });
        const particlesMesh = new THREE.Points(particlesGeo, particleMat);
        worldGroup.add(particlesMesh);

        // --- リサイズ処理 ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- アニメーションループ ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // 位置は原点に固定し、空間全体を回転させることで
            // 中心の球体が常に視界に入りつつ、様々な角度から回り込むように見える
            worldGroup.position.set(0, 0, 0); 
            worldGroup.rotation.x = Math.sin(time * 0.15) * 0.6; // 上下方向の視点移動
            worldGroup.rotation.y = time * 0.2; // 横方向の旋回
            worldGroup.rotation.z = Math.sin(time * 0.1) * 0.3; // 機体が傾くようなローリング効果

            // コアとチューブの回転
            innerCore.rotation.x += 0.01;
            innerCore.rotation.y += 0.015;
            tube.rotation.y += 0.002;

            // リングの回転
            rings.forEach(ringObj => {
                ringObj.mesh.rotation.x += ringObj.speedX;
                ringObj.mesh.rotation.y += ringObj.speedY;
            });

            // パーティクルの緩やかな動き
            particlesMesh.rotation.z = time * 0.05;

            // 光線の高速移動 (Z軸プラス方向へ)
            lasers.forEach(laser => {
                laser.position.z += laser.userData.speed;
                // カメラの後ろに通り過ぎたら、奥（マイナス方向）へリセット
                if (laser.position.z > 50) {
                    laser.position.z = -400 - Math.random() * 100;
                }
            });

            // Bloom効果の明滅（VPMに合わせたようなパルス効果）
            bloomPass.strength = 1.8 + Math.sin(time * 5) * 0.4;

            controls.update(); // OrbitControlsの更新
            
            // renderer.render(scene, camera); // 通常のレンダリングではなくComposerを使う
            composer.render();
        }

        animate();
    </script>
</body>
</html>
