<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8-Bit Motion Graphics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        /* ピクセルアートをくっきりと拡大するための魔法のCSS */
        #motionCanvas {
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            width: 100%;
            height: 100%;
            object-fit: contain; /* アスペクト比を維持 */
            max-width: 1280px;
        }
    </style>
</head>
<body>

    <canvas id="motionCanvas"></canvas>

    <script>
        // --- 設定と初期化 ---
        const canvas = document.getElementById('motionCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        // 8bit風の低解像度に設定 (16:9)
        const WIDTH = 320;
        const HEIGHT = 180;
        canvas.width = WIDTH;
        canvas.height = HEIGHT;

        // カラーパレット (サイバーパンク・シンセウェイヴ風)
        const PALETTE = {
            bg: '#0a0510',
            grid: '#e83b5e',
            textMain: '#faff61',
            textShadow: '#35c9a4',
            stars: ['#ffffff', '#35c9a4', '#431354'],
            particles: ['#e83b5e', '#35c9a4', '#faff61', '#ffffff']
        };

        // 表示するテキストのリスト
        const TEXTS = ["8-BIT", "MOTION", "GRAPHICS", "RETRO", "CANVAS"];
        let currentTextIndex = 0;
        let textTimer = 0;

        // グローバルな時間
        let frames = 0;

        // --- オブジェクト群 ---

        // 星空
        const stars = Array.from({ length: 60 }, () => ({
            x: Math.random() * WIDTH,
            y: Math.random() * (HEIGHT * 0.6), // 上半分に配置
            speed: Math.random() * 0.5 + 0.1,
            color: PALETTE.stars[Math.floor(Math.random() * PALETTE.stars.length)],
            size: Math.random() > 0.9 ? 2 : 1 // たまに大きい星
        }));

        // パーティクル（ブロック）
        let particles = [];
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = (Math.random() - 0.5) * 6;
                this.size = Math.floor(Math.random() * 3 + 1) * 2; // 2, 4, 6のブロック
                this.color = PALETTE.particles[Math.floor(Math.random() * PALETTE.particles.length)];
                this.life = 1.0;
                this.decay = Math.random() * 0.02 + 0.01;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.1; // 重力
                this.life -= this.decay;
            }
            draw(ctx) {
                if (this.life <= 0) return;
                ctx.fillStyle = this.color;
                // ピクセル感を出すために整数座標で描画
                ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.size, this.size);
            }
        }

        // --- 描画関数 ---

        // 背景のクリア
        function drawBackground() {
            ctx.fillStyle = PALETTE.bg;
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
        }

        // 星空の描画
        function drawStars() {
            stars.forEach(star => {
                star.x -= star.speed;
                if (star.x < 0) star.x = WIDTH;
                
                // チカチカさせる
                if (Math.random() > 0.05) {
                    ctx.fillStyle = star.color;
                    ctx.fillRect(Math.floor(star.x), Math.floor(star.y), star.size, star.size);
                }
            });
        }

        // 3D風のワイヤーフレームグリッドを描画
        function drawGrid() {
            const horizonY = HEIGHT * 0.55;
            ctx.strokeStyle = PALETTE.grid;
            ctx.lineWidth = 1;

            // 水平線
            ctx.beginPath();
            ctx.moveTo(0, horizonY);
            ctx.lineTo(WIDTH, horizonY);
            ctx.stroke();

            // 手前に向かってくる横線
            let speed = (frames * 0.5) % 10;
            for (let i = 0; i < 10; i++) {
                let y = horizonY + Math.pow(i + speed / 10, 2) * 1.5;
                if (y > horizonY && y < HEIGHT) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(WIDTH, y);
                    ctx.stroke();
                }
            }

            // 放射状の縦線
            const centerX = WIDTH / 2;
            for (let i = -10; i <= 10; i++) {
                ctx.beginPath();
                ctx.moveTo(centerX + i * 10, horizonY);
                ctx.lineTo(centerX + i * 50, HEIGHT);
                ctx.stroke();
            }
        }

        // テキストの描画 (エコー/影付き)
        function drawText() {
            const text = TEXTS[currentTextIndex];
            ctx.font = '24px "Press Start 2P", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const x = WIDTH / 2;
            const y = HEIGHT / 2 - 10;

            // 登場時のスケールアニメーション
            let scale = 1;
            if (textTimer < 10) {
                scale = textTimer / 10;
            } else if (textTimer > 80) {
                scale = (100 - textTimer) / 20;
            }
            if(scale < 0) scale = 0;

            ctx.save();
            ctx.translate(x, y);
            
            // ビートに合わせたバウンス
            const bounce = Math.sin(frames * 0.2) * 2;
            ctx.translate(0, bounce);
            
            ctx.scale(scale, scale);

            // 残像（エコー）
            const offset = Math.sin(frames * 0.1) * 4;
            ctx.fillStyle = PALETTE.textShadow;
            ctx.fillText(text, -offset, offset);
            ctx.fillStyle = PALETTE.grid;
            ctx.fillText(text, offset, -offset);

            // メインテキスト
            ctx.fillStyle = PALETTE.textMain;
            ctx.fillText(text, 0, 0);

            ctx.restore();
        }

        // グリッチエフェクト (ランダムなタイミングで画面をズラす)
        function applyGlitch() {
            if (Math.random() > 0.95) {
                const sliceY = Math.random() * HEIGHT;
                const sliceHeight = Math.random() * 10 + 2;
                const offsetX = (Math.random() - 0.5) * 20;
                
                // 画面の一部を切り取って横にズラして描画
                const imageData = ctx.getImageData(0, sliceY, WIDTH, sliceHeight);
                ctx.putImageData(imageData, offsetX, sliceY);
                
                // RGBずらし効果
                ctx.fillStyle = 'rgba(232, 59, 94, 0.5)'; // grid color
                ctx.fillRect(offsetX, sliceY, WIDTH, sliceHeight);
            }
        }

        // スキャンライン (ブラウン管風の横シマ)
        function drawScanlines() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            for (let i = 0; i < HEIGHT; i += 2) {
                ctx.fillRect(0, i, WIDTH, 1);
            }
        }

        // --- メインループ ---

        function animate() {
            frames++;
            textTimer++;

            // テキストの切り替えとパーティクル爆発
            if (textTimer > 100) {
                textTimer = 0;
                currentTextIndex = (currentTextIndex + 1) % TEXTS.length;
                
                // テキストが変わる瞬間にパーティクルを生成
                for(let i = 0; i < 40; i++) {
                    particles.push(new Particle(WIDTH / 2, HEIGHT / 2 - 10));
                }
            }

            drawBackground();
            drawStars();
            drawGrid();

            // パーティクルの更新と描画
            particles.forEach(p => p.update());
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => p.draw(ctx));

            drawText();

            // ポストプロセス
            applyGlitch();
            drawScanlines();

            requestAnimationFrame(animate);
        }

        // フォントがロードされてからアニメーションを開始する
        document.fonts.ready.then(() => {
            // 初期パーティクル
            for(let i = 0; i < 30; i++) {
                particles.push(new Particle(WIDTH / 2, HEIGHT / 2));
            }
            animate();
        }).catch(() => {
            // フォントロード失敗時もフォールバックフォントで開始
            animate();
        });

    </script>
</body>
</html>
